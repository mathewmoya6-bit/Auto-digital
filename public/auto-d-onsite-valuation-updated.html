<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto-D Onsite Valuation</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1426;--panel:#121e36;--line:#26365a;--tx:#e8ecf4;--mut:#8d9bb8;--amb:#f5a623;--ok:#3fb58a;--bad:#e5604d;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Public Sans',system-ui,sans-serif;padding-bottom:120px}
h1,h2,h3{margin:0;font-weight:800}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px}.brand span{color:var(--amb)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.card h2{font-size:16px;margin-bottom:10px;color:var(--amb)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;margin-top:4px;padding:10px;background:#0b1426;border:1px solid var(--line);border-radius:8px;color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amb);outline-offset:1px}
button{font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--tx);cursor:pointer}
button.pri{background:var(--amb);border-color:var(--amb);color:#1a1200}
button.lnk{border:0;padding:4px;color:var(--amb);text-decoration:underline}
.auth{max-width:400px;margin:8vh auto}
.msg{padding:10px;border-radius:8px;margin:10px 0;background:#2a1c1c;border:1px solid var(--bad);color:#ffb4a8}
.msg.good{background:#12281f;border-color:var(--ok);color:#a6ecd0}
.msg.info{background:#16233f;border-color:var(--amb);color:#f3d9a4}
.it{display:grid;grid-template-columns:1fr 110px;gap:6px 8px;padding:10px 0;border-top:1px solid var(--line)}
.it input{grid-column:1/3;margin:0}
.it select{margin:0}
.st.ok{border-color:var(--ok)}.st.issue,.st.major{border-color:var(--bad);background:#2a1c1c}
.rq{color:var(--amb);font-size:11px;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;background:#0f1a30;border-top:2px solid var(--amb);padding:10px 16px;z-index:5}
#bar .in{max-width:860px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.big{font-size:22px;font-weight:800;color:var(--amb)}
.sm{font-size:12px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.row b{white-space:nowrap}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.list .row{cursor:pointer}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.tag.final{border-color:var(--ok);color:var(--ok)}.tag.submitted{border-color:var(--amb);color:var(--amb)}.tag.correction_required,.tag.rejected{border-color:var(--bad);color:var(--bad)}
#toast{position:fixed;top:14px;right:14px;background:var(--ok);color:#04150e;padding:10px 14px;border-radius:8px;font-weight:700;z-index:9;display:none}
.rep{background:#fff;color:#111;padding:24px;border-radius:var(--r)}
.rep .row{border-color:#ddd}.rep h2,.rep h3{color:#111}.rep .sm{color:#555}.rep .big{color:#111}
@media print{body{background:#fff;padding:0}.noprint,.top,#bar{display:none!important}.rep{padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 ['Admin and consent',[['consent','Data Protection Act consent recorded','RRRRRRRRRRRRR']]],

 ['Engine and mechanical',[

  ['gearbox','Gearbox / clutch','ORRROOORRRRRR'],
  ['susp','Suspension and steering play','ORRROOORRORRR'],
  ['brakes','Brakes','ORRROOORRORRR'],
  ['batt','Battery, belts, hoses','OOROOOOOROOOR'],
  ['hybrid','Hybrid / EV battery health (if fitted)','ORROOOORRROOR']]],
 ['Structure and accident',[
  ['struct','Chassis alignment, welds, repairs','RRRROOORRRRRO'],
  ['fire','Flood or fire damage signs','RRRROOORRRRRO'],
  ['dmg_est','Damage extent and repair estimate','---R-----OOO-']]],
 ['Road test and evidence',[

 return gs.map(g=>`<optgroup label="${esc(g)}">${ks.filter(k=>P[k].g===g).map(k=>`<option value="${k}"${k===cur?' selected':''}>${esc(P[k].n)}${S.prices[k]?' · '+KES(S.prices[k].price):''}</option>`).join('')}</optgroup>`).join('')};

function calc(v){
 const p=P[v.purpose],i=v.inputs,A=v.answers,r={lines:[],stops:[],warns:[],missing:[]};
 const has=k=>(p.adj||'').split(/\s+/).includes(k);
 const chk=(l,x,lo,hi)=>{if(x===undefined||x===null||String(x).trim()==='')return;const n=Number(x);if(!Number.isFinite(n)||n<lo||n>hi)r.stops.push(`${l} must be between ${lo} and ${hi}.`)};
 chk('Depreciation %',has('dep')?i.dep:'',0,90);
 chk('Accident / repair deduction %',has('acd')?i.acd:'',0,90);
 chk('Forced-sale haircut %',(p.hc||p.hcopt)?i.hc:'',0,60);
 chk('Accessories value',has('acc')?i.acc:'',0,1e8);
 chk('Odometer (km)',v.vehicle.mileage,0,1500000);
 chk('Year of manufacture',v.vehicle.yom,1950,new Date().getFullYear()+1);
 const parseKES=s=>{const n=parseFloat(String(s).replace(/kes|ksh/gi,'').replace(/[,\s]/g,''));return Number.isFinite(n)&&n>0?n:0};
 const comps=(i.comps||'').split(/[\n;]+/).map(parseKES).filter(x=>x>0).sort((a,b)=>a-b);
 r.n=comps.length;
 let base=0,src='';
 if(!p.noval){
  const c=comps.length>=5?comps.slice(1,-1):comps;
  if(c.length){base=c[Math.floor((c.length-1)/2)]/2+c[Math.floor(c.length/2)]/2;src='comps'}
  else if(num(i.manual)){base=num(i.manual);src='manual'}
  else if(num(i.crsp)){base=num(i.crsp);src='crsp'}
  if(!base)r.stops.push('Enter market comparables or a base value.');
  if(r.n<3)r.warns.push('Fewer than 3 comparables: independent valuer review and documented alternative evidence are required.');
  if(src==='crsp'){
   r.warns.push('CRSP is a reference source, not a substitute for market evidence. Identify the CRSP reference year and exact vehicle variant.');
   if(!i.crsp_id)r.warns.push('CRSP value was typed manually, not selected from the CRSP database.');
   else if(num(i.crsp)!==num(i.crsp_db))r.warns.push(`CRSP value differs from the selected database value (KES ${num(i.crsp_db).toLocaleString()}).`);
  }
 }
 r.base=base;r.src=src;let sub=base;
 const add=(l,amt)=>{if(Number.isFinite(amt)&&amt){r.lines.push([l,amt]);sub+=amt}};
 if(has('dep')&&String(i.dep??'').trim()!=='')add(`Depreciation ${num(i.dep)}%`,-base*num(i.dep)/100);
 if(has('mil')){
  const age=Math.max(0,new Date().getFullYear()-num(v.vehicle.yom)),km=num(v.vehicle.mileage);
  if(v.vehicle.yom&&String(v.vehicle.mileage??'').trim()!==''){
   const pct=Math.max(-15,Math.min(15,(age*15000-km)/10000*0.5));
   add(`Indicative mileage adjustment (${pct.toFixed(1)}%; requires valuer verification)`,base*pct/100);
   r.warns.push('Mileage adjustment uses a provisional generic benchmark; verify against vehicle-specific evidence before approval.');
  }else r.stops.push('Enter year of manufacture and odometer reading; do not calculate a mileage adjustment from missing data.');
 }
 if(has('cond')&&String(i.cond??'').trim()!==''){
  const c={Excellent:5,Good:0,Fair:-8,Poor:-20}[i.cond];

 }
 if(has('use')){
  const usage={Private:0,Commercial:-8,Taxi:-15,Rental:-10,Fleet:-8};
  if(!v.vehicle.usage)r.stops.push('Select the vehicle usage type; unknown usage must not default to private use.');
  else add(`Usage: ${v.vehicle.usage} (provisional ${usage[v.vehicle.usage]}%)`,base*usage[v.vehicle.usage]/100);
 }
 if(has('dem')&&i.dem){const d={High:4,Normal:0,Low:-6}[i.dem];if(d===undefined)r.stops.push('Select a valid market-demand category.');else add(`Market demand: ${i.dem} (provisional ${d}%)`,base*d/100)}
 if(has('acc'))add('Accessories (subject to evidence)',num(i.acc));
 if(has('acd')&&String(i.acd??'').trim()!=='')add(`Accident / repair deduction ${num(i.acd)}%`,-base*num(i.acd)/100);
 const hc=(p.hc||p.hcopt)?num(i.hc):0;
 r.sub=sub;r.market=Math.max(0,sub);r.final=Math.max(0,hc?sub*(1-hc/100):sub);r.forced=null;

 }
 if(v.purpose==='ACCIDENT'){

  r.repairEstimate=rep;r.salvageValue=sal;
  r.ratio=base?rep/base:0;
  r.final=base; r.market=base; r.forced=null;
  if(!String(i.repair??'').trim())r.stops.push('Enter a repair estimate or document why it cannot be established.');
  if(!String(i.salvage??'').trim())r.stops.push('Enter a salvage estimate or document why it cannot be established.');
  if(rep&&base&&r.ratio>0.7)r.warns.push(`Repair estimate is ${(r.ratio*100).toFixed(0)}% of pre-accident value. This is a review trigger, not an automatic total-loss decision.`);
  if(sal>base)r.stops.push('Salvage value cannot exceed the pre-accident value without a documented explanation.');
  r.net=base-sal;
  r.warns.push('Accident report separates pre-accident value, repair estimate and salvage. The net figure is not an automatic indemnity or total-loss determination.');
 }
 if(v.purpose==='PRE_LOSS'&&get2(v,'pl_inspect_basis')==='Vehicle not available: records only')r.warns.push('Vehicle was not inspected: value rests on records and earlier evidence. State the limitations clearly.');
 if(A.chassis!=='ok')r.stops.push('Chassis/VIN is not confirmed against the logbook or export certificate.');
 if(['BANK','SALE','AUCTION','COURT','DISPUTE'].includes(v.purpose)&&['issue','major'].includes(A.search))r.stops.push('Caveat, lien or police stop found on official search.');
 if(['issue','major'].includes(A.odo_ok))r.stops.push('Odometer tampering is suspected: stop valuation pending documented investigation and senior valuer review.');
 let req=0;
 ITEMS.forEach(t=>{if(lvl(t,v.purpose)==='R'){req++;if(!A[t.code])r.missing.push(t.label);if(A[t.code]==='na'&&!String(v.notes[t.code]||'').trim())r.stops.push(`${t.label}: provide a reason for marking a required check N/A.`)}});
 r.pfMissing=pfMissing(v);
 const comp=Math.round(100*(Math.max(req,1)-r.missing.length)/Math.max(req,1)),ph=(i.photos||[]).length;
 const evid=Math.min(100,(ph>=4?40:ph*10)+(A.geo==='ok'?20:0)+(A.scans==='ok'?20:0)+(A.odo==='ok'?20:0));
 const data=p.noval?100:(r.n>=5?100:r.n>=3?75:r.n>0?40:src==='crsp'?(i.crsp_id&&num(i.crsp)===num(i.crsp_db)?50:30):20);

}
const get2=(v,k)=>v.inputs[k]||'';
function recalc(){
 const v=S.val,r=S.r=calc(v),p=P[v.purpose];

}
async function loadModels(){
 if(!S.val||!S.makes)return;
 const name=clean(get('v.make')).toLowerCase(),mk=S.makes.find(m=>String(m.make).toLowerCase()===name);
 if(!mk)return dl('dl-model',[]);
 S.models=S.models||{};S.mkey=mk.id;
 if(!S.models[mk.id]){const{data}=await sb.from('vehicle_models').select('name').eq('make_id',mk.id).or('active.is.null,active.eq.true').order('name');S.models[mk.id]=(data||[]).map(x=>x.name)}
 if(S.mkey!==mk.id||!S.val)return;
 dl('dl-model',S.models[mk.id]);
}
function loadCrsp(){clearTimeout(crspT);crspT=setTimeout(doCrsp,350)}
async function doCrsp(){
 const sel=document.getElementById('crspSel'),msg=document.getElementById('crspMsg');if(!sel||!S.val)return;
 const mk=clean(get('v.make')),md=clean(get('v.model'));
 if(!mk||!md){sel.innerHTML='<option value="">Enter make and model first</option>';crspRows=[];msg.textContent='';S.cseq=(S.cseq||0)+1;return}
 const seq=S.cseq=(S.cseq||0)+1;msg.textContent='Searching CRSP…';
 const{data,error}=await sb.from('vehicle_crsp').select('crsp_id,make,model,trim_level,manufacture_year,engine_capacity_cc,fuel,transmission,drive_config,crsp_kes,crsp_reference_year,crsp_status').ilike('make',mk).ilike('model',md).order('manufacture_year',{ascending:false}).limit(300);
 if(seq!==S.cseq||!S.val||!document.getElementById('crspSel'))return;
 if(error){msg.textContent='Could not read CRSP data: '+error.message;return}
 const yom=num(get('v.yom')),rows=data||[],yr=yom?rows.filter(r=>r.manufacture_year===yom):rows;
 crspRows=yr.length?yr:rows;
 msg.textContent=!rows.length?'No CRSP record for this make and model. Check the spelling, or type the value manually below.':(yom&&!yr.length?`No CRSP record for ${yom}; showing all years.`:`${crspRows.length} CRSP record(s) found.`);
 const cur=String(get('i.crsp_id'));
 sel.innerHTML='<option value="">Choose the matching variant…</option>'+crspRows.map((r,n)=>`<option value="${n}"${String(r.crsp_id)===cur?' selected':''}>${esc([r.manufacture_year,r.trim_level,r.engine_capacity_cc&&r.engine_capacity_cc+'cc',r.fuel,r.transmission,r.drive_config].filter(Boolean).join(' · '))} — ${KES(r.crsp_kes)}</option>`).join('');
}
document.addEventListener('change',e=>{if(e.target.id==='crspSel'&&e.target.value!=='')applyCrsp(crspRows[+e.target.value])});
function applyCrsp(r){
 if(!r)return;
 const v=S.val.vehicle,i=S.val.inputs;
 v.variant=r.trim_level||v.variant;v.cc=r.engine_capacity_cc||v.cc;v.fuel=r.fuel||v.fuel;v.trans=r.transmission||v.trans;v.drive=r.drive_config||v.drive;v.yom=v.yom||r.manufacture_year;
 i.crsp=String(r.crsp_kes);i.crsp_db=String(r.crsp_kes);i.crsp_id=r.crsp_id;i.crsp_ref=r.crsp_reference_year;
 const y=scrollY;formView();scrollTo(0,y);toast('CRSP value applied');
}
function geo(){navigator.geolocation.getCurrentPosition(pos=>{const c=pos.coords,l=`${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)} (±${Math.round(c.accuracy)} m)`;
 S.val.inputs.location=l;S.val.inputs.geo={lat:c.latitude,lng:c.longitude,acc:Math.round(c.accuracy),ts:new Date(pos.timestamp).toISOString()};
 if(c.accuracy>100){toast('GPS accuracy is poor (±'+Math.round(c.accuracy)+' m). Move to open sky and retry.');delete S.val.answers.geo}else S.val.answers.geo='ok';
 const y=scrollY;formView();scrollTo(0,y)},()=>toast('Location not available'),{enableHighAccuracy:true,timeout:15000})}
async function ensureSaved(){if(!S.val.id){const savedId=await save(false,true);if(!savedId)return null}return S.val.id||null}
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b||f),'image/jpeg',.82)};im.onerror=()=>res(f);im.src=URL.createObjectURL(f)})}
async function upl(){
 const fs=[...$('#ph').files];if(!fs.length)return toast('Choose photos first');
 if(fs.some(f=>!/^image\//.test(f.type)))return toast('Only image files are allowed');
 if(fs.some(f=>f.size>15e6))return toast('Each photo must be under 15 MB');
 if(((S.val.inputs.photos||[]).length)+fs.length>40)return toast('Maximum 40 photos per valuation');
 if(!await ensureSaved())return;
 const v=S.val;v.inputs.photos=v.inputs.photos||[];
 for(const f of fs){const path=`${S.user.id}/${v.id}/${Date.now()}_${f.name.replace(/[^\w.]/g,'_').replace(/\.\w+$/,'')}.jpg`;
  const{error}=await sb.storage.from('valuation-photos').upload(path,await shrink(f),{contentType:'image/jpeg'});
  if(error)return toast(error.message);v.inputs.photos.push(path)}
 $('#pc').textContent=v.inputs.photos.length+' uploaded';await save(false,true);toast('Photos uploaded');
}
async function save(fin,quiet){
 const v=S.val,r=S.r=calc(v);
 if(fin&&(r.stops.length||r.missing.length||r.pfMissing.length))return alert(r.stops.length?r.stops.join('\n'):r.pfMissing.length?'Complete the required details: '+r.pfMissing.join(', '):`Answer all required checks first (${r.missing.length} left).`);
 if(fin){const need=[['client','client / instructing party'],['use','intended use'],['conflict','independence declaration']].filter(([k])=>!String(v.inputs[k]||'').trim()).map(x=>x[1]);if(need.length)return alert('Complete before finalising: '+need.join(', ')+'.')}
 if(fin&&!confirm('Submit for senior review? You cannot edit it while it is under review.'))return;
 v.inputs.officer_name=v.inputs.officer_name||S.prof.full_name;v.inputs.form_version=v.inputs.form_version||PF_VER;v.inputs.officer_licence=v.inputs.officer_licence??(S.prof.licence_no||'');
 const row={officer_id:S.user.id,purpose:v.purpose,status:'draft',vehicle:v.vehicle,inputs:v.inputs,answers:v.answers,notes:v.notes,result:r,final_value:Math.round(r.final),range_low:null,range_high:null,confidence:null};
 if(v.id)row.id=v.id;
 const{data,error}=await sb.from('onsite_valuations').upsert(row).select().single();
 if(error)return alert(error.message);
 v.id=data.id;v.ref=data.ref;v.status=data.status;
 if(fin){const{error:e2}=await sb.rpc('submit_valuation',{p_id:v.id});if(e2)return alert(e2.message);toast('Submitted for review');return home()}
 if(!quiet)toast('Draft saved');
}

/* ---------- Report ---------- */
function reportView(){
 const v=S.val,p=P[v.purpose],r=S.r=(v.result&&v.status!=='draft'&&v.status!=='correction_required')?v.result:calc(v),i=v.inputs,ve=v.vehicle;
 const issues=ITEMS.filter(t=>['issue','major'].includes(v.answers[t.code]));
 const kv=(a,b)=>`<div class="row"><span>${a}</span><b>${esc(b||'-')}</b></div>`;
 const valid=p.days?new Date(new Date(i.date||Date.now()).getTime()+p.days*864e5).toLocaleDateString('en-KE'):'Date-specific';
 const q=r.q||{complete:0,evidence:0,data:0};
 $('#app').innerHTML=topbar()+`<div class="wrap"><div class="noprint"><button onclick="home()">Back to list</button> <button class="pri" onclick="print()">Print or save as PDF</button></div>
 <div class="rep card"><div style="display:flex;justify-content:space-between"><div><h2>${p.noval?'Vehicle Inspection Report':'Vehicle Valuation Report'}</h2><div class="sm">${esc(p.n)} · Ref ${esc(v.ref||'')}${v.cert?' · Certificate '+esc(v.cert):''}</div></div><div class="brand">Auto-D</div></div>
 <h3 style="margin-top:14px">Assignment</h3>${kv('Client / instructing party',i.client)}${kv('Intended use and users',i.use)}${kv('Instruction reference',i.instr_ref)}${kv('Basis',BASIS[v.purpose])}${kv(p.noval?'Inspection date':'Valuation date',i.date)}${kv('Report date',today())}${p.noval?'':kv('Currency','KES')}${i.fee!=null?kv(p.noval?'Inspection fee':'Valuation fee',KES(i.fee)):''}
 <h3 style="margin-top:14px">Result</h3>${p.noval?`<div class="big">Inspection findings</div><div class="sm">No monetary value is stated for this service. Evidence and completeness index ${r.evidenceIndex??r.conf??'not recorded'}% · Inspection completeness ${q.complete}% · Evidence quality ${q.evidence}%${r.score!=null?' · Condition score '+r.score+'/100 (proposed internal weights)':''}</div>`:`${v.purpose==='ACCIDENT'?kv('Pre-accident market value',KES(r.preAccidentValue??r.base)):(r.forced?kv('Market value',KES(r.market)): '')}<div class="big">${KES(v.approved??r.final)}</div>${v.approved&&v.approved!==r.final?`<div class="sm">Recommended by inspecting officer: ${KES(r.final)}</div>`:''}${r.forced?`<div class="sm">${v.purpose==='AUCTION'?'Estimated forced-sale proceeds':'Forced-sale value'}. Basis: ${esc(i.hc_basis)}</div>`:''}
 <div class="sm">No statistical valuation range is stated · Evidence and completeness index ${r.evidenceIndex??r.conf??'not recorded'}% · Valid until ${valid}${v.purpose==='ACCIDENT'?` · Repair estimate ${KES(r.repairEstimate)} · Salvage ${KES(r.salvageValue)} · Indicative pre-accident less salvage ${KES(r.net)}`:''}</div>
 <div class="sm">Inspection completeness ${q.complete}% · Evidence quality ${q.evidence}% · Data quality ${q.data}%${r.score!=null?' · Condition score '+r.score+'/100 (proposed internal weights)':''}</div>`}
 ${pfReport(v)}<h3 style="margin-top:14px">Vehicle</h3>${kv('Make / model / variant',[ve.make,ve.model,ve.variant].filter(Boolean).join(' '))}${kv('Plate',ve.plate)}${kv('Chassis / VIN',ve.chassis)}${kv('Engine no.',ve.engine_no)}${kv('Year / registered',[ve.yom,ve.reg_year].filter(Boolean).join(' / '))}${kv('Engine, fuel, transmission',[ve.cc&&ve.cc+'cc',ve.fuel,ve.trans,ve.drive].filter(Boolean).join(', '))}${kv('Origin',ve.origin)}${kv('Odometer',ve.mileage&&Number(ve.mileage).toLocaleString()+' km')}${kv('Usage',ve.usage)}${kv('Owner / requester',ve.owner)}
 ${p.noval?'':`<h3 style="margin-top:14px">Calculation</h3>
 <div class="row"><span>${r.src==='crsp'?'KRA CRSP base'+(i.crsp_id?` (record ${i.crsp_id}${i.crsp_ref?', ref. year '+i.crsp_ref:''})`:' (manual entry)'):r.src==='manual'?'Manual base value':`Market base (${r.n} comparables)`}</span><b>${KES(r.base)}</b></div>
 ${r.lines.map(l=>`<div class="row"><span>${esc(l[0])}</span><b class="${l[1]<0?'neg':'pos'}">${l[1]<0?'-':'+'}${KES(Math.abs(l[1]))}</b></div>`).join('')}`}
 ${issues.length?`<h3 style="margin-top:14px">Issues found</h3>${issues.map(t=>kv(esc(t.label)+(v.answers[t.code]==='major'?' [MAJOR]':''),v.notes[t.code]||'Issue')).join('')}`:''}
 ${r.warns.length?`<h3 style="margin-top:14px">Warnings</h3>${r.warns.map(w=>`<div class="row"><span>${esc(w)}</span></div>`).join('')}`:''}
 ${i.remarks?`<h3 style="margin-top:14px">Notes and assumptions</h3><p>${esc(i.remarks)}</p>`:''}
 ${kv('Independence declaration',i.conflict)}<p class="sm" style="margin-top:14px">Inspected ${esc(i.date||'')}${i.location?' at '+esc(i.location):''} by ${esc(i.officer_name||S.prof.full_name)}${(i.officer_licence||S.prof.licence_no)?' (licence '+esc(i.officer_licence||S.prof.licence_no)+')':''}. ${(i.photos||[]).length} photos on file. ${p.noval?'This report records findings within the agreed scope as at the inspection date.':'This is a professional opinion of value as at the valuation date, based on the inspection and data above. It is not a guarantee of sale price.'} Mileage, history and ownership rely on the documents and information supplied unless verified as stated. No dismantling or specialist diagnostics were performed unless stated in the notes.${i.legacy_purpose?' Originally recorded under the earlier service code '+esc(i.legacy_purpose)+'.':''} Engine onsite-2.1 (purpose-isolated calculation and evidence-index update).</p>
 <p style="margin-top:30px">Valuer signature: ______________________ Date: ____________</p></div></div>`;
}
function reviewView(){
 reportView();
 const v=S.val,can=S.prof.can_sign&&S.prof.role==='senior_valuer'&&v.status==='submitted'&&v.officer_id!==S.user.id,nv=P[v.purpose].noval;
 const box=document.createElement('div');box.className='card noprint';
 box.innerHTML=can?`<h2>Senior review</h2>${nv?'':`<label>Approved value (KES). Change only with a justification in the notes<input id="rv" type="number" value="${Math.round(v.result.final)}"></label><br>`}<label>Review notes (required)<textarea id="rn" rows="3"></textarea></label><p><button class="pri" onclick="decide('approve')">Approve and issue</button> <button onclick="decide('correction')">Request corrections</button> <button onclick="decide('reject')">Reject</button></p>`
  :`<h2>Status: ${esc(v.status)}</h2><p class="sm">${v.status==='submitted'?'Awaiting senior review. Editing is locked.':esc(v.review_note||'')}</p>`;
 document.querySelector('.wrap').appendChild(box);
}
async function decide(d){
 if(decide.b)return;
 const v=S.val,notes=$('#rn').value.trim();
 if(!notes)return alert('Review notes are required.');
 if(d==='approve'&&!confirm('Approve and issue? This locks the record permanently.'))return;
 decide.b=1;
 try{const{error}=await sb.rpc('review_valuation',{p_id:v.id,p_decision:d,p_notes:notes,p_approved_value:d==='approve'?(P[v.purpose].noval?0:num($('#rv').value)):null});
  if(error)return alert(error.message);toast('Decision recorded');home()}
 finally{decide.b=0}
}
/* one in-flight save at a time (double-click protection) */
(()=>{let busy=false;const orig=save;save=async function(...a){if(busy)return;busy=true;const bs=[...document.querySelectorAll('#bar button')];bs.forEach(b=>b.disabled=true);try{return await orig(...a)}finally{busy=false;bs.forEach(b=>b.disabled=false)}}})();
boot();
</script>
