<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed background (required for maskable icons — Android crops this) -->
  <rect width="512" height="512" fill="#0a0c15"/>

  <!-- Subtle radial glow for depth -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1a2036"/>
      <stop offset="100%" stop-color="#0a0c15"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Car silhouette, centered within the 80% maskable safe zone (roughly 76px-436px) -->
  <g transform="translate(266,260)">
    <!-- Car body -->
    <path d="M -150 20
             L -128 -22
             Q -118 -40 -96 -42
             L -40 -46
             Q -20 -48 -2 -38
             L 44 -10
             L 128 -6
             Q 154 -4 160 18
             L 164 40
             Q 166 54 152 56
             L -156 56
             Q -172 54 -170 38
             Z"
          fill="#eab308"/>

    <!-- Windshield / cabin cutout -->
    <path d="M -84 -38
             L -60 -8
             L 16 -6
             L -14 -36
             Q -28 -44 -46 -43
             L -70 -41
             Q -80 -40 -84 -38 Z"
          fill="#0a0c15"/>

    <!-- Front headlight, set into the nose of the body -->
    <circle cx="150" cy="16" r="6" fill="#0a0c15"/>

    <!-- Wheels -->
    <circle cx="-96" cy="56" r="34" fill="#0a0c15"/>
    <circle cx="-96" cy="56" r="15" fill="#eab308"/>
    <circle cx="92" cy="56" r="34" fill="#0a0c15"/>
    <circle cx="92" cy="56" r="15" fill="#eab308"/>

    <!-- Motion lines trailing behind the car, aligned to body height -->
    <g stroke="#eab308" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <line x1="-232" y1="-6" x2="-192" y2="-6"/>
      <line x1="-246" y1="16" x2="-196" y2="16"/>
    </g>
  </g>
</svg>
