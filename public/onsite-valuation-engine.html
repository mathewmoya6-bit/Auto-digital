<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto-D Onsite Valuation</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&family=Space+Grotesk:wght@500;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1426;--panel:#121e36;--line:#26365a;--tx:#e8ecf4;--mut:#8d9bb8;--amb:#f5a623;--ok:#3fb58a;--bad:#e5604d;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Public Sans',system-ui,sans-serif;padding-bottom:120px}
h1,h2,h3{margin:0;font-weight:800}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{font-family:'Space Grotesk','Public Sans',system-ui,sans-serif;font-weight:700;font-size:22px;color:#eab308;display:flex;align-items:center;gap:6px;line-height:1.1}.brand span{color:var(--tx)}.auth .brand{font-size:28px;justify-content:center;margin:10px 0 4px}.auth>.sm{text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.card h2{font-size:16px;margin-bottom:10px;color:var(--amb)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;margin-top:4px;padding:10px;background:#0b1426;border:1px solid var(--line);border-radius:8px;color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amb);outline-offset:1px}
button{font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--tx);cursor:pointer}
button.pri{background:var(--amb);border-color:var(--amb);color:#1a1200}
button.lnk{border:0;padding:4px;color:var(--amb);text-decoration:underline}
.auth{max-width:400px;margin:8vh auto}
.msg{padding:10px;border-radius:8px;margin:10px 0;background:#2a1c1c;border:1px solid var(--bad);color:#ffb4a8}
.msg.good{background:#12281f;border-color:var(--ok);color:#a6ecd0}
.msg.info{background:#16233f;border-color:var(--amb);color:#f3d9a4}
.it{display:grid;grid-template-columns:1fr 110px;gap:6px 8px;padding:10px 0;border-top:1px solid var(--line)}
.it input{grid-column:1/3;margin:0}
.it select{margin:0}
.st.ok{border-color:var(--ok)}.st.issue,.st.major{border-color:var(--bad);background:#2a1c1c}
.rq{color:var(--amb);font-size:11px;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;background:#0f1a30;border-top:2px solid var(--amb);padding:10px 16px;z-index:5}
#bar .in{max-width:860px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.big{font-size:22px;font-weight:800;color:var(--amb)}
.sm{font-size:12px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.row b{white-space:nowrap}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.list .row{cursor:pointer}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.tag.final{border-color:var(--ok);color:var(--ok)}.tag.submitted{border-color:var(--amb);color:var(--amb)}.tag.correction_required,.tag.rejected{border-color:var(--bad);color:var(--bad)}
#toast{position:fixed;top:14px;right:14px;background:var(--ok);color:#04150e;padding:10px 14px;border-radius:8px;font-weight:700;z-index:9;display:none}
.rep{background:#fff;color:#111;padding:24px;border-radius:var(--r)}
.rep .row{border-color:#ddd}.rep h2,.rep h3{color:#111}.rep .sm{color:#555}.rep .big{color:#111}
.cert{background:#fff;color:#1f2937;border:2px solid #0f172a;outline:1px solid #c9a227;outline-offset:-6px;border-radius:4px;margin:14px 0;font-family:'Public Sans',system-ui,sans-serif;overflow:hidden}
.cert,.cert *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert .hd{background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:4px solid #eab308}
.cert .bn{display:flex;align-items:center;gap:14px}
.cert .nm{font-size:28px;font-weight:800;line-height:1}
.cert .tg{font-size:9px;letter-spacing:.18em;color:#eab308;margin-top:6px}
.cert .cn{text-align:right}.cert .cn small{display:block;font-size:9px;letter-spacing:.14em;color:#94a3b8}
.cert .cn b{font-size:18px;color:#eab308;display:block}.cert .cn span{font-size:10px;color:#cbd5e1}
.cert .bd{padding:22px 32px 18px}
.cert h1{font-family:Georgia,'Times New Roman',serif;text-align:center;font-size:30px;letter-spacing:.08em;color:#0f172a;margin:6px 0 6px}
.cert .orn{width:140px;height:1px;background:#c9a227;margin:0 auto 10px}
.cert .stmt{text-align:center;font-family:Georgia,serif;font-style:italic;color:#64748b;font-size:13px;margin:0 20px 14px}
.cert .val{background:#fbf6e4;border:1px solid #c9a227;border-radius:10px;text-align:center;padding:14px 10px;margin-bottom:14px}
.cert .val .l{font-size:10px;letter-spacing:.2em;font-weight:700;color:#64748b}
.cert .val .a{font-family:Georgia,serif;font-size:44px;font-weight:700;color:#0f172a;line-height:1.15}
.cert .val .w{font-family:Georgia,serif;font-style:italic;font-size:13px;color:#1f2937}
.cert .val .m{font-size:10px;color:#64748b;margin-top:4px}
.cert .sh{font-size:11px;font-weight:800;letter-spacing:.14em;color:#0f172a;border-left:4px solid #0f172a;padding-left:8px;margin:12px 0 6px;display:flex;align-items:center;gap:10px}
.cert .sh:after{content:'';flex:1;height:1px;background:#d9dee7}
.cert .g{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.cert .g>div{border-bottom:1px solid #d9dee7;padding:5px 0}
.cert .g small{display:block;font-size:8.5px;letter-spacing:.1em;color:#64748b;text-transform:uppercase}
.cert .g b{font-size:13px;color:#1f2937}
.cert .g .full{grid-column:1/3}
.cert .sg{display:grid;grid-template-columns:1fr 110px 1fr;gap:12px;align-items:end;border-top:1px solid #d9dee7;margin-top:16px;padding-top:12px}
.cert .sig{height:56px;display:flex;align-items:flex-end}
.cert .sigtxt{font-family:'Dancing Script',cursive;font-size:34px;line-height:1;color:#1e2f7a}
.cert .ln{border-top:1px solid #0f172a;padding-top:4px;font-size:12px;font-weight:800;color:#0f172a}
.cert .sg .sm2{font-size:10px;color:#64748b;font-weight:400}
.cert .qr{display:flex;justify-content:flex-end;align-items:flex-end;gap:8px;text-align:right;font-size:10px;color:#64748b}
.cert .qr svg{width:74px;height:74px}
.cert .fine{text-align:center;font-size:9px;color:#64748b;margin-top:10px}
.cert .isig .sigimg{max-height:34px;margin:2px 0}
.rep .cksec{margin-top:8px}
.rep .ckh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#eef1f6;color:#0f172a;padding:4px 8px;border-left:4px solid #0f172a;break-after:avoid}
.rep .ckr{display:grid;grid-template-columns:1.2fr 90px 1fr;gap:8px;padding:4px 8px;border-bottom:1px solid #e5e7eb;font-size:12px;align-items:start;break-inside:avoid}
.rep .cks{font-weight:700;font-size:11px;white-space:nowrap}
.rep .cks.ok{color:#15803d}.rep .cks.issue{color:#b45309}.rep .cks.major{color:#b91c1c}.rep .cks.na,.rep .cks.nc{color:#64748b}
.rep .ckn{color:#374151}.rep .ckl i{color:#b45309;font-style:normal;font-weight:700}
.s2{display:grid;grid-template-columns:1fr 90px 1fr;gap:14px;align-items:end;border-top:2px solid #0f172a;margin-top:26px;padding-top:12px;break-inside:avoid;color:#111}
.s2 .s2t{font-size:10px;letter-spacing:.12em;font-weight:800;color:#64748b;text-transform:uppercase}
.s2 .s2s{height:58px;display:flex;align-items:flex-end}
.s2 .s2l{border-top:1px solid #0f172a;padding-top:4px;font-size:12px;font-weight:800}
.s2 .s2l .sm{font-weight:400;font-size:10px;color:#555}
.s2 .sigtxt{font-family:'Dancing Script',cursive;font-size:34px;line-height:1;color:#1e2f7a}
.s2 svg{width:80px;height:80px;display:block;margin:auto}
.fine2{text-align:center;font-size:9px;color:#64748b;margin-top:8px}
@media print{.rep .ckr,.s2{break-inside:avoid}}
.sigimg{max-height:54px;max-width:170px;display:block;object-fit:contain}
.pdfmode{color:#111}.pdfmode .cert{margin:0}.pdfmode .rep{border-radius:0;padding:14px;margin:0}
.sigprev{background:#fff;border-radius:8px;padding:6px 10px;display:inline-block;margin:6px 0}
.sigprev img{max-height:60px;max-width:220px;display:block}
.comp-item{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:#0d1930}.comp-item h3{font-size:13px;color:var(--amb);margin-bottom:8px}.comp-item .grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.comp-item label{margin-bottom:4px}.comp-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.method-note{border-left:3px solid var(--amb);padding:8px 10px;background:#18243c;border-radius:4px;margin:8px 0}
canvas.sigpad{background:#fff;border:1px dashed #8d9bb8;border-radius:8px;width:100%;height:150px;touch-action:none;display:block;margin:8px 0;cursor:crosshair}
details.sgc summary{cursor:pointer;color:var(--amb);font-weight:700}
@media print{@page{size:A4;margin:8mm}body{background:#fff;padding:0}.noprint,.top,#bar{display:none!important}.rep{padding:0}.cert{margin:0;page-break-after:always;break-after:page}.cert .bd{padding:14px 24px 10px}.cert .val .a{font-size:38px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function doCrsp(){
 const sel=document.getElementById('crspSel'),msg=document.getElementById('crspMsg');if(!sel||!S.val)return;

 if(!mk||!md){sel.innerHTML='<option value="">Enter make and model first</option>';crspRows=[];msg.textContent='';S.cseq=(S.cseq||0)+1;return}
 const seq=S.cseq=(S.cseq||0)+1;msg.textContent='Searching CRSP…';

 if(seq!==S.cseq||!S.val||!document.getElementById('crspSel'))return;
 if(error){msg.textContent='Could not read CRSP data: '+error.message;return}
 const yom=num(get('v.yom')),rows=data||[],yr=yom?rows.filter(r=>r.manufacture_year===yom):rows;
 crspRows=yr.length?yr:rows;
 msg.textContent=!rows.length?'No CRSP record for this make and model. Check the spelling, or type the value manually below.':(yom&&!yr.length?`No CRSP record for ${yom}; showing all years.`:`${crspRows.length} CRSP record(s) found.`);
 const cur=String(get('i.crsp_id'));
 sel.innerHTML='<option value="">Choose the matching variant…</option>'+crspRows.map((r,n)=>`<option value="${n}"${String(r.crsp_id)===cur?' selected':''}>${esc([r.manufacture_year,r.trim_level,r.engine_capacity_cc&&r.engine_capacity_cc+'cc',r.fuel,r.transmission,r.drive_config].filter(Boolean).join(' · '))} — ${KES(r.crsp_kes)}</option>`).join('');
}

 <h3 style="margin-top:14px">Assignment</h3>${kv('Client / instructing party',i.client)}${kv('Intended use and users',i.use)}${kv('Instruction reference',i.instr_ref)}${kv('Basis',BASIS[v.purpose])}${kv(p.noval?'Inspection date':'Valuation date',p.noval?i.date:VD(v))}${kv('Report date',v.approved_at?new Date(v.approved_at).toLocaleDateString('en-CA',{timeZone:'Africa/Nairobi'}):today())}${p.noval?'':kv('Currency','KES')}${i.fee!=null?kv(p.noval?'Inspection fee':'Valuation fee',KES(i.fee)):''}${(()=>{const pr=payRef(v);return pr?kv(pr.mode==='credit'?'Invoice reference':'M-Pesa confirmation no.',pr.ref):''})()}
 <h3 style="margin-top:14px">Result</h3>${p.noval?`<div class="big">Inspection findings</div><div class="sm">No monetary value is stated for this service. Evidence and completeness index ${r.evidenceIndex??r.conf??'not recorded'}% · Inspection completeness ${q.complete}% · Evidence quality ${q.evidence}%${r.score!=null?' · Condition score '+r.score+'/100 (coverage '+r.conditionCoverage+'%)':''}</div>`:`${v.purpose==='ACCIDENT'?kv('Pre-accident market value',KES(r.preAccidentValue??r.base)):(r.forced?kv('Market value',KES(r.market)): '')}<div class="big">${KES(v.approved??r.final)}</div>${v.approved&&v.approved!==r.final?`<div class="sm">Recommended by inspecting officer: ${KES(r.final)}</div>`:''}${r.forced?`<div class="sm">${v.purpose==='AUCTION'?'Estimated forced-sale proceeds':'Forced-sale value'}. Basis: ${esc(i.hc_basis)}</div>`:''}
 <div class="sm">No statistical valuation range is stated · Evidence and completeness index ${r.evidenceIndex??r.conf??'not recorded'}% · Valid until ${valid}${v.purpose==='ACCIDENT'?` · Repair estimate ${KES(r.repairEstimate)} · Salvage ${KES(r.salvageValue)} · Indicative pre-accident less salvage ${KES(r.net)}`:''}</div>
 <div class="sm">Inspection completeness ${q.complete}% · Evidence quality ${q.evidence}% · Data quality ${q.data}%${r.score!=null?' · Condition score '+r.score+'/100 (coverage '+r.conditionCoverage+'%)':''}</div>`}
 ${pfReport(v)}<h3 style="margin-top:14px">Vehicle</h3>${kv('Make / model / variant',[ve.make,ve.model,ve.variant].filter(Boolean).join(' '))}${kv('Plate',ve.plate)}${kv('Chassis / VIN',ve.chassis)}${kv('Engine no.',ve.engine_no)}${kv('Year / registered',[ve.yom,ve.reg_year].filter(Boolean).join(' / '))}${kv('Engine, fuel, transmission',[ve.cc&&ve.cc+'cc',ve.fuel,ve.trans,ve.drive].filter(Boolean).join(', '))}${kv('Origin',ve.origin)}${kv('Odometer',ve.mileage&&Number(ve.mileage).toLocaleString()+' km')}${kv('Usage',ve.usage)}${kv('Colour',ve.colour)}${kv('Owner / requester',ve.owner)}
 ${comparableReportHTML(r)}${inHTML(v)}${ckHTML(v)}${p.noval?'':`<h3 style="margin-top:14px">Calculation</h3>
 <div class="row"><span>${r.src==='crsp'?'KRA CRSP base'+(i.crsp_id?` (record ${i.crsp_id}${i.crsp_ref?', ref. year '+i.crsp_ref:''})`:' (manual entry)'):r.src==='manual'?'Manual base value':r.src==='book'?'Book value (fleet register)':`Market base (${r.n} comparables)`}</span><b>${KES(r.base)}</b></div>
 ${r.lines.map(l=>`<div class="row"><span>${esc(l[0])}</span><b class="${l[1]<0?'neg':'pos'}">${l[1]<0?'-':'+'}${KES(Math.abs(l[1]))}</b></div>`).join('')}`}
 ${p.noval?'':ratioHTML(v,r)}${issues.length?`<h3 style="margin-top:14px">Issues found</h3>${issues.map(t=>kv(esc(t.label)+(v.answers[t.code]==='major'?' [MAJOR]':''),v.notes[t.code]||'Issue')).join('')}`:''}
 ${r.warns.length?`<h3 style="margin-top:14px">Warnings</h3>${r.warns.map(w=>`<div class="row"><span>${esc(w)}</span></div>`).join('')}`:''}
 ${i.remarks?`<h3 style="margin-top:14px">Notes and assumptions</h3><p>${esc(i.remarks)}</p>`:''}
 ${kv('Independence declaration',i.conflict)}<p class="sm" style="margin-top:14px">Inspected ${esc(i.date||'')}${i.location?' at '+esc(i.location):''} by ${esc(i.officer_name||S.prof.full_name)}${(i.officer_licence||S.prof.licence_no)?' (licence '+esc(i.officer_licence||S.prof.licence_no)+')':''}. ${(i.photos||[]).length} photos on file. ${p.noval?'This report records findings within the agreed scope as at the inspection date.':'This is a professional opinion of value as at the valuation date, based on the inspection and data above. It is not a guarantee of sale price.'} Mileage, history and ownership rely on the documents and information supplied unless verified as stated. No dismantling or specialist diagnostics were performed unless stated in the notes.${i.legacy_purpose?' Originally recorded under the earlier service code '+esc(i.legacy_purpose)+'.':''} Engine ${ENGINE}; methodology ${METHOD}. Comparable evidence and signed adjustments are reconciled as disclosed above. The evidence/completeness index is not statistical confidence.</p>
 ${stdHTML(v,r)}${sign2HTML(v)}</div></div></div>`;
}
function reviewView(){
 reportView();
 const v=S.val,can=S.prof.can_sign&&S.prof.role==='senior_valuer'&&v.status==='submitted'&&v.officer_id!==S.user.id,nv=P[v.purpose].noval;
 const box=document.createElement('div');box.className='card noprint';
 box.innerHTML=can?`<h2>Senior review</h2>${nv?'':rvPanel(v)}<label>Review notes (required)<textarea id="rn" rows="3"></textarea></label><p>${cashUnpaid(v)?'<span class="neg">Cannot approve yet: the cash client has not paid.</span> ':'<button class="pri" onclick="decide(\'approve\')">Approve and issue</button> '}<button onclick="decide('correction')">Request corrections</button> <button onclick="decide('reject')">Reject</button></p>`
  :`<h2>Status: ${esc(v.status)}</h2><p class="sm">${v.status==='submitted'?'Awaiting senior review. Editing is locked.':esc(v.review_note||'')}</p>`;
 document.querySelector('.wrap').appendChild(box);if(can&&!nv)rvUpdate();
 {const at=document.createElement('div');at.className='card noprint';at.innerHTML='<h2>Attachments</h2><p class="sm">Loading…</p>';document.querySelector('.wrap').appendChild(at);loadAttach(v,at)}
 if(cashUnpaid(v)&&v.status!=='final'){const pc=document.createElement('div');pc.innerHTML=payCardHTML(v);document.querySelector('.wrap').appendChild(pc.firstElementChild)}
}
async function decide(d){
 if(decide.b)return;
 const v=S.val;let notes=$('#rn').value.trim();
 if(d==='approve'&&cashUnpaid(v))return alert('Cannot approve: the cash client has not paid.');
 if(!notes)return alert('Review notes are required.');
 if(d==='approve'&&!P[v.purpose].noval){const ed=rvEdits(),av=num($('#rv').value),of=v.result.final;
  if(!(av>0))return alert('Enter a valid approved value.');
  if(of&&Math.abs(av-of)/of>.05&&notes.length<25)return alert("The approved value differs from the officer's figure by more than 5%. Explain why in the review notes.");
  notes+='\n[Approver review] Officer '+KES(of)+' to Approved '+KES(av)+(ed.length?'\n[Edits] '+ed.join('; '):'')}
 if(d==='approve'&&!confirm('Approve and issue? This locks the record permanently.'))return;
 decide.b=1;
 try{if(d==='approve'&&!P[v.purpose].noval){const o=rvInputs(),patch={};RVF.forEach(f=>{const k=f[0];if(rvOn(k,v)&&String(o[k]??'').trim()!==String(v.inputs[k]??'').trim())patch[k]=String(o[k]??'').trim()});
   if(Object.keys(patch).length){const{error:ee}=await sb.rpc('onsite_review_edit',{p_id:v.id,p_patch:patch});if(ee)return alert('Your corrections could not be saved, so nothing was approved: '+ee.message)}}
  const{error}=await sb.rpc('review_valuation',{p_id:v.id,p_decision:d,p_notes:notes,p_approved_value:d==='approve'?(P[v.purpose].noval?0:num($('#rv').value)):null});
  if(error)return alert(error.message);toast('Decision recorded');home()}
 finally{decide.b=0}
}
/* ---------- v3.1: on-device autosave so a dropped connection never loses an inspection ---------- */
const stashKey=()=>'onsite_draft_'+((S.user&&S.user.id)||'anon');
function stash(){try{const v=S.val;if(!v||!S.user||!['draft','correction_required',undefined,null].includes(v.status))return;
 localStorage.setItem(stashKey(),JSON.stringify({at:Date.now(),val:{id:v.id||null,ref:v.ref||null,client_id:v.client_id||null,purpose:v.purpose,status:v.status||'draft',pay:v.pay||{status:'unpaid'},vehicle:v.vehicle,inputs:v.inputs,answers:v.answers,notes:v.notes}}))}catch(e){}}
function clearStash(){try{localStorage.removeItem(stashKey())}catch(e){}}
function readStash(){try{return JSON.parse(localStorage.getItem(stashKey())||'null')}catch(e){return null}}
function stashBanner(){const b=$('#stashbox'),s=readStash();if(!b||!s||!s.val||!P[s.val.purpose])return;
 const w=s.val;b.innerHTML=`<div class="msg">Unsaved work found on this device: ${esc((w.vehicle&&((w.vehicle.make||'')+' '+(w.vehicle.model||'')+' '+(w.vehicle.plate||'')).trim())||pn(w.purpose))} (${esc(new Date(s.at).toLocaleString('en-KE'))}). <button onclick="restoreStash()">Restore</button> <button onclick="clearStash();stashBanner();$('#stashbox').innerHTML=''">Discard</button></div>`}
function restoreStash(){const s=readStash();if(!s)return;S.val=s.val;formView()}
window.addEventListener('online',()=>{if(S.val&&readStash()&&!restoreStash.busy){restoreStash.busy=1;save(false,true).then(()=>toast('Back online: draft saved')).finally(()=>{restoreStash.busy=0})}});
/* one in-flight save at a time (double-click protection) */
(()=>{let busy=false;const orig=save;save=async function(...a){if(busy)return;busy=true;const bs=[...document.querySelectorAll('#bar button')];bs.forEach(b=>b.disabled=true);try{return await orig(...a)}finally{busy=false;bs.forEach(b=>b.disabled=false)}}})();
/* ---------- v2.3 additions: valuation date, ratios, standards text, approver edit, certificate verification ---------- */
const VD=v=>{const i=v.inputs||{};return ({COURT:i.lg_valdate,DISPUTE:i.ds_valdate,PRE_LOSS:i.pl_date})[v.purpose]||i.date};
const pcs=x=>x==null||!isFinite(x)?'-':(x*100).toFixed(1)+'%';
const parseComps=t=>legacyComps(t);
function ratios(v,r){
 const i=v.inputs||{},ve=v.vehicle||{},o=[],add=(l,val,note,flag)=>o.push({l,val,note:note||'',flag:!!flag});
 if(!r||!r.base||r.sub==null)return o;
 const adj=(r.sub-r.base)/r.base,cm=parseComps(i.comps),crsp=num(i.crsp);
 add('Net adjustment ÷ base value',pcs(adj),'All adjustments combined. Above 35% needs strong justification.',Math.abs(adj)>.35);
 add('Adjusted market value ÷ base value',pcs(r.market/r.base));
 if(crsp)add('Market value ÷ KRA CRSP',pcs(r.market/crsp),'Cross-check only. The usual band is 60% to 120%.',r.market/crsp<.6||r.market/crsp>1.2);
 if(cm.length>1){const mean=cm.reduce((a,b)=>a+b,0)/cm.length,sd=Math.sqrt(cm.reduce((a,b)=>a+(b-mean)**2,0)/(cm.length-1));
  add('Comparables spread (high − low) ÷ mean',pcs((cm[cm.length-1]-cm[0])/mean),cm.length+' comparables, '+KES(cm[0])+' to '+KES(cm[cm.length-1]),(cm[cm.length-1]-cm[0])/mean>.4);
  add('Comparables variation (std dev ÷ mean)',pcs(sd/mean),'Above 15% means the evidence is loose: check the comparables match.',sd/mean>.15)}
 if(r.forced&&r.market)add('Forced-sale ÷ market value',pcs(r.forced/r.market),'Implied discount '+pcs(1-r.forced/r.market));
 if(v.purpose==='ACCIDENT'&&r.preAccidentValue){add('Repair estimate ÷ pre-accident value',pcs(r.repairEstimate/r.preAccidentValue),'Review trigger above 70%',r.ratio>.7);add('Salvage ÷ pre-accident value',pcs(r.salvageValue/r.preAccidentValue))}
 const vy=(()=>{const d=VD(v),t=d?new Date(d):null;return t&&!isNaN(t)?t.getFullYear():new Date().getFullYear()})(),age=ve.yom?Math.max(0,vy-num(ve.yom)):0,km=num(ve.mileage);
 if(age>0&&km)add('Average km per year',Math.round(km/age).toLocaleString()+' km','Provisional benchmark used by the engine: 15,000 km a year',km/age>35000||km/age<4000);
 if(age>0&&crsp)add('Value retained vs CRSP, per year of age',pcs(Math.pow(Math.max(r.market,1)/crsp,1/age)),'Compound yearly ratio. Compare with similar vehicles.');
 if(v.approved&&v.result&&v.result.final)add('Approved ÷ officer recommendation',pcs(v.approved/v.result.final),'Variance '+pcs(v.approved/v.result.final-1),Math.abs(v.approved/v.result.final-1)>.05);
 return o}
function ratioHTML(v,r){const a=ratios(v,r);if(!a.length)return'';
 return`<h3 style="margin-top:14px">Valuation ratios</h3>`+a.map(x=>`<div class="row"><span>${esc(x.l)}${x.note?`<br><span class="sm">${esc(x.note)}</span>`:''}</span><b class="${x.flag?'neg':''}" style="white-space:normal;text-align:right">${esc(x.val)}${x.flag?' ⚑':''}</b></div>`).join('')+'<div class="sm">⚑ marks a ratio outside its usual band. It is a prompt for review, not an error.</div>'}
function stdHTML(v,r){const p=P[v.purpose],i=v.inputs||{},nv=!!p.noval,legal=['COURT','DISPUTE'].includes(v.purpose);
 return`<h3 style="margin-top:14px">Basis of preparation and standards</h3>
 <p class="sm" style="color:inherit">${nv?'This inspection was carried out within the scope agreed with the client.':'Prepared with reference to the International Valuation Standards (IVS) framework on scope of work, bases of value, valuation approaches and reporting. Market value means the estimated amount for which the asset should exchange on the valuation date between a willing buyer and a willing seller in an arm\'s-length transaction after proper marketing, where the parties had each acted knowledgeably, prudently and without compulsion.'}</p>
 <p class="sm" style="color:inherit">Extent of investigation: visual and road-test inspection, documents supplied${nv?'':', '+(r.n||0)+' market comparable'+((r.n||0)===1?'':'s')+(i.crsp?' and the KRA CRSP as a reference'+(i.crsp_ref?' (reference year '+esc(i.crsp_ref)+')':''):'')}. Adjustments marked provisional rest on the valuer's judgement and are disclosed above.</p>
 <p class="sm" style="color:inherit">Use and reliance: this report is for the stated client and intended use only. No responsibility is accepted to any third party, and it must not be reproduced or relied on for another purpose without written consent.</p>
 ${legal?'<p class="sm" style="color:inherit">Expert declaration: the valuer understands that the duty is to give independent, impartial opinion to the court or forum, overriding any obligation to the party who instructed them. The opinion is the valuer\'s own and the independence declaration above is true.</p>':''}`}
/* Approver: edit the figures, see the recalculation and ratios, then approve */
const RVF=[['comps','Legacy market comparables (one per line)','x'],['adjustments','Evidence-backed adjustments (Category | signed KES | reason/evidence)','x'],['crsp','CRSP value (KES)','n'],['manual','Manual base (KES)','n'],['dep','Depreciation %','n'],['cond','Condition',['Excellent','Good','Fair','Poor']],['dem','Market demand',['High','Normal','Low']],['acc','Accessory contributory value (KES)','n'],['acc_reason','Accessory valuation rationale','t'],['acd','Legacy accident / repair deduction % (reference only)','n'],['repair','Repair estimate (KES)','n'],['salvage','Salvage value (KES)','n'],['hc','Forced-sale haircut %','n'],['hc_basis','Haircut basis','t']];
function rvOn(k,v){const p=P[v.purpose],has=x=>(p.adj||'').split(/\s+/).includes(x);
 return({comps:1,adjustments:1,crsp:1,manual:1,dep:has('dep'),cond:has('cond'),dem:has('dem'),acc:has('acc'),acc_reason:has('acc'),acd:has('acd'),repair:v.purpose==='ACCIDENT',salvage:v.purpose==='ACCIDENT',hc:p.hc||p.hcopt,hc_basis:p.hc||p.hcopt})[k]}
function rvPanel(v){const i=v.inputs||{};
 return`<div class="sm" style="margin-bottom:8px">Review and, where justified, correct the officer's figures. The result and ratios update as you type. Every change is written into the review record.</div>
 <details class="sgc" open><summary>Edit figures</summary><div class="grid" style="margin-top:8px">${RVF.filter(f=>rvOn(f[0],v)).map(f=>{const x=esc(i[f[0]]??'');
  return Array.isArray(f[2])?`<label>${f[1]}<select data-rv="${f[0]}" oninput="rvUpdate()"><option value=""></option>${f[2].map(o=>`<option${o===i[f[0]]?' selected':''}>${o}</option>`).join('')}</select></label>`
  :f[2]==='x'?`<label style="grid-column:1/-1">${f[1]}<textarea data-rv="${f[0]}" rows="3" oninput="rvUpdate()">${x}</textarea></label>`
  :`<label>${f[1]}<input data-rv="${f[0]}" type="${f[2]==='n'?'number':'text'}" step="any" value="${x}" oninput="rvUpdate()"></label>`}).join('')}</div></details>
 <div id="rvres" style="margin:10px 0"></div>
 <label>Approved value (KES). Defaults to the recalculated figure. Overriding it needs a reason in the notes<input id="rv" type="number" value="${Math.round(v.result.final)}" oninput="this.dataset.manual=1"></label><br>`}
function rvInputs(){const o={...S.val.inputs};document.querySelectorAll('[data-rv]').forEach(e=>{o[e.dataset.rv]=e.value});return o}
function rvEdits(){const v=S.val,o=rvInputs(),lab=Object.fromEntries(RVF.map(f=>[f[0],f[1]]));
 return RVF.map(f=>f[0]).filter(k=>rvOn(k,v)&&String(o[k]??'').trim()!==String(v.inputs[k]??'').trim()).map(k=>lab[k]+': '+(String(v.inputs[k]??'').trim()||'-')+' to '+(String(o[k]??'').trim()||'-'))}
function rvUpdate(){const v=S.val,box=$('#rvres');if(!box)return;
 const rr=calc({...v,inputs:rvInputs()}),of=v.result.final||0,nf=Math.round(rr.final),d=of?(nf-of)/of:0;
 box.innerHTML=`<div class="row"><span>Officer recommendation</span><b>${KES(of)}</b></div><div class="row"><span>Base (${rr.src||'none'})</span><b>${KES(rr.base)}</b></div>${rr.lines.map(l=>`<div class="row"><span>${esc(l[0])}</span><b class="${l[1]<0?'neg':'pos'}">${l[1]<0?'-':'+'}${KES(Math.abs(l[1]))}</b></div>`).join('')}<div class="row"><span><b>Recalculated value</b></span><b class="big">${KES(nf)}</b></div><div class="row"><span>Change from officer figure</span><b class="${Math.abs(d)>.05?'neg':''}">${d>=0?'+':''}${(d*100).toFixed(1)}%</b></div>
 ${ratios({...v,inputs:rvInputs(),approved:null},rr).map(x=>`<div class="row"><span>${esc(x.l)}</span><b class="${x.flag?'neg':''}">${esc(x.val)}${x.flag?' ⚑':''}</b></div>`).join('')}
 ${rr.stops.filter(t=>!/Chassis|senior valuer review/.test(t)).map(t=>`<div class="msg">${esc(t)}</div>`).join('')}`;
 const inp=$('#rv');if(inp&&!inp.dataset.manual)inp.value=nf}
/* Public certificate check: opened from the QR code, no login needed. Needs onsite_verify_certificate (see the .sql file) */
async function verifyView(c){
 $('#app').innerHTML=`<div class="auth wrap"><div class="brand">🚗 Auto-D <span>Verify</span></div><div class="card" id="vr"><p class="sm">Checking certificate…</p></div></div>`;
 let d=null,err='';try{const x=await sb.rpc('onsite_verify_certificate',{p_cert:c});d=x.data&&x.data[0];if(x.error)err=x.error.message}catch(e){err=String(e.message||e)}
 const ve=d&&d.vehicle||{};
 $('#vr').innerHTML=d?`<h2>Certificate is genuine</h2><div class="msg good">${esc(d.certificate_number)} was issued by Auto-D.</div><div class="row"><span>Vehicle</span><b>${esc([ve.make,ve.model,ve.plate].filter(Boolean).join(' '))}</b></div><div class="row"><span>Service</span><b>${esc(pn(d.purpose))}</b></div>${P[pc(d.purpose)].noval?'':`<div class="row"><span>Value</span><b>${KES(d.approved_value||d.final_value)}</b></div>`}<div class="row"><span>Issued</span><b>${esc(kfd(d.approved_at))}</b></div><p class="sm">Compare these details with the printed certificate.</p>`
 :`<h2>Not verified</h2><div class="msg">${err?'The check could not be completed: '+esc(err):'No issued certificate matches '+esc(c)+'. Treat the document with caution.'}</div>`}

boot();
</script>
