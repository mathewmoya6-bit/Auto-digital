            function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

            function formatCurrency(val) {
                if (val === undefined || val === null || isNaN(val)) return { formatted: '0', parts: { whole: '0', decimal: '00' } };
                const num = Number(val);
                const formatted = num.toLocaleString('en-KE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

            }

            function getVehicleName(make, model, variant) {
                const cleanMake = (make || '').trim();
                const cleanModel = (model || '').trim();
                const cleanVariant = (variant || '').trim();
                if (!cleanVariant) return `${cleanMake} ${cleanModel}`.trim();
                const variantWords = cleanVariant.split(/\s+/);
                const firstWord = variantWords[0] || '';
                if (firstWord.toLowerCase() === cleanModel.toLowerCase()) {
                    return `${cleanMake} ${cleanVariant}`.trim();
                }
                return `${cleanMake} ${cleanModel} ${cleanVariant}`.trim();
            }

            function normalizeFuelType(name) {
                if (!name) return null;
                const n = String(name).toLowerCase();
                if (n.includes('petrol') || n.includes('gasoline')) return 'petrol';
                if (n.includes('diesel')) return 'diesel';
                if (n.includes('lpg')) return 'lpg';
                if (n.includes('electric') || n.includes('ev')) return 'electric';
                if (n.includes('hybrid')) return 'petrol';
                return null;
            }

            function normalizeTransmission(name) {
                if (!name) return null;
                const n = String(name).toLowerCase();
                if (n.includes('manual')) return 'manual';
                if (n.includes('cvt')) return 'cvt';
                if (n.includes('amt')) return 'amt';
                if (n.includes('auto')) return 'automatic';
                return null;
            }

            function cleanBodyType(bodyType) {
                if (!bodyType) return '';
                const parts = bodyType.split(/\s+/);
                if (parts.length >= 2 && parts[0].toLowerCase() === parts[1].toLowerCase()) {
                    return parts.slice(1).join(' ');
                }
                return bodyType;
            }

            // ─── KRA CRSP DEPRECIATION ──────────────────────────────
            function getKraDepreciationRate(ageYears) {
                if (ageYears < 1) return 0.05;
                if (ageYears < 2) return 0.10;
                if (ageYears < 3) return 0.15;
                if (ageYears < 4) return 0.20;
                if (ageYears < 5) return 0.25;
                if (ageYears < 6) return 0.30;
                if (ageYears < 7) return 0.35;
                return 0.40; // over 7 years
            }

            async function lookupCRSPBasePrice(variantId) {
                if (!supabaseClient || !isAuthenticated || !variantId) return null;
                try {
                    const { data, error } = await supabaseClient
                        .from(CONFIG.CRSP_TABLE_NAME)
                        .select('id, make, model, model_number, transmission, drive_configuration, engine_capacity, body_type, fuel, crsp_kes')
                        .eq('engine_capacity_id', variantId)
                        .limit(1);
                    if (error || !data || data.length === 0) return null;
                    return { ...data[0], matchQuality: 'exact engine capacity match (FK)' };
                } catch (e) {
                    console.warn('CRSP base price lookup failed:', e);
                    return null;
                }
            }

            function updateFlowStep(step) {
                currentStep = step;
                const steps = el.flowSteps.querySelectorAll('.flow-step');
                steps.forEach((s, index) => {
                    const num = index + 1;
                    s.classList.remove('active', 'done');
                    if (num < step) s.classList.add('done');
                    else if (num === step) s.classList.add('active');
                });
            }

            function updateCRSPInfo(variantId, year) {
                if (!crspReferenceData || !crspReferenceData.crsp_kes) {

                    el.crspPill.classList.add('show');
                    return;

                const nowYear = new Date().getFullYear();
                const age = Math.max(0, nowYear - (parseInt(year, 10) || nowYear));
                const rate = getKraDepreciationRate(age);
                const basePrice = crspReferenceData.crsp_kes;
                const refValue = basePrice * (1 - rate);

                const matchedLine = `${crspReferenceData.make || ''} ${crspReferenceData.model || ''}`.trim() +
                    (crspReferenceData.engine_capacity ? ` · ${crspReferenceData.engine_capacity}` : '');

                el.crspMatchedLine.textContent = matchedLine || '—';
                el.crspBasePrice.textContent = `KES ${formatCurrency(basePrice).formatted}`;
                el.crspAge.textContent = `${age} year${age === 1 ? '' : 's'}`;
                el.crspDepreciationRate.textContent = `${(rate * 100).toFixed(0)}%${age >= 7 ? ' (unverified)' : ''}`;
                el.crspReferenceValue.textContent = `KES ${formatCurrency(refValue).formatted}`;
                el.crspPill.textContent = `🏛️ CRSP KES ${formatCurrency(basePrice).formatted}`;
                el.crspPill.classList.add('show');
                el.crspInfo.classList.add('show');
                updateFlowStep(5);
            }

            function renderCRSPResult(aiValue, year) {
                if (!crspReferenceData || !crspReferenceData.crsp_kes) {
                    el.crspResultSection.style.display = 'none';
                    return;
                }
                const nowYear = new Date().getFullYear();
                const age = Math.max(0, nowYear - (parseInt(year, 10) || nowYear));
                const rate = getKraDepreciationRate(age);
                const basePrice = crspReferenceData.crsp_kes;
                const refValue = basePrice * (1 - rate);
                const variancePct = refValue > 0 ? ((aiValue - refValue) / refValue) * 100 : 0;

                const matchedLine = `${crspReferenceData.make || ''} ${crspReferenceData.model || ''}`.trim() +
                    (crspReferenceData.engine_capacity ? ` · ${crspReferenceData.engine_capacity}` : '');

                el.rCrspMatched.textContent = matchedLine || '—';
                el.rCrspBase.textContent = `KES ${formatCurrency(basePrice).formatted}`;
                el.rCrspAge.textContent = `${age} year${age === 1 ? '' : 's'}`;
                el.rCrspRef.textContent = `KES ${formatCurrency(refValue).formatted}`;
                
                const sign = variancePct >= 0 ? '+' : '';
                const cls = Math.abs(variancePct) > 20 ? 'negative' : (variancePct >= 0 ? 'positive' : 'negative');
                el.rCrspVariance.textContent = `${sign}${variancePct.toFixed(1)}%`;
                el.rCrspVariance.className = `value ${cls}`;
                el.crspResultSection.style.display = 'block';
            }

            async function queryView(select, filter, order) {
                if (!isAuthenticated) {
                    showToast('⚠️ Please sign in to browse vehicles', 'warning');
                    return [];

                let query = supabaseClient.from(CONFIG.VIEW_NAME).select(select);
                if (filter) query = query.eq(filter.column, filter.value);
                if (order) query = query.order(order.column, { ascending: order.ascending !== false });
                const { data, error } = await query;
                if (error) throw error;
                return data;
            }

            // ─── API REQUEST ────────────────────────────────────────────
            async function apiRequest(endpoint, options = {}) {
                const url = `${CONFIG.API_BASE}${endpoint}`;
                const token = getAccessToken();
                const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json', ...options.headers };
                if (token) headers['Authorization'] = `Bearer ${token}`;
                
                try {
                    const response = await fetch(url, { ...options, headers, credentials: 'include' });
                    
                    if (response.status === 401) {
                        try {
                            const { data, error } = await supabaseClient.auth.refreshSession();
                            if (!error && data.session) {
                                setTokens(data.session);
                                headers['Authorization'] = `Bearer ${data.session.access_token}`;
                                const retry = await fetch(url, { ...options, headers, credentials: 'include' });
                                if (retry.status !== 401) return retry;
                            }
                        } catch (e) { console.warn('Session refresh failed:', e); }
                        clearTokens();
                        isAuthenticated = false;
                        updateAuthUI();
                        throw new Error('Authentication required. Please sign in again.');
                    }
                    
                    return response;
                    
                } catch (error) {
                    if (error instanceof Error) {
                        throw error;
                    }
                    throw new Error('Network error - please check your connection');
                }
            }

            // ─── VALUATION API CALL ──────────────────────────────────────
            async function callValuationAPI(formData) {
                // ✅ FIXED: Use the correct field names expected by the API schema
                const payload = {
                    crsp_id: parseInt(formData.variant_id) || 0,
                    year: parseInt(formData.year) || 2020,
                    mileage: parseInt(formData.mileage) || 50000,
                    condition: (formData.condition || 'good').toLowerCase(),
                    accident_history: (formData.accident_history || 'none').toLowerCase(),
                    location: (formData.location || 'nairobi').toLowerCase(),
                    service_history: false,
                    ownership_count: parseInt(formData.previous_owners) || 1,
                    profit_margin_percent: 5.00
                };

                console.log('📤 Sending valuation request:', payload);

                const response = await apiRequest('/valuation/calculate', {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    signal: AbortSignal.timeout(45000)
                });

                if (!response.ok) {
                    let errorMessage = `HTTP ${response.status}`;
                    try {
                        const errorData = await response.json();
                        if (errorData.detail) {
                            errorMessage = errorData.detail;
                        } else if (errorData.message) {
                            errorMessage = errorData.message;
                        } else if (errorData.error) {
                            errorMessage = errorData.error;
                        } else if (typeof errorData === 'string') {
                            errorMessage = errorData;
                        } else {
                            errorMessage = JSON.stringify(errorData);
                        }
                    } catch (e) {
                        errorMessage = response.statusText || `HTTP ${response.status}`;
                    }
                    throw new Error(errorMessage);
                }

                const result = await response.json();
                console.log('📥 Valuation response:', result);
                return result;
            }

            // ─── VALUATE ──────────────────────────────────────────────
            async function valuate() {
                if (!isAuthenticated) {
                    showToast('⚠️ Please sign in first', 'warning');
                    return;
                }
                const variantId = el.variantSelect.value;
                if (!variantId) {
                    showToast('Please select an engine capacity', 'error');
                    return;
                }

                if (photos.some(p => p.status === 'checking')) {
                    showToast('⏳ Still scanning photos — please wait', 'info');
                    return;
                }

                hasFlaggedPhotos = photos.some(p => p.status === 'flagged');
                
                if (hasFlaggedPhotos) {
                    showToast('⚠️ Some photos were flagged — valuation will proceed with a warning on the report', 'warning');
                }

                const variant = await loadVariantDetails(variantId);
                if (!variant) {
                    showToast('Failed to load vehicle details', 'error');
                    return;
                }
                currentVariantData = variant;
                displayVehicleInfo(variant);
                await refreshCRSPReference(variantId, el.yearSelect.value);

                const registration = el.registrationInput.value.trim().toUpperCase() || 'Not Provided';

                const formData = {
                    variant_id: variantId,
                    registration: registration,
                    year: parseInt(el.yearSelect.value) || 2020,
                    mileage: parseFloat(el.mileageInput.value) || 50000,
                    condition: el.conditionSelect.value,
                    accident_history: el.accidentSelect.value,
                    previous_owners: parseInt(el.ownersSelect.value) || 1,
                    location: el.locationSelect.value,
                    fuel_type: el.fuelTypeSelect.value,
                    transmission: el.transmissionSelect.value
                };

                el.valuateBtn.disabled = true;
                el.valuateBtn.innerHTML = '<span class="spinner"></span> Valuating...';
                el.loadingSteps.classList.add('show');
                updateLoadingStep(1);

                try {
                    let step = 1;
                    const stepInterval = setInterval(() => { step++; if (step <= 3) updateLoadingStep(step); }, 1000);
                    const result = await callValuationAPI(formData);
                    clearInterval(stepInterval);
                    updateLoadingStep(3);
                    el.loadingSteps.classList.remove('show');
                    
                    if (result && (result.valuation || result.final_market_value || result.market_value)) {
                        showResult(result, registration, formData);
                        showToast('✅ Valuation complete!', 'success');
                    } else {
                        throw new Error('No valuation data received');
                    }
                } catch (err) {
                    el.loadingSteps.classList.remove('show');
                    const errorMsg = err.message || 'Unknown error occurred';
                    showToast(`❌ Valuation failed: ${errorMsg}`, 'error');
                    console.error('Valuation error:', err);
                } finally {
                    updateValuateButtonState();
                }
            }

            function updateLoadingStep(step) {
                document.querySelectorAll('.loading-step').forEach((el, index) => {

            // ─── PHOTO UPLOAD + AUTHENTICITY CHECK ──────────────────────
            function renderPhotoGrid() {
                el.photoGrid.innerHTML = '';
                photos.forEach((p, i) => {
                    const slot = document.createElement('div');
                    slot.className = 'photo-slot' + (p.status !== 'empty' ? ' filled' : '');

                    if (p.dataUrl) {
                        slot.innerHTML = `

                            ${p.status === 'verified' ? '<div class="authenticity-badge verified">✅ Camera metadata found</div>' : ''}
                            ${p.status === 'flagged' ? '<div class="authenticity-badge flagged">⚠️ Flagged for review</div>' : ''}
                        `;
                    } else {
                        slot.innerHTML = `
                            <span class="placeholder-icon">📷</span>
                            <span class="placeholder-label">Photo ${i + 1}</span>
                            <input type="file" accept="image/*" data-index="${i}" />
                        `;
                    }
                    el.photoGrid.appendChild(slot);
                });

                el.photoGrid.querySelectorAll('input[type="file"]').forEach(input => {
                    input.addEventListener('change', function() {
                        const idx = parseInt(this.dataset.index, 10);
                        if (this.files && this.files[0]) onPhotoFileChosen(idx, this.files[0]);
                    });
                });
                el.photoGrid.querySelectorAll('.photo-slot').forEach(slotEl => {
                    slotEl.addEventListener('click', function(e) {
                        if (e.target.classList.contains('photo-remove')) return;
                        const idx = parseInt(this.dataset.index, 10);
                        if (photos[idx].status === 'empty') {
                            const input = this.querySelector('input[type="file"]');
                            if (input) input.click();
                        }
                    });
                });
                el.photoGrid.querySelectorAll('.photo-remove').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.index, 10);
                        photos[idx] = { dataUrl: null, fileName: null, status: 'empty', reason: '' };
                        renderPhotoGrid();
                        updatePhotoAuthSummary();
                        updateValuateButtonState();
                    });
                });
            }

            function onPhotoFileChosen(index, file) {
                if (!file.type || !file.type.startsWith('image/')) {
                    showToast('Please choose an image file', 'warning');
                    return;
                }
                if (file.size > 12 * 1024 * 1024) {
                    showToast('Image is too large (max 12MB)', 'warning');
                    return;
                }
                const reader = new FileReader();
                reader.onload = async function(e) {
                    photos[index] = { dataUrl: e.target.result, fileName: file.name, status: 'checking', reason: 'Analyzing…' };
                    renderPhotoGrid();
                    updatePhotoAuthSummary();
                    updateValuateButtonState();
                    const result = await checkImageAuthenticity(file);
                    photos[index].status = result.flagged ? 'flagged' : 'verified';
                    photos[index].reason = result.reason;
                    renderPhotoGrid();
                    updatePhotoAuthSummary();
                    updateValuateButtonState();
                    if (result.flagged) {
                        showToast('⚠️ Photo flagged — valuation will proceed with a warning on the report', 'warning');
                    }
                };
                reader.onerror = function() {
                    showToast('Could not read that image file', 'error');
                };
                reader.readAsDataURL(file);
            }

            async function checkImageAuthenticity(file) {
                try {
                    if (typeof exifr === 'undefined') {
                        return { flagged: true, reason: 'Metadata scanner unavailable — flagged for manual review' };
                    }
                    const meta = await exifr.parse(file, ['Make', 'Model', 'Software', 'DateTimeOriginal']).catch(() => null);

                    const software = (meta && meta.Software) ? String(meta.Software).toLowerCase() : '';
                    const aiToolPattern = /midjourney|dall-?e|stable diffusion|stablediffusion|firefly|dreamstudio|leonardo\.ai|runwayml|imagen|nightcafe|craiyon/;
                    if (software && aiToolPattern.test(software)) {
                        return { flagged: true, reason: `AI image-generation tool detected in file metadata (${meta.Software})` };
                    }

                    const hasCameraInfo = !!(meta && (meta.Make || meta.Model));
                    if (!hasCameraInfo) {
                        return {
                            flagged: true,
                            reason: 'No camera metadata found — could be screenshot/download/edited image. Valuation proceeds with warning.'
                        };
                    }
                    const camera = [meta.Make, meta.Model].filter(Boolean).join(' ');
                    return { flagged: false, reason: `Camera metadata found (${camera})` };
                } catch (e) {
                    return { flagged: true, reason: 'Could not read image metadata — flagged for manual review' };
                }
            }

            function updatePhotoAuthSummary() {
                const uploaded = photos.filter(p => p.status !== 'empty');
                if (uploaded.length === 0) {
                    el.photoAuthSummary.innerHTML = '📤 Upload clear photos of the front, rear, sides and interior. Each photo is automatically screened for signs it may be an AI-generated or non-original image.';
                    return;
                }
                const checking = uploaded.filter(p => p.status === 'checking').length;
                const flagged = uploaded.filter(p => p.status === 'flagged').length;
                const verified = uploaded.filter(p => p.status === 'verified').length;
                let msg = `<strong>${uploaded.length}/${MAX_PHOTOS} photo${uploaded.length === 1 ? '' : 's'} uploaded.</strong> `;
                if (checking) msg += `${checking} scanning… `;
                if (verified) msg += `<span class="ok">${verified} passed metadata check.</span> `;
                if (flagged) msg += `<span class="warn">⚠️ ${flagged} flagged for manual review — valuation will proceed with a warning on the report.</span>`;
                msg += ` <span class="proceed-note">(Photo screening is a heuristic — flagged images may still be genuine.)</span>`;
                el.photoAuthSummary.innerHTML = msg;
            }

            async function populateGenerations(modelId) {
                const select = el.generationSelect;
                select.innerHTML = '<option value="">Select Generation...</option>';
                select.disabled = true;
                el.variantSelect.innerHTML = '<option value="">Select a generation first</option>';
                el.variantSelect.disabled = true;
                el.valuateBtn.disabled = true;
                currentVariantData = null;
                crspReferenceData = null;
                el.crspInfo.classList.remove('show');
                el.crspPill.classList.remove('show');
                if (!modelId || !isAuthenticated) return;
                const generations = await loadGenerations(modelId);
                if (!generations || generations.length === 0) {
                    select.innerHTML = '<option value="">No generations available</option>';
                    return;
                }
                generations.forEach(gen => {
                    const opt = document.createElement('option');
                    opt.value = gen.id;
                    const label = `${gen.code || 'Gen'} (${gen.start_year} - ${gen.end_year || 'Present'})`;
                    opt.textContent = label;
                    select.appendChild(opt);
                });
                select.disabled = false;
                setStatus('success', `✅ Loaded ${generations.length} generations`);
                updateFlowStep(4);
            }

            async function populateVariants(generationId) {
                const select = el.variantSelect;
                select.innerHTML = '<option value="">Select Engine Capacity...</option>';
                select.disabled = true;
                el.valuateBtn.disabled = true;
                currentVariantData = null;
                crspReferenceData = null;
                el.crspInfo.classList.remove('show');
                el.crspPill.classList.remove('show');
                if (!generationId || !isAuthenticated) return;
                let variants = await loadVariants(generationId);
                if (!variants || variants.length === 0) {
                    select.innerHTML = '<option value="">No engine capacity options available</option>';
                    return;
                }
                const groups = new Map();
                variants.forEach(v => {
                    const ccKey = (v.engine_size_cc !== null && v.engine_size_cc !== undefined && v.engine_size_cc !== '')
                        ? String(v.engine_size_cc) : 'unknown';
                    if (!groups.has(ccKey)) groups.set(ccKey, []);
                    groups.get(ccKey).push(v);
                });
                const sortedKeys = Array.from(groups.keys()).sort((a, b) => {
                    if (a === 'unknown') return 1;
                    if (b === 'unknown') return -1;
                    return parseFloat(a) - parseFloat(b);
                });
                sortedKeys.forEach(cc => {
                    const group = groups.get(cc);
                    const rep = group[0];
                    const opt = document.createElement('option');
                    opt.value = rep.variant_id;
                    opt.dataset.engineCc = cc;
                    let label = cc === 'unknown' ? 'Engine capacity N/A' : `${cc}cc`;
                    const hpValues = group.map(v => v.power_hp).filter(v => v);
                    if (hpValues.length) {
                        const avgHp = Math.round(hpValues.reduce((s, v) => s + v, 0) / hpValues.length);
                        label += ` · ~${avgHp}hp`;
                    }
                    if (rep.fuel_type_name) label += ` — ${rep.fuel_type_name}`;
                    if (rep.transmission_type_name) label += ` ${rep.transmission_type_name}`;
                    if (group.length > 1) label += ` (${group.length} trims)`;
                    opt.textContent = label;
                    select.appendChild(opt);
                });
                select.disabled = false;
                setStatus('success', `✅ Loaded ${sortedKeys.length} engine capacity options`);
                updateFlowStep(5);
            }

            // ─── EVENT LISTENERS ─────────────────────────────────────────
            function initEventListeners() {
                el.btnSignIn.addEventListener('click', () => {
                    el.authForms.style.display = el.authForms.style.display === 'none' ? 'block' : 'none';
                });
                el.btnCancelAuth.addEventListener('click', () => { el.authForms.style.display = 'none'; });
                el.btnLogin.addEventListener('click', async () => {
                    const email = el.authEmail.value.trim();
                    const password = el.authPassword.value;
                    if (!email || !password) { showToast('Please enter email and password', 'warning'); return; }
                    await signIn(email, password);
                    el.authForms.style.display = 'none';
                    el.authEmail.value = '';
                    el.authPassword.value = '';
                    populateCategories();
                });
                el.btnSignup.addEventListener('click', async () => {
                    const email = el.authEmail.value.trim();
                    const password = el.authPassword.value;
                    if (!email || !password) { showToast('Please enter email and password', 'warning'); return; }
                    if (password.length < 6) { showToast('Password must be at least 6 characters', 'warning'); return; }
                    await signUp(email, password);
                    el.authForms.style.display = 'none';
                    el.authEmail.value = '';
                    el.authPassword.value = '';
                });
                el.btnSignOut.addEventListener('click', signOut);

                el.categorySelect.addEventListener('change', async function() {
                    const catId = this.value;
                    if (catId && isAuthenticated) {
                        await populateMakes(catId);
                        el.modelSelect.value = '';
                        el.generationSelect.value = '';
                        el.variantSelect.value = '';
                        el.valuateBtn.disabled = true;
                        el.resultBox.classList.remove('show');
                        el.crspInfo.classList.remove('show');
                        el.crspPill.classList.remove('show');
                    }
                });

                el.makeSelect.addEventListener('change', async function() {
                    if (!isAuthenticated) return;
                    const makeId = this.value;
                    if (makeId) {
                        await populateModels(makeId);
                        el.generationSelect.value = '';
                        el.variantSelect.value = '';
                        el.valuateBtn.disabled = true;
                        el.resultBox.classList.remove('show');
                        el.crspInfo.classList.remove('show');
                        el.crspPill.classList.remove('show');
                    }
                });

                el.modelSelect.addEventListener('change', async function() {
                    if (!isAuthenticated) return;
                    const modelId = this.value;
                    if (modelId) {
                        await populateGenerations(modelId);
                        el.variantSelect.value = '';
                        el.valuateBtn.disabled = true;
                        el.resultBox.classList.remove('show');
                        el.crspInfo.classList.remove('show');
                        el.crspPill.classList.remove('show');
                    }
                });

                el.generationSelect.addEventListener('change', async function() {
                    if (!isAuthenticated) return;
                    const genId = this.value;
                    if (genId) {
                        await populateVariants(genId);
                        el.valuateBtn.disabled = true;
                        el.resultBox.classList.remove('show');
                        el.crspInfo.classList.remove('show');
                        el.crspPill.classList.remove('show');
                    }
                });

                el.variantSelect.addEventListener('change', async function() {
                    if (!isAuthenticated) return;
                    const variantId = this.value;
                    if (variantId) {
                        updateValuateButtonState();
                        const variant = await loadVariantDetails(variantId);
                        if (variant) {
                            currentVariantData = variant;
                            displayVehicleInfo(variant);
                            const fuelGuess = normalizeFuelType(variant.fuel_type_name);
                            if (fuelGuess) el.fuelTypeSelect.value = fuelGuess;
                            const transGuess = normalizeTransmission(variant.transmission_type_name);
                            if (transGuess) el.transmissionSelect.value = transGuess;
                            await refreshCRSPReference(variantId, el.yearSelect.value);
                        }
                        el.resultBox.classList.remove('show');
                    }
                });

                el.yearSelect.addEventListener('change', function() {
                    if (currentVariantData) {
                        refreshCRSPReference(currentVariantData.variant_id, this.value);
                    }
                });

                el.fuelTypeSelect.addEventListener('change', updateVehiclePills);
                el.transmissionSelect.addEventListener('change', updateVehiclePills);

                el.valuateBtn.addEventListener('click', valuate);

                document.getElementById('printBtn').addEventListener('click', function() {
                    setTimeout(() => window.print(), 500);
                });

                document.getElementById('shareBtn').addEventListener('click', function() {
                    const url = window.location.href;
                    const text =
                        `Auto-D Kenya Vehicle Valuation\nVehicle: ${el.vehicleLabel.textContent}\nValue: ${el.resultMarketValue.textContent}`;
                    if (navigator.share) {
                        navigator.share({ title: 'Auto-D Kenya Vehicle Valuation', text, url }).catch(() => {});
                    } else {
                        navigator.clipboard.writeText(`${text}\n${url}`).then(() => {
                            showToast('📋 Report copied to clipboard!', 'success');
                        }).catch(() => showToast('Share not available', 'error'));
                    }
                });

                setInterval(async () => { await checkAuth(); }, 30000);
            }

            function updateVehiclePills() {
                const fuelVal = el.fuelTypeSelect.value;
                const transVal = el.transmissionSelect.value;
                el.fuelPill.textContent = FUEL_TYPE_LABELS[fuelVal] || '—';
                el.transmissionPill.textContent = TRANSMISSION_LABELS[transVal] || '—';
            }

            // ─── INIT ──────────────────────────────────────────────────
            async function init() {
                showLoadingBar();
                try {
                    populateYearSelect();
                    renderPhotoGrid();
                    updateValuateButtonState();
                    const supabaseOk = initSupabase();
                    if (!supabaseOk) {
                        setStatus('error', "Connection failed — please refresh");
                        hideLoadingBar();
                        return;
                    }
                    await checkAuth();
                    await populateCategories();
                    if (el.categorySelect.options.length > 1) {
                        el.categorySelect.selectedIndex = 1;
                        el.categorySelect.dispatchEvent(new Event('change'));
                    }
                    el.lastUpdated.textContent = new Date().toLocaleDateString('en-KE', {
                        year: 'numeric', month: 'short', day: 'numeric'
                    });
                    console.log('✅ Auto-D Kenya Instant Value Check initialized (v5.3)');
                    console.log(`🔐 Authenticated: ${isAuthenticated ? '✅ Yes' : '❌ No'}`);
                    console.log(`🏛️ CRSP Table: ${CONFIG.CRSP_TABLE_NAME}`);
                    console.log(`📷 Photo screening: Flagged photos allow valuation with warning`);
                    console.log(`🔗 API: ${CONFIG.API_BASE}/valuation/calculate`);
                } catch (error) {
                    console.error('Init error:', error);
                    setStatus('error', "Something went wrong — please refresh");
                } finally {
                    hideLoadingBar();
                }
            }

            document.addEventListener('DOMContentLoaded', function() {
                initEventListeners();
                init();
            });

        })();
    </script>

</body>
