<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Auto-D Kenya | Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c15;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .card {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
        }
        .badge-success { background: rgba(34, 197, 94, 0.15) !important; color: #22c55e !important; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 28px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon { font-size: 32px; }
        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #f8fafc;
        }
        .logo-text span { color: #eab308; }
        .logo-sub { font-size: 12px; color: #64748b; display: block; margin-top: -2px; }
        .auth-section { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: #eab308; color: #0a0c15; }
        .btn-primary:hover { background: #ca8a04; transform: translateY(-1px); }
        .btn-outline { background: transparent; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.06); }
        .btn-outline:hover { border-color: #eab308; color: #eab308; }
        .btn-success { background: #22c55e; color: #0a0c15; }
        .btn-success:hover { opacity: 0.85; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0a0c15;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }
        .user-name { font-weight: 600; font-size: 14px; }
        .user-email { font-size: 12px; color: #64748b; }
        .service-tabs {
            display: flex;
            gap: 4px;
            background: #0a0c15;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow-x: auto;
        }
        .service-tab {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #64748b;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .service-tab:hover { color: #cbd5e1; background: rgba(255,255,255,0.03); }
        .service-tab.active { background: #eab308; color: #0a0c15; }
        .service-tab .tab-badge {
            display: inline-block;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            margin-left: 4px;
        }
        .service-tab.active .tab-badge { background: rgba(0,0,0,0.15); }
        .service-tab .tab-badge.unlocked { background: rgba(34,197,94,0.2); color: #22c55e; }
        .service-tab .tab-badge.locked { background: rgba(234,179,8,0.2); color: #eab308; }
        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #0a0c15;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .service-item:last-child { margin-bottom: 0; }
        .service-info { flex: 1; min-width: 180px; }
        .service-name { font-weight: 600; font-size: 15px; color: #f8fafc; }
        .service-desc { font-size: 13px; color: #64748b; }
        .service-status {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .service-status.unlocked { background: rgba(34,197,94,0.15); color: #22c55e; }
        .service-status.locked { background: rgba(234,179,8,0.15); color: #eab308; }
        .service-price {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #eab308;
            min-width: 120px;
            text-align: right;
        }
        .service-price.unavailable { color: #64748b; font-size: 13px; font-weight: 600; }
        .service-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .payment-form .form-group { margin-bottom: 16px; }
        .payment-form label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 4px;
        }
        .payment-form input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0c15;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
        }
        .payment-form input:focus { outline: none; border-color: #eab308; }
        .payment-form small { color: #64748b; font-size: 11px; display: block; margin-top: 4px; }
        .status-box {
            background: #0a0c15;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 16px 20px;
            min-height: 70px;
            font-size: 14px;
            line-height: 1.7;
            color: #cbd5e1;
            font-family: 'JetBrains Mono', monospace;
        }
        .status-box .status-success { color: #22c55e; }
        .status-box .status-pending { color: #eab308; }
        .status-box .status-error { color: #ef4444; }
        .status-box .status-info { color: #3b82f6; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        th { font-weight: 600; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
        td { color: #cbd5e1; }
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.pending { background: rgba(234,179,8,0.15); color: #eab308; }
        .status-badge.paid { background: rgba(34,197,94,0.15); color: #22c55e; }
        .status-badge.failed { background: rgba(239,68,68,0.15); color: #ef4444; }
        .loading {
            color: #64748b;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(234,179,8,0.2);
            border-top-color: #eab308;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 400px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            animation: slideIn 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .toast-success { background: #22c55e; color: #0a0c15; }
        .toast-error { background: #ef4444; color: #fff; }
        .toast-info { background: #3b82f6; color: #fff; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .empty-state { text-align: center; padding: 30px 16px; color: #64748b; }
        .empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }
        .empty-state .empty-title { font-size: 16px; font-weight: 600; color: #cbd5e1; }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }
        .status-indicator .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.green { background: #22c55e; }
        .dot.red { background: #ef4444; }
        .admin-btn {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #0a0c15;
            border: none;
            border-radius: 8px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .admin-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(168,85,247,0.3); }
        @media (max-width: 768px) {
            body { padding: 12px; }
            .card { padding: 16px; }
            .service-item { flex-direction: column; align-items: stretch; }
            .service-price { text-align: left; min-width: unset; }
            .service-actions { justify-content: space-between; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <a href="/" class="logo">
            <span class="logo-icon">🚗</span>
            <div>
                <span class="logo-text">Auto-D <span>Kenya</span></span>
                <span class="logo-sub">Vehicle Intelligence Platform</span>
            </div>
        </a>
        <div class="auth-section" id="authSection">
            <!-- populated by JS -->
        </div>
    </header>

    <!-- ADMIN LINK -->
    <div id="adminLinkContainer" style="display:none; margin-bottom: 16px;">
        <a href="/admin.html" class="admin-btn" target="_blank"><i class="fas fa-cog"></i> Admin Dashboard</a>
    </div>

    <!-- SERVICES -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                🚀 Services <span class="badge">Access</span><span class="badge badge-success">Live</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <div class="status-indicator">
                    <span class="dot green" id="statusDot"></span>
                    <span id="connectionStatus">Connected</span>
                </div>
                <button class="btn btn-sm btn-outline" onclick="window.__AUTOD?.refresh()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <div class="service-tabs" id="serviceTabs">
            <button class="service-tab active" data-service="valuation" onclick="window.switchTab('valuation')">
                💰 Valuation <span class="tab-badge locked" id="badge-valuation">🔒</span>
            </button>
            <button class="service-tab" data-service="mileage" onclick="window.switchTab('mileage')">
                📈 Mileage <span class="tab-badge locked" id="badge-mileage">🔒</span>
            </button>
            <button class="service-tab" data-service="ownership" onclick="window.switchTab('ownership')">
                📊 Ownership <span class="tab-badge locked" id="badge-ownership">🔒</span>
            </button>
        </div>

        <div id="services"><span class="loading"><span class="spinner"></span> Loading...</span></div>
    </div>

    <!-- PAYMENT -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">📱 M-Pesa Payment <span class="badge">Secure</span></div>
        </div>
        <div class="payment-form">
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number</label>
                <input id="phone" type="tel" placeholder="2547XXXXXXXX" />
                <small>Format: 2547XXXXXXXX</small>
            </div>
            <button id="payBtn" class="btn btn-primary" disabled style="width:100%;justify-content:center;font-size:16px;padding:14px;">
                <i class="fas fa-lock"></i> Select a service first
            </button>
            <div style="margin-top:16px;">
                <div class="status-box" id="statusBox">Waiting for payment...</div>
            </div>
        </div>
    </div>

    <!-- HISTORY -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">📜 Payment History <span class="badge">Recent</span></div>
            <button class="btn btn-sm btn-outline" onclick="window.__AUTOD?.loadHistory()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
        <div id="payments"><span class="loading"><span class="spinner"></span> Loading...</span></div>
    </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ─── SIMPLE WORKING DASHBOARD — NO LOGIN, JUST LOGOUT ──────

(function() {
    'use strict';

    // ─── CONFIG ──────────────────────────────────────────────
    const SUPABASE_URL = 'https://xgkdbithhlvoqjnqvfmj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhna2RiaXRoaGx2b3FqbnF2Zm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NTE4NzQsImV4cCI6MjA5ODIyNzg3NH0.-4P2aQAlDl_4oW0C18gh7cEBzoIKeiLUmMnITz-Nt9Y';
    const API_BASE = 'https://auto-digital.onrender.com/api/v1';

    // ─── STATE ──────────────────────────────────────────────
    let supabaseClient = null;
    let currentUser = null;
    let isAuthenticated = false;
    let activeTab = 'valuation';
    let selectedService = null;
    let servicePrices = {};
    let serviceAccess = {};
    let serviceDefs = [];

    // ─── DOM REFS ────────────────────────────────────────────
    const servicesEl = document.getElementById('services');
    const paymentsEl = document.getElementById('payments');
    const statusBox = document.getElementById('statusBox');
    const phoneInput = document.getElementById('phone');
    const payBtn = document.getElementById('payBtn');
    const authSection = document.getElementById('authSection');
    const statusDot = document.getElementById('statusDot');
    const connectionStatus = document.getElementById('connectionStatus');
    const adminLink = document.getElementById('adminLinkContainer');

    // ─── HELPERS ─────────────────────────────────────────────
    function showToast(msg, type = 'info') {
        const c = document.getElementById('toastContainer');
        if (!c) return;
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }

    function setStatus(msg, type = 'info') {
        const map = { success: 'status-success', pending: 'status-pending', error: 'status-error', info: 'status-info' };
        statusBox.innerHTML = `<span class="${map[type] || 'status-info'}">${msg}</span>`;
    }

    function formatPrice(p) { return p != null ? `KSh ${Number(p).toLocaleString()}` : '—'; }

    function updateConnection(connected) {
        if (statusDot && connectionStatus) {
            statusDot.className = `dot ${connected ? 'green' : 'red'}`;
            connectionStatus.textContent = connected ? 'Connected' : 'Disconnected';
        }
    }

    // ─── SUPABASE ────────────────────────────────────────────
    function initSupabase() {
        if (!supabaseClient && typeof supabase !== 'undefined') {
            const { createClient } = supabase;
            supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: { autoRefreshToken: true, persistSession: true }
            });
        }
        return supabaseClient;
    }

    async function query(table, select = '*', filters = {}, order = null) {
        try {
            const client = initSupabase();
            if (!client) throw new Error('Supabase not initialized');
            let q = client.from(table).select(select);
            Object.keys(filters).forEach(k => {
                if (Array.isArray(filters[k])) q = q.in(k, filters[k]);
                else q = q.eq(k, filters[k]);
            });
            if (order) q = q.order(order.column, { ascending: order.ascending || false });
            const { data, error } = await q;
            if (error) throw error;
            return { success: true, data };
        } catch (e) { return { success: false, error: e.message }; }
    }

    // ─── AUTH ────────────────────────────────────────────────
    async function getCurrentUser() {
        try {
            const client = initSupabase();
            if (!client) return null;
            const { data: { session } } = await client.auth.getSession();
            if (session?.user) {
                currentUser = session.user;
                isAuthenticated = true;
                localStorage.setItem('auto_d_user', JSON.stringify(currentUser));
                return currentUser;
            }
            const stored = localStorage.getItem('auto_d_user');
            if (stored) {
                currentUser = JSON.parse(stored);
                isAuthenticated = true;
                return currentUser;
            }
            isAuthenticated = false;
            return null;
        } catch { isAuthenticated = false; return null; }
    }

    function renderAuth(user) {
        if (user) {
            const name = user.user_metadata?.full_name || user.email?.split('@')[0] || 'User';
            const initial = name.charAt(0).toUpperCase();
            authSection.innerHTML = `
                <div class="user-info">
                    <div class="user-avatar">${initial}</div>
                    <div><div class="user-name">${name}</div><div class="user-email">${user.email}</div></div>
                </div>
                <button class="btn btn-sm btn-danger" onclick="window.__AUTOD?.logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            `;
        } else {
            authSection.innerHTML = `
                <span style="color:#64748b;font-size:14px;">Not logged in</span>
                <button class="btn btn-primary btn-sm" onclick="window.__AUTOD?.goToLanding()">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            `;
        }
    }

    async function logout() {
        try {
            const client = initSupabase();
            if (client) await client.auth.signOut();
            localStorage.removeItem('auto_d_user');
            isAuthenticated = false;
            currentUser = null;
            renderAuth(null);
            showToast('Logged out', 'info');
            servicesEl.innerHTML = '<span class="loading">Please log in</span>';
            paymentsEl.innerHTML = '<span class="loading">Please log in</span>';
            payBtn.disabled = true;
            payBtn.innerHTML = '<i class="fas fa-lock"></i> Login to pay';
            adminLink.style.display = 'none';
        } catch (e) { showToast('Logout error', 'error'); }
    }

    function goToLanding() {
        window.location.href = '/';
    }

    // ─── FETCH DATA ──────────────────────────────────────────
    async function fetchServices() {
        const res = await query('services', '*');
        if (res.success && res.data.length) {
            serviceDefs = res.data;
        } else {
            serviceDefs = [
                { key: 'valuation', name: 'Vehicle Valuation', description: 'Get instant market value' },
                { key: 'mileage', name: 'Mileage Verification', description: 'Verify odometer readings' },
                { key: 'ownership', name: 'Ownership History', description: 'Track previous owners' }
            ];
        }
        return serviceDefs;
    }

    async function fetchPrices() {
        const res = await query('service_prices', '*', {}, { column: 'created_at', ascending: false });
        if (res.success) {
            const latest = {};
            res.data.forEach(row => {
                if (row.service_key && row.price != null) {
                    if (!latest[row.service_key] || new Date(row.created_at) > new Date(latest[row.service_key].created_at)) {
                        latest[row.service_key] = row;
                    }
                }
            });
            Object.keys(latest).forEach(k => { servicePrices[k] = Number(latest[k].price); });
        }
        if (!servicePrices.valuation) servicePrices.valuation = 150;
        if (!servicePrices.mileage) servicePrices.mileage = 200;
        if (!servicePrices.ownership) servicePrices.ownership = 180;
        return servicePrices;
    }

    async function fetchAccess(userId) {
        if (!userId) return {};
        const res = await query('user_service_access', '*', { user_id: userId });
        if (res.success) {
            const access = {};
            res.data.forEach(row => { if (row.service_key && row.unlocked) access[row.service_key] = true; });
            serviceAccess = access;
        }
        return serviceAccess;
    }

    // ─── RENDER ──────────────────────────────────────────────
    function renderServices() {
        let html = '';
        let found = false;
        serviceDefs.forEach(def => {
            const key = def.key;
            if (!key || activeTab !== key) return;
            found = true;
            const unlocked = serviceAccess[key] || false;
            const price = servicePrices[key] || 0;
            html += `
                <div class="service-item">
                    <div class="service-info">
                        <div class="service-name">${def.name || key}</div>
                        <div class="service-desc">${def.description || ''}</div>
                        <span class="service-status ${unlocked ? 'unlocked' : 'locked'}">${unlocked ? '✅ Unlocked' : '🔒 Locked'}</span>
                    </div>
                    <div class="service-price ${!unlocked ? 'unavailable' : ''}">
                        ${unlocked ? formatPrice(price) : 'Unavailable'}
                    </div>
                    <div class="service-actions">
                        ${unlocked ? `
                            <button class="btn btn-success btn-sm" onclick="window.__AUTOD?.run('${key}')">
                                <i class="fas fa-play"></i> Run
                            </button>
                        ` : `
                            <button class="btn btn-primary btn-sm" onclick="window.__AUTOD?.select('${key}')">
                                <i class="fas fa-shopping-cart"></i> Purchase KSh ${price}
                            </button>
                        `}
                    </div>
                </div>
            `;
        });
        if (!found) html = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No services</div></div>`;
        servicesEl.innerHTML = html;
        updateBadges();
        updatePayBtn();
    }

    function updateBadges() {
        serviceDefs.forEach(def => {
            const key = def.key;
            if (!key) return;
            const b = document.getElementById(`badge-${key}`);
            if (b) {
                const unlocked = serviceAccess[key] || false;
                b.textContent = unlocked ? '✅' : '🔒';
                b.className = `tab-badge ${unlocked ? 'unlocked' : 'locked'}`;
            }
        });
    }

    function updatePayBtn() {
        if (!isAuthenticated) {
            payBtn.disabled = true;
            payBtn.innerHTML = '<i class="fas fa-lock"></i> Login to pay';
            return;
        }
        if (selectedService) {
            const price = servicePrices[selectedService] || 0;
            const def = serviceDefs.find(d => d.key === selectedService);
            payBtn.disabled = false;
            payBtn.innerHTML = `<i class="fas fa-mobile-alt"></i> Pay KSh ${price} for ${def?.name || selectedService}`;
        } else {
            payBtn.disabled = true;
            payBtn.innerHTML = '<i class="fas fa-lock"></i> Select a service first';
        }
    }

    // ─── ACTIONS ──────────────────────────────────────────────
    window.switchTab = function(tab) {
        activeTab = tab;
        document.querySelectorAll('.service-tab').forEach(el => {
            el.classList.toggle('active', el.dataset.service === tab);
        });
        renderServices();
    };

    window.select = function(key) {
        if (!isAuthenticated) return showToast('Please log in', 'error');
        selectedService = key;
        const def = serviceDefs.find(d => d.key === key);
        setStatus(`Selected ${def?.name || key} — KSh ${servicePrices[key] || 0}`, 'info');
        showToast(`✅ ${def?.name || key} selected`, 'success');
        updatePayBtn();
    };

    window.run = function(key) {
        if (!isAuthenticated) return showToast('Please log in', 'error');
        if (!serviceAccess[key]) return showToast('Service not unlocked', 'error');
        setStatus(`⏳ Running ${key}...`, 'pending');
        showToast(`🚀 Running ${key}...`, 'info');
        setTimeout(() => {
            setStatus(`✅ ${key} completed!`, 'success');
            showToast(`✅ ${key} report ready`, 'success');
        }, 2000);
    };

    window.refresh = async function() {
        await fetchPrices();
        if (currentUser) await fetchAccess(currentUser.id);
        renderServices();
        showToast('🔄 Refreshed', 'info');
    };

    // ─── M-PESA PAYMENT ──────────────────────────────────────
    async function initiatePayment() {
        if (!isAuthenticated) return showToast('Please log in', 'error');
        if (!selectedService) return showToast('Select a service first', 'error');

        const phone = phoneInput.value.trim();
        if (!phone.match(/^2547\d{8}$/)) {
            setStatus('❌ Invalid phone. Use 2547XXXXXXXX', 'error');
            return showToast('Invalid phone format', 'error');
        }

        const price = servicePrices[selectedService] || 0;
        setStatus(`⏳ Initiating payment for ${selectedService} (KSh ${price})...`, 'pending');
        payBtn.disabled = true;
        payBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

        try {
            const res = await fetch(`${API_BASE}/mpesa/stkpush`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone,
                    amount: price,
                    service_key: selectedService,
                    user_id: currentUser?.id || 'unknown'
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Payment failed');

            setStatus('✅ M-PESA prompt sent to your phone', 'success');
            showToast('📱 Check your phone for M-PESA prompt', 'success');

            // Poll status
            let attempts = 0;
            const interval = setInterval(async () => {
                try {
                    const sr = await fetch(`${API_BASE}/mpesa/status/${data.checkout_request_id}`);
                    const sd = await sr.json();
                    if (sd.status === 'completed') {
                        clearInterval(interval);
                        serviceAccess[selectedService] = true;
                        await updateAccess(selectedService, true);
                        setStatus('✅ Payment completed! Service unlocked.', 'success');
                        showToast('🎉 Payment successful!', 'success');
                        renderServices();
                        loadHistory();
                        payBtn.disabled = false;
                        payBtn.innerHTML = '<i class="fas fa-check"></i> Unlocked';
                    } else if (sd.status === 'failed' || attempts > 20) {
                        clearInterval(interval);
                        setStatus('❌ Payment failed. Try again.', 'error');
                        showToast('❌ Payment failed', 'error');
                        payBtn.disabled = false;
                        payBtn.innerHTML = '<i class="fas fa-redo"></i> Retry';
                    }
                    attempts++;
                } catch (e) { /* ignore */ }
            }, 5000);

        } catch (e) {
            setStatus(`❌ ${e.message}`, 'error');
            showToast('❌ Payment error: ' + e.message, 'error');
            payBtn.disabled = false;
            payBtn.innerHTML = '<i class="fas fa-redo"></i> Retry';
        }
    }

    async function updateAccess(key, unlocked) {
        try {
            const client = initSupabase();
            if (!client || !currentUser) return;
            await client.from('user_service_access').upsert({
                user_id: currentUser.id,
                service_key: key,
                unlocked: unlocked,
                updated_at: new Date().toISOString()
            }, { onConflict: 'user_id,service_key' });
        } catch (e) { /* ignore */ }
    }

    // ─── PAYMENT HISTORY ──────────────────────────────────────
    async function loadHistory() {
        if (!isAuthenticated || !currentUser) {
            paymentsEl.innerHTML = '<span class="loading">Please log in</span>';
            return;
        }
        const res = await query('payments', '*', { user_id: currentUser.id }, { column: 'created_at', ascending: false });
        if (!res.success || !res.data.length) {
            paymentsEl.innerHTML = `<div class="empty-state"><div class="empty-icon">💳</div><div class="empty-title">No payments yet</div></div>`;
            return;
        }
        let html = `<div class="table-wrap"><table><thead><tr><th>Service</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>`;
        res.data.forEach(p => {
            const cls = p.status === 'completed' || p.status === 'paid' ? 'paid' : p.status === 'failed' ? 'failed' : 'pending';
            html += `<tr><td>${p.service_key || '—'}</td><td>KSh ${Number(p.amount).toLocaleString()}</td>
                <td><span class="status-badge ${cls}">${p.status || 'pending'}</span></td>
                <td>${p.created_at ? new Date(p.created_at).toLocaleDateString() : '—'}</td></tr>`;
        });
        html += `</tbody></table></div>`;
        paymentsEl.innerHTML = html;
    }

    // ─── INIT ──────────────────────────────────────────────────
    async function init() {
        updateConnection(true);
        const user = await getCurrentUser();
        renderAuth(user);
        if (!user) {
            servicesEl.innerHTML = '<span class="loading">Please log in</span>';
            paymentsEl.innerHTML = '<span class="loading">Please log in</span>';
            return;
        }
        // Show admin link if admin
        const isAdmin = user.user_metadata?.role === 'admin' || user.user_metadata?.is_admin;
        adminLink.style.display = isAdmin ? 'block' : 'none';

        await fetchServices();
        await fetchPrices();
        await fetchAccess(user.id);
        renderServices();
        loadHistory();
        setStatus('✅ Ready', 'success');
    }

    // ─── EXPOSE ──────────────────────────────────────────────
    window.__AUTOD = {
        logout,
        goToLanding,
        select: window.select,
        run: window.run,
        refresh: window.refresh,
        loadHistory,
        switchTab: window.switchTab,
        initiatePayment,
    };

    document.addEventListener('DOMContentLoaded', () => {
        payBtn.addEventListener('click', initiatePayment);
        init();
    });

})();
</script>
</body>
</html>
