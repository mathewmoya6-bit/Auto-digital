    <script>
        // ═══════════════════════════════════════════════════════════════
        // AUTO-D KENYA - USER DASHBOARD (FIXED)
        // Fetches from Supabase directly - same as admin dashboard
        // ═══════════════════════════════════════════════════════════════

        (function() {
            'use strict';

            // ─── CONFIG ──────────────────────────────────────────────────
            const SUPABASE_URL = 'https://xgkdbithhlvoqjnqvfmj.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhna2RiaXRoaGx2b3FqbnF2Zm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NTE4NzQsImV4cCI6MjA5ODIyNzg3NH0.-4P2aQAlDl_4oW0C18gh7cEBzoIKeiLUmMnITz-Nt9Y';
            
            const API_BASE = 'https://auto-digital.onrender.com/api/v1';
            const PRICE_POLLING_INTERVAL = 30000;

            // ─── STATE ──────────────────────────────────────────────────
            let supabaseClient = null;
            let selectedService = null;
            let selectedServiceName = null;
            let selectedServicePrice = null;
            let checkoutRequestId = null;
            let statusTimer = null;
            let currentUser = null;
            let isAuthenticated = false;
            let accessToken = null;
            let paymentCompleted = false;
            let serviceAccess = {};
            let activeTab = 'valuation';
            let servicePrices = {};
            let pricePollingTimer = null;
            let lastPriceUpdate = null;
            let isAdmin = false;

            // ─── DOM REFS ──────────────────────────────────────────────
            const servicesEl = document.getElementById('services');
            const paymentsEl = document.getElementById('payments');
            const statusBox = document.getElementById('statusBox');
            const phoneInput = document.getElementById('phone');
            const payBtn = document.getElementById('payBtn');
            const authSection = document.getElementById('authSection');
            const priceUpdateTime = document.getElementById('priceUpdateTime');
            const adminLinkContainer = document.getElementById('adminLinkContainer');
            const statusDot = document.getElementById('statusDot');
            const connectionStatus = document.getElementById('connectionStatus');

            // ─── UPDATE CONNECTION STATUS ─────────────────────────────
            function updateConnectionStatus(connected) {
                if (statusDot && connectionStatus) {
                    if (connected) {
                        statusDot.className = 'dot green';
                        connectionStatus.textContent = 'Connected';
                    } else {
                        statusDot.className = 'dot red';
                        connectionStatus.textContent = 'Disconnected';
                    }
                }
            }

            // ─── INIT SUPABASE ──────────────────────────────────────────
            function initSupabase() {
                try {
                    if (typeof supabase === 'undefined') {
                        console.warn('⚠️ Supabase SDK not loaded');
                        return null;
                    }
                    if (!supabaseClient) {
                        const { createClient } = supabase;
                        supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                            auth: {
                                autoRefreshToken: true,
                                persistSession: true,
                                detectSessionInUrl: true
                            }
                        });
                        console.log('✅ Supabase client initialized');
                    }
                    return supabaseClient;
                } catch (error) {
                    console.error('❌ Supabase init error:', error);
                    return null;
                }
            }

            // ─── QUERY SUPABASE ──────────────────────────────────────────
            async function querySupabase(table, select = '*', filters = {}, order = null, limit = null) {
                try {
                    const client = initSupabase();
                    if (!client) throw new Error('Supabase not initialized');
                    let query = client.from(table).select(select);
                    Object.keys(filters).forEach(key => {
                        if (Array.isArray(filters[key])) {
                            query = query.in(key, filters[key]);
                        } else {
                            query = query.eq(key, filters[key]);
                        }
                    });
                    if (order) {
                        query = query.order(order.column, { ascending: order.ascending || false });
                    }
                    if (limit) {
                        query = query.limit(limit);
                    }
                    const { data, error } = await query;
                    if (error) throw error;
                    return { success: true, data };
                } catch (error) {
                    console.error(`❌ Query error (${table}):`, error);
                    return { success: false, error: error.message };
                }
            }

            // ─── TOAST ──────────────────────────────────────────────────
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100px)';
                    setTimeout(() => toast.remove(), 400);
                }, 4000);
            }

            // ─── SET STATUS ────────────────────────────────────────────
            function setStatus(message, type = 'info') {
                const typeMap = {
                    success: 'status-success',
                    pending: 'status-pending',
                    error: 'status-error',
                    info: 'status-info'
                };
                statusBox.innerHTML = `<span class="${typeMap[type] || 'status-info'}">${message}</span>`;
            }

            // ─── AUTH ──────────────────────────────────────────────────
            async function getCurrentUser() {
                try {
                    const client = initSupabase();
                    if (!client) return null;

                    const { data: { session }, error } = await client.auth.getSession();
                    if (error) throw error;

                    if (session?.user) {
                        currentUser = session.user;
                        isAuthenticated = true;
                        accessToken = session.access_token;
                        localStorage.setItem('auto_d_user', JSON.stringify(currentUser));
                        localStorage.setItem('access_token', accessToken);

                        const userMetadata = currentUser.user_metadata || {};
                        const appMetadata = currentUser.app_metadata || {};
                        isAdmin = userMetadata.role === 'admin' ||
                                 appMetadata.role === 'admin' ||
                                 userMetadata.is_admin === true ||
                                 appMetadata.is_admin === true;

                        if (isAdmin) {
                            adminLinkContainer.style.display = 'block';
                        }

                        return currentUser;
                    }

                    const stored = localStorage.getItem('auto_d_user');
                    if (stored) {
                        try {
                            currentUser = JSON.parse(stored);
                            isAuthenticated = true;
                            const token = localStorage.getItem('access_token');
                            if (token) accessToken = token;
                            return currentUser;
                        } catch (e) {}
                    }

                    isAuthenticated = false;
                    return null;
                } catch (err) {
                    console.error('Auth error:', err);
                    isAuthenticated = false;
                    return null;
                }
            }

            async function signIn(email, password) {
                try {
                    const client = initSupabase();
                    if (!client) throw new Error('Supabase not initialized');

                    const { data, error } = await client.auth.signInWithPassword({
                        email: email.toLowerCase().trim(),
                        password: password
                    });

                    if (error) throw error;

                    currentUser = data.user;
                    isAuthenticated = true;
                    accessToken = data.session.access_token;
                    localStorage.setItem('auto_d_user', JSON.stringify(currentUser));
                    localStorage.setItem('access_token', accessToken);
                    renderAuthUI();
                    showToast('✅ Signed in successfully!', 'success');
                    await loadDashboard();
                    return true;
                } catch (error) {
                    showToast('❌ Sign in failed: ' + error.message, 'error');
                    return false;
                }
            }

            async function signUp(email, password) {
                try {
                    const client = initSupabase();
                    if (!client) throw new Error('Supabase not initialized');

                    const { data, error } = await client.auth.signUp({
                        email: email.toLowerCase().trim(),
                        password: password,
                        options: {
                            data: {
                                full_name: email.split('@')[0]
                            }
                        }
                    });

                    if (error) throw error;

                    if (data.user) {
                        showToast('✅ Account created! Please check your email to confirm.', 'success');
                        return true;
                    }
                    return false;
                } catch (error) {
                    showToast('❌ Sign up failed: ' + error.message, 'error');
                    return false;
                }
            }

            async function signOut() {
                try {
                    const client = initSupabase();
                    if (client) {
                        await client.auth.signOut();
                    }
                } catch (e) {}
                currentUser = null;
                isAuthenticated = false;
                accessToken = null;
                isAdmin = false;
                adminLinkContainer.style.display = 'none';
                localStorage.removeItem('auto_d_user');
                localStorage.removeItem('access_token');
                renderAuthUI();
                showToast('👋 Signed out', 'info');
                await loadDashboard();
                stopPricePolling();
            }

            // ─── RENDER AUTH UI ──────────────────────────────────────
            function renderAuthUI() {
                if (isAuthenticated && currentUser) {
                    let name = 'User';
                    try {
                        name = currentUser.user_metadata?.full_name || 
                               (currentUser.email ? currentUser.email.split('@')[0] : 'User') || 
                               'User';
                    } catch (e) {
                        name = 'User';
                    }
                    
                    const adminBadge = isAdmin ? ' <span style="color:var(--purple);font-size:10px;font-weight:600;">(Admin)</span>' : '';
                    authSection.innerHTML = `
                        <div class="user-info">
                            <div class="user-avatar">${name[0].toUpperCase()}</div>
                            <div>
                                <div class="user-name">${name}${adminBadge}</div>
                                <div class="user-email">${currentUser.email || 'No email'}</div>
                            </div>
                            <button class="btn btn-sm btn-danger" onclick="window.__auth.signOut()">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    `;
                } else {
                    authSection.innerHTML = `
                        <input type="email" id="loginEmail" placeholder="Email" style="min-width:180px;" />
                        <input type="password" id="loginPassword" placeholder="Password" style="min-width:140px;" />
                        <button class="btn btn-primary" onclick="window.__auth.signIn()">
                            <i class="fas fa-sign-in-alt"></i> Sign In
                        </button>
                        <button class="btn btn-outline" onclick="window.__auth.showSignUp()">
                            <i class="fas fa-user-plus"></i> Sign Up
                        </button>
                    `;
                }
            }

            // ─── GLOBAL AUTH FUNCTIONS ──────────────────────────────
            window.__auth = {
                signIn: async function() {
                    const email = document.getElementById('loginEmail')?.value.trim();
                    const password = document.getElementById('loginPassword')?.value.trim();
                    if (!email || !password) {
                        showToast('Please enter email and password', 'error');
                        return;
                    }
                    await signIn(email, password);
                },
                signOut: signOut,
                showSignUp: function() {
                    const email = document.getElementById('loginEmail')?.value.trim();
                    const password = document.getElementById('loginPassword')?.value.trim();
                    if (!email || !password) {
                        showToast('Please enter email and password to sign up', 'error');
                        return;
                    }
                    if (password.length < 6) {
                        showToast('Password must be at least 6 characters', 'error');
                        return;
                    }
                    signUp(email, password);
                }
            };

            // ─── GET SERVICE PRICES FROM SUPABASE ──────────────────────
            async function getServicePrices() {
                try {
                    const result = await querySupabase('service_prices', '*', {}, { column: 'created_at', ascending: false });
                    if (!result.success) throw new Error(result.error);
                    
                    // Get the latest price for each service
                    const latest = {};
                    result.data.forEach(item => {
                        if (!latest[item.service_type] || new Date(item.created_at) > new Date(latest[item.service_type].created_at)) {
                            latest[item.service_type] = item;
                        }
                    });
                    
                    return { success: true, data: latest };
                } catch (error) {
                    console.error('❌ Get service prices error:', error);
                    return { success: false, error: error.message };
                }
            }

            // ─── GET USER SERVICES FROM SUPABASE ──────────────────────
            async function getUserServices() {
                try {
                    // Check if user has access to services
                    // This could be stored in a user_services table
                    // For now, we'll assume all services are locked unless paid for
                    const result = await querySupabase('user_services', '*', { user_id: currentUser?.id });
                    if (result.success) {
                        const services = {};
                        result.data.forEach(item => {
                            services[item.service_type] = true;
                        });
                        return services;
                    }
                    return {};
                } catch (error) {
                    console.warn('Failed to get user services:', error);
                    return {};
                }
            }

            // ─── LOAD SERVICE PRICES ──────────────────────────────────
            async function loadServicePrices(silent = false) {
                try {
                    console.log('🔄 Loading service prices from Supabase...');
                    const result = await getServicePrices();
                    
                    if (result.success && result.data) {
                        const services = result.data;
                        const prices = {};
                        let hasPrices = false;
                        
                        Object.keys(services).forEach(key => {
                            const service = services[key];
                            const price = typeof service.price === 'number' && service.price > 0
                                ? service.price
                                : null;
                            if (price !== null) {
                                prices[key] = price;
                                hasPrices = true;
                                console.log(`✅ Service ${key}: KES ${price}`);
                            }
                        });
                        
                        servicePrices = prices;
                        lastPriceUpdate = new Date();
                        if (priceUpdateTime) {
                            priceUpdateTime.textContent = new Date().toLocaleTimeString();
                        }
                        updateConnectionStatus(true);
                        
                        if (!silent && hasPrices) {
                            showToast('✅ Prices loaded from admin', 'success');
                        } else if (!silent && !hasPrices) {
                            showToast('⚠️ No services found. Please contact admin.', 'warning');
                        }
                        
                        return servicePrices;
                    } else {
                        throw new Error(result.error || 'No data returned');
                    }
                } catch (error) {
                    console.error('❌ Failed to load service prices:', error);
                    updateConnectionStatus(false);
                    if (!silent) {
                        showToast(`⚠️ Could not load prices: ${error.message}`, 'warning');
                    }
                    return servicePrices;
                }
            }

            // ─── SWITCH SERVICE TAB ──────────────────────────────────
            window.switchServiceTab = function(serviceCode) {
                activeTab = serviceCode;
                
                document.querySelectorAll('.service-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.service === serviceCode);
                });
                
                updateTabBadges();
                renderServicesForTab(serviceCode);
            };

            function updateTabBadges() {
                const tabs = ['valuation', 'mileage', 'ownership'];
                tabs.forEach(code => {
                    const badge = document.getElementById(`badge-${code}`);
                    if (badge) {
                        const hasAccess = serviceAccess[code] === true;
                        badge.textContent = hasAccess ? '✅' : '🔒';
                        badge.className = `tab-badge ${hasAccess ? 'unlocked' : 'locked'}`;
                    }
                });
            }

            // ─── VALIDATE PHONE ────────────────────────────────────────
            function validatePhone(phone) {
                const cleanPhone = phone.replace(/\s/g, '');
                return /^2547\d{8}$/.test(cleanPhone);
            }

            // ─── RENDER SERVICES FOR TAB ──────────────────────────────
            function renderServicesForTab(serviceCode) {
                const serviceDetails = {
                    'valuation': {
                        name: 'Vehicle Valuation',
                        icon: '💰',
                        description: 'Get instant market value for your vehicle'
                    },
                    'mileage': {
                        name: 'Mileage & Running Cost',
                        icon: '📈',
                        description: 'Calculate running costs per kilometer'
                    },
                    'ownership': {
                        name: 'Cost of Ownership',
                        icon: '📊',
                        description: 'Total cost of ownership analysis'
                    }
                };

                const service = serviceDetails[serviceCode];
                if (!service) return;

                const hasAccess = serviceAccess[serviceCode] === true;
                const price = servicePrices[serviceCode];
                const priceKnown = typeof price === 'number' && price > 0;

                const priceBlock = priceKnown
                    ? `<div class="service-price" id="price-${serviceCode}">KES ${price.toLocaleString()}</div>`
                    : `<div class="service-price unavailable" id="price-${serviceCode}">
                           <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
                               <span>Price unavailable</span>
                               <button class="btn btn-xs btn-outline" onclick="window.__AUTOD?.refreshPrices()" style="font-size:9px;padding:2px 8px;">
                                   <i class="fas fa-sync-alt"></i> Refresh
                               </button>
                           </span>
                       </div>`;

                const priceSourceBlock = priceKnown
                    ? `<span class="price-source">
                           Price: <strong>KES ${price.toLocaleString()}</strong>
                           <span class="admin-badge">📋 Admin Set</span>
                       </span>`
                    : `<span class="price-source">
                           <span>Price not available</span>
                           <span class="unavailable-badge">⏳ Pending</span>
                       </span>`;

                const actionBlock = hasAccess
                    ? `<button class="btn btn-success btn-sm" onclick="window.openService('${serviceCode}')">
                           <i class="fas fa-external-link-alt"></i> Open Report
                       </button>`
                    : priceKnown
                        ? `<button class="btn btn-primary btn-sm" onclick="window.selectService('${serviceCode}', '${service.name}')">
                               <i class="fas fa-shopping-cart"></i> Pay to Unlock
                           </button>`
                        : `<button class="btn btn-primary btn-sm" disabled>
                               <i class="fas fa-ban"></i> Unavailable
                           </button>`;

                servicesEl.innerHTML = `
                    <div class="service-item" id="service-item-${serviceCode}">
                        <div class="service-info">
                            <div class="service-name">${service.icon} ${service.name}</div>
                            <div class="service-desc">${service.description}</div>
                            <div class="service-status ${hasAccess ? 'unlocked' : 'locked'}">
                                ${hasAccess ? '✅ Unlocked' : '🔒 Locked'}
                            </div>
                            ${priceSourceBlock}
                        </div>
                        <div class="service-actions">
                            ${priceBlock}
                            ${actionBlock}
                        </div>
                    </div>
                `;
            }

            // ─── REFRESH PRICES ──────────────────────────────────────
            window.refreshPrices = async function() {
                showToast('🔄 Refreshing prices from admin...', 'info');
                await loadServicePrices(false);
                renderServicesForTab(activeTab);
                showToast('✅ Prices refreshed', 'success');
            };

            // ─── PRICE POLLING ─────────────────────────────────────────
            function startPricePolling() {
                stopPricePolling();
                
                pricePollingTimer = setInterval(async () => {
                    if (isAuthenticated) {
                        console.log('🔄 Polling for price updates...');
                        await loadServicePrices(true);
                    }
                }, PRICE_POLLING_INTERVAL);
                
                console.log('✅ Price polling started');
            }

            function stopPricePolling() {
                if (pricePollingTimer) {
                    clearInterval(pricePollingTimer);
                    pricePollingTimer = null;
                }
            }

            // ─── LOAD USER SERVICES ────────────────────────────────────
            async function loadUserServices() {
                try {
                    servicesEl.innerHTML = `<span class="loading"><span class="spinner"></span> Loading your services...</span>`;
                    
                    await loadServicePrices();
                    
                    // Try to get user services from Supabase
                    if (isAuthenticated && currentUser) {
                        const services = await getUserServices();
                        serviceAccess = services;
                    } else {
                        serviceAccess = {};
                    }
                    
                    updateTabBadges();
                    renderServicesForTab(activeTab);
                    startPricePolling();
                    
                    return serviceAccess;
                } catch (error) {
                    servicesEl.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">⚠️</div>
                            <div class="empty-title">Failed to load services</div>
                            <div class="empty-desc">${error.message}</div>
                            <button class="btn btn-primary btn-sm" onclick="window.__AUTOD?.refreshPrices()" style="margin-top:12px;">
                                <i class="fas fa-sync-alt"></i> Retry
                            </button>
                        </div>
                    `;
                    showToast('Failed to load services', 'error');
                    return {};
                }
            }

            // ─── OPEN SERVICE ──────────────────────────────────────────
            window.openService = async function(serviceCode) {
                if (!isAuthenticated) {
                    showToast('⚠️ Please sign in to access services', 'warning');
                    return;
                }

                // Check if user has access
                const hasAccess = serviceAccess[serviceCode] === true;
                
                if (!hasAccess) {
                    showToast('🔒 Please pay to unlock this service', 'warning');
                    const service = {
                        'valuation': { name: 'Vehicle Valuation' },
                        'mileage': { name: 'Mileage & Running Cost' },
                        'ownership': { name: 'Cost of Ownership' }
                    }[serviceCode];
                    if (service) {
                        window.selectService(serviceCode, service.name);
                    }
                    return;
                }

                const routes = {
                    'valuation': '/instant-value.html',
                    'mileage': '/mileage.html',
                    'ownership': '/ownership-cost.html'
                };
                
                const route = routes[serviceCode];
                if (route) {
                    const names = {
                        'valuation': 'Vehicle Valuation',
                        'mileage': 'Mileage & Running Cost',
                        'ownership': 'Cost of Ownership'
                    };
                    showToast(`🚀 Opening ${names[serviceCode] || serviceCode}...`, 'success');
                    setTimeout(() => {
                        window.location.href = route;
                    }, 500);
                } else {
                    showToast(`Service ${serviceCode} not available`, 'error');
                }
            };

            // ─── SELECT SERVICE ──────────────────────────────────────
            window.selectService = function(code, name) {
                const price = servicePrices[code];
                if (typeof price !== 'number' || price <= 0) {
                    showToast('⚠️ Price unavailable. Click Refresh to update.', 'warning');
                    return;
                }

                selectedService = code;
                selectedServiceName = name;
                selectedServicePrice = price;
                paymentCompleted = false;

                payBtn.disabled = false;
                payBtn.innerHTML = `<i class="fas fa-mobile-alt"></i> Pay KES ${selectedServicePrice.toLocaleString()} for ${selectedServiceName}`;

                setStatus(`✅ Selected: ${selectedServiceName} (KES ${selectedServicePrice.toLocaleString()})`, 'success');
                showToast(`✅ Selected ${selectedServiceName} for KES ${selectedServicePrice.toLocaleString()}`, 'success');
            };

            // ─── API HELPER FOR M-PESA ──────────────────────────────────
            async function api(path, options = {}) {
                const token = accessToken || localStorage.getItem('access_token');

                const headers = {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    ...(options.headers || {})
                };

                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const url = API_BASE + path;

                try {
                    const response = await fetch(url, {
                        ...options,
                        headers,
                        credentials: 'include'
                    });

                    if (response.status === 401 && token) {
                        try {
                            const client = initSupabase();
                            if (client) {
                                const { data: { session }, error } = await client.auth.refreshSession();
                                if (!error && session?.access_token) {
                                    accessToken = session.access_token;
                                    localStorage.setItem('access_token', accessToken);
                                    headers['Authorization'] = `Bearer ${accessToken}`;
                                    const retryResponse = await fetch(url, {
                                        ...options,
                                        headers,
                                        credentials: 'include'
                                    });
                                    if (retryResponse.ok) {
                                        return retryResponse.json();
                                    }
                                }
                            }
                        } catch (e) {}
                    }

                    if (!response.ok) {
                        let errorMessage;
                        try {
                            const errorData = await response.json();
                            errorMessage = errorData.message || errorData.error || `HTTP ${response.status}`;
                        } catch {
                            errorMessage = `HTTP ${response.status}: ${response.statusText}`;
                        }
                        throw new Error(errorMessage);
                    }

                    const text = await response.text();
                    if (!text) return { status: 'ok' };
                    try {
                        return JSON.parse(text);
                    } catch {
                        return { status: 'ok', raw: text };
                    }
                } catch (error) {
                    console.error('API Error:', error);
                    throw error;
                }
            }

            // ─── LOAD PAYMENTS ──────────────────────────────────────────
            async function loadPayments() {
                try {
                    paymentsEl.innerHTML = `<span class="loading"><span class="spinner"></span> Loading payments...</span>`;
                    const data = await api('/mpesa/payments');
                    renderPayments(data || []);
                } catch (error) {
                    if (error.message.includes('401') || error.message.includes('403')) {
                        paymentsEl.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">🔐</div>
                                <div class="empty-title">Sign in to view history</div>
                                <div class="empty-desc">Your payment history will appear here after you sign in</div>
                            </div>
                        `;
                    } else {
                        paymentsEl.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">⚠️</div>
                                <div class="empty-title">Failed to load payments</div>
                                <div class="empty-desc">${error.message}</div>
                            </div>
                        `;
                    }
                }
            }

            function renderPayments(payments) {
                if (!payments || !payments.length) {
                    paymentsEl.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-title">No payments yet</div>
                            <div class="empty-desc">Your payment history will appear here</div>
                        </div>
                    `;
                    return;
                }

                paymentsEl.innerHTML = `
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Service</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${payments.map(p => `
                                    <tr>
                                        <td>${p.service_name || '-'}</td>
                                        <td><strong>${p.currency || 'KES'} ${Number(p.amount || 0).toLocaleString()}</strong></td>
                                        <td><span class="status-badge ${p.status || 'pending'}">${p.status || 'pending'}</span></td>
                                        <td style="font-size:13px;color:var(--text-muted);">${p.created_at ? new Date(p.created_at).toLocaleString() : '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            // ─── START PAYMENT ──────────────────────────────────────────
            async function startPayment() {
                if (!selectedService) {
                    showToast('Please select a service first', 'error');
                    return;
                }

                if (typeof selectedServicePrice !== 'number' || selectedServicePrice <= 0) {
                    showToast('⚠️ Price unavailable. Please refresh.', 'error');
                    return;
                }

                if (!isAuthenticated) {
                    showToast('⚠️ Please sign in to make a payment', 'warning');
                    return;
                }

                const phone = phoneInput.value.trim();
                if (!validatePhone(phone)) {
                    showToast('Please enter a valid phone number (format: 2547XXXXXXXX)', 'error');
                    return;
                }

                payBtn.disabled = true;
                payBtn.innerHTML = '<span class="spinner" style="display:inline-block;width:18px;height:18px;border:2px solid rgba(0,0,0,0.1);border-top-color:#0a0c15;border-radius:50%;animation:spin 0.8s linear infinite;"></span> Sending...';

                try {
                    setStatus('📱 Initiating STK Push...', 'pending');

                    const payload = {
                        phone: phone,
                        service_id: selectedService,
                        description: selectedServiceName || selectedService,
                        request_id: null,
                        amount: selectedServicePrice
                    };

                    console.log('📤 STK Push Payload:', payload);

                    const result = await api('/mpesa/stkpush', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    checkoutRequestId = result.checkout_request_id || result.CheckoutRequestID;

                    setStatus(
                        `📱 STK Push sent!\n` +
                        `Checkout ID: ${checkoutRequestId}\n` +
                        `Please complete the payment on your phone.`,
                        'pending'
                    );

                    showToast('📱 STK Push sent! Check your phone.', 'info');

                    localStorage.setItem('pending_checkout', checkoutRequestId);
                    localStorage.setItem('pending_service', selectedService);
                    localStorage.setItem('pending_service_name', selectedServiceName);

                    startStatusPolling();

                } catch (error) {
                    setStatus(`❌ Payment initiation failed:\n${error.message}`, 'error');
                    showToast('Payment initiation failed: ' + error.message, 'error');
                } finally {
                    payBtn.disabled = false;
                    payBtn.innerHTML = `<i class="fas fa-mobile-alt"></i> Pay KES ${selectedServicePrice.toLocaleString()} for ${selectedServiceName}`;
                }
            }

            // ─── POLL PAYMENT STATUS ──────────────────────────────────
            function startStatusPolling() {
                if (statusTimer) {
                    clearInterval(statusTimer);
                }
                statusTimer = setInterval(checkPaymentStatus, 5000);
                setTimeout(checkPaymentStatus, 1000);
            }

            async function checkPaymentStatus() {
                if (!checkoutRequestId) return;
                if (paymentCompleted) {
                    clearInterval(statusTimer);
                    statusTimer = null;
                    return;
                }

                try {
                    console.log(`📡 Checking payment status: ${checkoutRequestId}`);
                    const status = await api(`/mpesa/status/${checkoutRequestId}`);

                    console.log('📥 Payment Status Response:', status);

                    if (status.status === 'completed' || status.status === 'paid' || status.status === 'success') {
                        setStatus(
                            `✅ Payment completed successfully!\n` +
                            `Receipt: ${status.mpesa_receipt || status.transaction_id || 'N/A'}`,
                            'success'
                        );

                        clearInterval(statusTimer);
                        statusTimer = null;
                        localStorage.removeItem('pending_checkout');

                        if (!paymentCompleted) {
                            paymentCompleted = true;
                            showToast('✅ Payment completed! Service unlocked.', 'success');
                            await loadPayments();

                            const serviceCode = localStorage.getItem('pending_service') || selectedService;
                            const serviceName = localStorage.getItem('pending_service_name') || selectedServiceName;
                            
                            localStorage.removeItem('pending_service');
                            localStorage.removeItem('pending_service_name');

                            try {
                                await api(`/mpesa/confirm/${checkoutRequestId}`, {
                                    method: 'POST'
                                });
                            } catch (confirmErr) {
                                console.warn('Confirm API warning:', confirmErr);
                            }

                            // Add to user services in Supabase
                            try {
                                const client = initSupabase();
                                if (client && currentUser) {
                                    await client
                                        .from('user_services')
                                        .upsert({
                                            user_id: currentUser.id,
                                            service_type: serviceCode,
                                            paid_at: new Date().toISOString()
                                        }, { onConflict: 'user_id,service_type' });
                                    console.log('✅ Service added to user_services');
                                }
                            } catch (dbErr) {
                                console.warn('Could not save to user_services:', dbErr);
                            }

                            await loadUserServices();
                            showToast(`✅ ${serviceName} unlocked! You can now access it.`, 'success');
                        }

                    } else if (status.status === 'failed' || status.status === 'cancelled') {
                        setStatus(`❌ Payment failed.\n${status.result_desc || status.message || 'Transaction declined'}`, 'error');

                        clearInterval(statusTimer);
                        statusTimer = null;
                        localStorage.removeItem('pending_checkout');
                        localStorage.removeItem('pending_service');
                        localStorage.removeItem('pending_service_name');
                        showToast('❌ Payment failed', 'error');
                        await loadPayments();

                    } else {
                        setStatus(
                            `⏳ Waiting for confirmation...\n` +
                            `Checkout ID: ${checkoutRequestId}\n` +
                            `Please check your phone for the STK prompt.`,
                            'pending'
                        );
                    }

                } catch (error) {
                    console.warn('Status check error:', error);
                }
            }

            // ─── LOAD DASHBOARD ──────────────────────────────────────────
            async function loadDashboard() {
                await loadUserServices();
                await loadPayments();

                if (!isAuthenticated) {
                    setStatus('🔐 Sign in to make payments and view your history.', 'info');
                } else {
                    setStatus('✅ Dashboard ready. Select a service to continue.', 'success');
                }
            }

            // ─── EVENT LISTENERS ──────────────────────────────────────
            payBtn.addEventListener('click', startPayment);

            phoneInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!payBtn.disabled) {
                        startPayment();
                    }
                }
            });

            // ─── INIT ──────────────────────────────────────────────────
            async function init() {
                console.log('🚗 Auto-D Kenya User Dashboard v3.0 (Supabase)');
                console.log('📡 Supabase:', SUPABASE_URL);

                initSupabase();
                await getCurrentUser();
                renderAuthUI();

                if (supabaseClient) {
                    supabaseClient.auth.onAuthStateChange(async (event, session) => {
                        if (session) {
                            currentUser = session.user;
                            isAuthenticated = true;
                            accessToken = session.access_token;
                            localStorage.setItem('auto_d_user', JSON.stringify(currentUser));
                            localStorage.setItem('access_token', accessToken);
                            renderAuthUI();
                            await loadDashboard();
                        } else if (event === 'SIGNED_OUT') {
                            currentUser = null;
                            isAuthenticated = false;
                            accessToken = null;
                            isAdmin = false;
                            adminLinkContainer.style.display = 'none';
                            localStorage.removeItem('auto_d_user');
                            localStorage.removeItem('access_token');
                            renderAuthUI();
                            await loadDashboard();
                            stopPricePolling();
                        }
                    });
                }

                await loadDashboard();

                const pendingCheckout = localStorage.getItem('pending_checkout');
                const pendingService = localStorage.getItem('pending_service');
                if (pendingCheckout && pendingService) {
                    checkoutRequestId = pendingCheckout;
                    selectedService = pendingService;
                    selectedServiceName = localStorage.getItem('pending_service_name') || pendingService;
                    setStatus(`⏳ Resuming pending payment...\nCheckout ID: ${checkoutRequestId}`, 'pending');
                    startStatusPolling();
                }
            }

            // ─── EXPOSE GLOBAL FUNCTIONS ────────────────────────────────
            window.__AUTOD = {
                refreshPrices: window.refreshPrices,
                loadPayments: loadPayments,
                switchServiceTab: window.switchServiceTab,
                selectService: window.selectService,
                openService: window.openService,
                getState: () => ({
                    isAuthenticated,
                    isAdmin,
                    selectedService,
                    servicePrices: { ...servicePrices },
                    serviceAccess: { ...serviceAccess }
                })
            };

            // ─── EXPOSE FOR GLOBAL ACCESS ───────────────────────────────
            window.switchServiceTab = window.switchServiceTab;
            window.selectService = window.selectService;
            window.openService = window.openService;
            window.refreshPrices = window.refreshPrices;

            // ─── START ──────────────────────────────────────────────────
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
