<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Auto-D Kenya | Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --amber: #eab308;
            --amber-dark: #ca8a04;
            --green: #22c55e;
            --blue: #3b82f6;
            --red: #ef4444;
            --purple: #a855f7;
            --cyan: #06b6d4;
            --bg: #0a0c15;
            --bg-panel: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 12px;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(234, 179, 8, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(234, 179, 8, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }
        .bg-grid::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 32px 60px;
        }

        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover { border-color: rgba(234, 179, 8, 0.15); }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card-title {
            font-family: var(--font-heading);
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title .highlight { color: var(--amber); }
        .card-title .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(234, 179, 8, 0.15);
            color: var(--amber);
            font-family: var(--font-mono);
            letter-spacing: 0.04em;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }
        .header .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .header .logo .logo-icon { font-size: 36px; }
        .header .logo .logo-text {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .header .logo .logo-text span { color: var(--amber); }
        .header .logo .logo-sub { font-size: 12px; color: var(--text-muted); display: block; margin-top: -2px; }

        .auth-section { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .auth-section input {
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font-body);
            min-width: 160px;
            transition: var(--transition);
        }
        .auth-section input:focus { outline: none; border-color: var(--amber); }
        .auth-section input::placeholder { color: var(--text-muted); }

        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--amber), var(--amber-dark));
            color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            font-family: var(--font-heading);
        }
        .user-name { font-weight: 600; font-size: 14px; }
        .user-email { font-size: 12px; color: var(--text-muted); }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            font-family: var(--font-body);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn-primary { background: linear-gradient(135deg, var(--amber), var(--amber-dark)); color: var(--bg); }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(234, 179, 8, 0.3); }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-outline:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
        .btn-success { background: var(--green); color: var(--bg); }
        .btn-success:hover:not(:disabled) { opacity: 0.85; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn-xs { padding: 4px 10px; font-size: 11px; }

        .admin-btn {
            background: linear-gradient(135deg, var(--purple), #7c3aed);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 13px;
            font-family: var(--font-body);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(168, 85, 247, 0.3); }

        .service-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }
        .service-tab {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .service-tab:hover { color: var(--text-secondary); background: rgba(255,255,255,0.03); }
        .service-tab.active { background: var(--amber); color: var(--bg); }
        .service-tab .tab-icon { margin-right: 6px; }
        .service-tab .tab-badge {
            display: inline-block;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            margin-left: 4px;
        }
        .service-tab.active .tab-badge { background: rgba(0,0,0,0.15); }
        .service-tab .tab-badge.unlocked { background: rgba(34, 197, 94, 0.2); color: var(--green); }
        .service-tab .tab-badge.locked { background: rgba(234, 179, 8, 0.2); color: var(--amber); }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .service-item:last-child { margin-bottom: 0; }
        .service-item:hover { border-color: rgba(234, 179, 8, 0.2); }
        .service-item .service-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .service-item .service-name { font-weight: 600; font-size: 15px; color: var(--text-primary); }
        .service-item .service-desc { font-size: 13px; color: var(--text-muted); }
        .service-item .service-status { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; }
        .service-item .service-status.unlocked { background: rgba(34, 197, 94, 0.15); color: var(--green); }
        .service-item .service-status.locked { background: rgba(234, 179, 8, 0.15); color: var(--amber); }
        .service-item .service-price { font-family: var(--font-heading); font-size: 18px; font-weight: 700; color: var(--amber); }
        .service-item .service-price.unavailable {
            color: var(--text-muted);
            font-size: 13px;
            font-family: var(--font-body);
            font-weight: 600;
        }
        .service-item .service-actions { display: flex; align-items: center; gap: 12px; }

        .price-source { font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); display: block; margin-top: 2px; }
        .price-source .admin-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: var(--blue);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 8px;
            margin-left: 4px;
        }
        .price-source .live-badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: var(--green);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 8px;
            margin-left: 4px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .price-source .unavailable-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.15);
            color: var(--red);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 8px;
            margin-left: 4px;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .payment-form .form-group { margin-bottom: 16px; }
        .payment-form label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
        .payment-form input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font-body);
            transition: var(--transition);
        }
        .payment-form input:focus { outline: none; border-color: var(--amber); }
        .payment-form input::placeholder { color: var(--text-muted); }

        .status-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            min-height: 80px;
            white-space: pre-line;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }
        .status-box .status-success { color: var(--green); }
        .status-box .status-pending { color: var(--amber); }
        .status-box .status-error { color: var(--red); }
        .status-box .status-info { color: var(--blue); }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
        td { color: var(--text-secondary); }
        tr:last-child td { border-bottom: none; }

        .status-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-badge.pending { background: rgba(234, 179, 8, 0.15); color: var(--amber); }
        .status-badge.completed { background: rgba(34, 197, 94, 0.15); color: var(--green); }
        .status-badge.paid { background: rgba(34, 197, 94, 0.15); color: var(--green); }
        .status-badge.failed { background: rgba(239, 68, 68, 0.15); color: var(--red); }
        .status-badge.cancelled { background: rgba(239, 68, 68, 0.15); color: var(--red); }

        .loading { color: var(--text-muted); font-style: italic; display: flex; align-items: center; gap: 10px; }
        .loading .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(234, 179, 8, 0.2);
            border-top-color: var(--amber);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 400px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            animation: slideIn 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .toast-success { background: var(--green); color: var(--bg); }
        .toast-error { background: var(--red); color: #fff; }
        .toast-info { background: var(--blue); color: #fff; }
        .toast-warning { background: var(--amber); color: var(--bg); }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }

        .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state .empty-title { font-size: 18px; font-weight: 600; color: var(--text-secondary); }
        .empty-state .empty-desc { font-size: 14px; margin-top: 4px; }

        .price-updated { animation: priceFlash 0.6s ease; }
        @keyframes priceFlash { 0%, 100% { background-color: transparent; } 50% { background-color: rgba(234, 179, 8, 0.2); } }

        .admin-link-container { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        #priceStatus { margin-right: 4px; }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .card { padding: 18px 20px; }
            .header { flex-direction: column; align-items: flex-start; }
            .auth-section { width: 100%; flex-direction: column; }
            .auth-section input { width: 100%; min-width: unset; }
            .service-item { flex-direction: column; align-items: stretch; gap: 8px; }
            .service-item .service-actions { justify-content: space-between; }
            .user-info { width: 100%; justify-content: space-between; }
            .card-title { font-size: 17px; }
            th, td { padding: 8px 10px; font-size: 13px; }
            .service-tabs { flex-wrap: nowrap; }
            .service-tab { font-size: 12px; padding: 6px 12px; }
            .admin-link-container { justify-content: center; }
        }

        @media (max-width: 480px) {
            .container { padding: 12px; }
            .card { padding: 14px 16px; }
            .card-title { font-size: 16px; }
            .service-item .service-price { font-size: 16px; }
            .btn { font-size: 13px; padding: 8px 16px; }
            .service-tab { font-size: 11px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<div class="container">

    <header class="header">
        <a href="/" class="logo">
            <span class="logo-icon">🚗</span>
            <div>
                <span class="logo-text">Auto-D <span>Kenya</span></span>
                <span class="logo-sub">Vehicle Intelligence Platform</span>
            </div>
        </a>
        <div class="auth-section" id="authSection">
            <span class="loading"><span class="spinner"></span> Checking session...</span>
        </div>
    </header>

    <div class="admin-link-container" id="adminLinkContainer" style="display:none;">
        <a href="/admin.html" class="admin-btn" target="_blank">
            <i class="fas fa-cog"></i> Admin Dashboard
            <span class="badge" style="background:rgba(255,255,255,0.15);font-size:8px;padding:1px 6px;border-radius:4px;">Manage Prices</span>
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">
                🚀 Your Services
                <span class="badge">Access</span>
                <span class="badge" style="background:rgba(34,197,94,0.15);color:var(--green);">Live Prices</span>
                <span class="badge" style="background:rgba(168,85,247,0.15);color:var(--purple);font-size:8px;" id="priceConnectionStatus">🔄 Connected</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <span style="font-size:11px;color:var(--text-muted);" id="priceLastUpdated">
                    Last updated: <span id="priceUpdateTime">—</span>
                </span>
                <button class="btn btn-sm btn-outline" id="refreshPricesBtn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <div class="service-tabs" id="serviceTabs">
            <button class="service-tab active" data-service="valuation">
                <span class="tab-icon">💰</span> Valuation
                <span class="tab-badge locked" id="badge-valuation">🔒</span>
            </button>
            <button class="service-tab" data-service="mileage">
                <span class="tab-icon">📈</span> Mileage
                <span class="tab-badge locked" id="badge-mileage">🔒</span>
            </button>
            <button class="service-tab" data-service="ownership">
                <span class="tab-icon">📊</span> Ownership
                <span class="tab-badge locked" id="badge-ownership">🔒</span>
            </button>
        </div>

        <div id="servicesContainer">
            <div id="services"><span class="loading"><span class="spinner"></span> Loading your services...</span></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">📱 M-Pesa Payment <span class="badge">Secure</span></div>
        </div>

        <div class="payment-form">
            <div class="form-group">
                <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                <input id="phone" type="tel" placeholder="2547XXXXXXXX" autocomplete="tel" />
            </div>

            <button id="payBtn" class="btn btn-primary" disabled style="width:100%;justify-content:center;font-size:16px;padding:14px;">
                <i class="fas fa-lock"></i> Select a service first
            </button>

            <div style="margin-top:16px;">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
                    <strong style="font-size:13px;color:var(--text-muted);">📊 Payment Status</strong>
                </div>
                <div class="status-box" id="statusBox">Waiting for payment...</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">📜 Payment History <span class="badge">Recent</span></div>
            <button class="btn btn-sm btn-outline" id="refreshPaymentsBtn">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
        <div id="payments"><span class="loading"><span class="spinner"></span> Loading payments...</span></div>
    </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// AUTO-D KENYA DASHBOARD
//
// Trust model:
//  - Supabase handles auth (sessions, tokens) and pushes realtime
//    price updates for UI responsiveness only.
//  - The backend API (auto-digital.onrender.com) is the sole source
//    of truth for service access and payments. Every unlock/action
//    is re-verified server-side — nothing here is trusted client-side.
// ═══════════════════════════════════════════════════════════════

(function () {
    'use strict';

    // ─────────────────────────────────────────────────────────
    // CONFIG
    // ─────────────────────────────────────────────────────────
    const CONFIG = {
        API_BASE: 'https://auto-digital.onrender.com/api/v1',
        SUPABASE_URL: 'https://xgkdbithhlvoqjnqvfmj.supabase.co',
        SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhna2RiaXRoaGx2b3FqbnF2Zm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NTE4NzQsImV4cCI6MjA5ODIyNzg3NH0.-4P2aQAlDl_4oW0C18gh7cEBzoIKeiLUmMnITz-Nt9Y',
        PRICE_POLLING_INTERVAL_MS: 30000,
        STATUS_POLLING_INTERVAL_MS: 5000,
        SERVICE_ROUTES: {
            valuation: '/instant-value.html',
            mileage: '/mileage.html',
            ownership: '/ownership-cost.html'
        },
        SERVICE_DETAILS: {
            valuation: { name: 'Vehicle Valuation', icon: '💰', description: 'Get instant market value for your vehicle' },
            mileage: { name: 'Mileage & Running Cost', icon: '📈', description: 'Calculate running costs per kilometer' },
            ownership: { name: 'Cost of Ownership', icon: '📊', description: 'Total cost of ownership analysis' }
        }
    };

    // ─────────────────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────────────────
    const state = {
        supabaseClient: null,
        currentUser: null,
        isAuthenticated: false,
        accessToken: null,
        isAdmin: false,

        activeTab: 'valuation',
        currentServices: [],       // raw list from backend
        servicePrices: {},         // { code: number }
        serviceAccess: {},         // { code: boolean } — UI display only, backend re-verifies on open

        selectedService: null,
        selectedServiceName: null,
        selectedServicePrice: null,

        checkoutRequestId: null,
        paymentCompleted: false,
        statusTimer: null,
        pricePollingTimer: null,
        lastPriceLoadFailed: false
    };

    // ─────────────────────────────────────────────────────────
    // DOM REFS
    // ─────────────────────────────────────────────────────────
    const dom = {
        services: document.getElementById('services'),
        payments: document.getElementById('payments'),
        statusBox: document.getElementById('statusBox'),
        phoneInput: document.getElementById('phone'),
        payBtn: document.getElementById('payBtn'),
        authSection: document.getElementById('authSection'),
        priceUpdateTime: document.getElementById('priceUpdateTime'),
        priceConnectionStatus: document.getElementById('priceConnectionStatus'),
        adminLinkContainer: document.getElementById('adminLinkContainer'),
        serviceTabs: document.getElementById('serviceTabs'),
        toastContainer: document.getElementById('toastContainer'),
        refreshPricesBtn: document.getElementById('refreshPricesBtn'),
        refreshPaymentsBtn: document.getElementById('refreshPaymentsBtn')
    };

    // ─────────────────────────────────────────────────────────
    // SUPABASE
    // ─────────────────────────────────────────────────────────
    function initSupabase() {
        if (typeof supabase === 'undefined') {
            console.warn('Supabase SDK not loaded');
            return null;
        }
        try {
            state.supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
                auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
            });
            return state.supabaseClient;
        } catch (err) {
            console.error('Supabase init error:', err);
            return null;
        }
    }

    function evaluateAdmin(user) {
        if (!user) return false;
        const um = user.user_metadata || {};
        const am = user.app_metadata || {};
        return am.role === 'admin' || am.is_admin === true || um.role === 'admin' || um.is_admin === true;
    }

    function applySession(session) {
        if (!session?.user) {
            state.currentUser = null;
            state.isAuthenticated = false;
            state.accessToken = null;
            state.isAdmin = false;
            return;
        }
        state.currentUser = session.user;
        state.isAuthenticated = true;
        state.accessToken = session.access_token;
        state.isAdmin = evaluateAdmin(session.user);
    }

    // NOTE: session state comes exclusively from Supabase's own session
    // store (which persists to localStorage internally via the SDK).
    // We never read a hand-rolled 'auto_d_user' cache — that would let a
    // stale/forged object survive an actual sign-out.
    async function loadSession() {
        if (!state.supabaseClient) initSupabase();
        if (!state.supabaseClient) return;
        const { data: { session } } = await state.supabaseClient.auth.getSession();
        applySession(session);
    }

    async function signIn(email, password) {
        if (!state.supabaseClient) initSupabase();
        try {
            const { data, error } = await state.supabaseClient.auth.signInWithPassword({
                email: email.toLowerCase().trim(),
                password
            });
            if (error) throw error;
            applySession(data.session);
            renderAuthUI();
            showToast('✅ Signed in successfully!', 'success');
            await loadDashboard();
        } catch (err) {
            showToast('❌ Sign in failed: ' + err.message, 'error');
        }
    }

    async function signUp(email, password) {
        if (!state.supabaseClient) initSupabase();
        try {
            const { data, error } = await state.supabaseClient.auth.signUp({
                email: email.toLowerCase().trim(),
                password,
                options: { data: { full_name: email.split('@')[0] } }
            });
            if (error) throw error;
            if (data.user) showToast('✅ Account created! Please check your email to confirm.', 'success');
        } catch (err) {
            showToast('❌ Sign up failed: ' + err.message, 'error');
        }
    }

    async function signOut() {
        try {
            if (state.supabaseClient) await state.supabaseClient.auth.signOut();
        } catch (e) { /* ignore */ }
        applySession(null);
        stopPricePolling();
        renderAuthUI();
        await loadDashboard();
        showToast('👋 Signed out', 'info');
    }

    // ─────────────────────────────────────────────────────────
    // AUTH UI
    // ─────────────────────────────────────────────────────────
    function renderAuthUI() {
        dom.adminLinkContainer.style.display = state.isAdmin ? 'block' : 'none';

        if (state.isAuthenticated && state.currentUser) {
            const name = state.currentUser.user_metadata?.full_name || state.currentUser.email?.split('@')[0] || 'User';
            const adminBadge = state.isAdmin
                ? ' <span style="color:var(--purple);font-size:10px;font-weight:600;">(Admin)</span>'
                : '';
            dom.authSection.innerHTML = `
                <div class="user-info">
                    <div class="user-avatar">${name[0].toUpperCase()}</div>
                    <div>
                        <div class="user-name">${escapeHtml(name)}${adminBadge}</div>
                        <div class="user-email">${escapeHtml(state.currentUser.email)}</div>
                    </div>
                    <button class="btn btn-sm btn-danger" id="signOutBtn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            `;
            document.getElementById('signOutBtn').addEventListener('click', signOut);
        } else {
            dom.authSection.innerHTML = `
                <input type="email" id="loginEmail" placeholder="Email" style="min-width:180px;" />
                <input type="password" id="loginPassword" placeholder="Password" style="min-width:140px;" />
                <button class="btn btn-primary" id="signInBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                <button class="btn btn-outline" id="signUpBtn"><i class="fas fa-user-plus"></i> Sign Up</button>
            `;
            document.getElementById('signInBtn').addEventListener('click', () => {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                if (!email || !password) return showToast('Please enter email and password', 'error');
                signIn(email, password);
            });
            document.getElementById('signUpBtn').addEventListener('click', () => {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                if (!email || !password) return showToast('Please enter email and password to sign up', 'error');
                if (password.length < 6) return showToast('Password must be at least 6 characters', 'error');
                signUp(email, password);
            });
            document.getElementById('loginPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('signInBtn').click();
            });
        }
    }

    // ─────────────────────────────────────────────────────────
    // BACKEND API
    // ─────────────────────────────────────────────────────────
    async function api(path, options = {}) {
        const headers = {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            ...(options.headers || {})
        };
        if (state.accessToken) headers['Authorization'] = `Bearer ${state.accessToken}`;

        const url = CONFIG.API_BASE + path;
        let response = await fetch(url, { ...options, headers, credentials: 'include' });

        // One retry after a token refresh on 401
        if (response.status === 401 && state.accessToken && state.supabaseClient) {
            try {
                const { data: { session }, error } = await state.supabaseClient.auth.refreshSession();
                if (!error && session?.access_token) {
                    state.accessToken = session.access_token;
                    headers['Authorization'] = `Bearer ${state.accessToken}`;
                    response = await fetch(url, { ...options, headers, credentials: 'include' });
                }
            } catch (e) { /* fall through to error handling below */ }
        }

        if (!response.ok) {
            let message;
            try {
                const errorData = await response.json();
                message = errorData.message || errorData.error || `HTTP ${response.status}`;
            } catch {
                message = `HTTP ${response.status}: ${response.statusText}`;
            }
            throw new Error(message);
        }

        const text = await response.text();
        if (!text) return { status: 'ok' };
        try { return JSON.parse(text); } catch { return { status: 'ok', raw: text }; }
    }

    // ─────────────────────────────────────────────────────────
    // TOAST / STATUS HELPERS
    // ─────────────────────────────────────────────────────────
    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        dom.toastContainer.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100px)';
            setTimeout(() => toast.remove(), 400);
        }, 4000);
    }

    function setStatus(message, type = 'info') {
        const typeMap = { success: 'status-success', pending: 'status-pending', error: 'status-error', info: 'status-info' };
        dom.statusBox.innerHTML = `<span class="${typeMap[type] || 'status-info'}">${escapeHtml(message)}</span>`;
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ─────────────────────────────────────────────────────────
    // SERVICES: DATA
    // ─────────────────────────────────────────────────────────
    async function checkServiceAccess(serviceCode) {
        try {
            const result = await api(`/mpesa/check-access/${serviceCode}`);
            return result.has_access === true;
        } catch (err) {
            console.warn('Access check failed:', err.message);
            return false;
        }
    }

    async function loadUserServiceAccess() {
        try {
            const data = await api('/mpesa/user/services');
            state.serviceAccess = data.services || {};
        } catch (err) {
            console.warn('Failed to get user services:', err.message);
            state.serviceAccess = {};
        }
    }

    async function loadServicePrices(silent = false) {
        try {
            if (!silent) updatePriceConnectionBadge('🔄 Syncing...', 'var(--amber)');

            const data = await api('/mpesa/services');
            state.currentServices = data.services || [];

            let changed = false;
            state.currentServices.forEach(service => {
                const price = typeof service.price === 'number' && service.price > 0 ? service.price : null;
                if (price === null) return;
                if (state.servicePrices[service.code] !== price) changed = true;
                state.servicePrices[service.code] = price;
            });

            state.lastPriceLoadFailed = false;
            updatePriceTimestamp();

            if (!silent) {
                updatePriceConnectionBadge('✅ Connected', 'var(--green)');
                if (changed) showToast('🔄 Service prices updated from admin', 'info');
            }
            if (changed) renderServicesForTab(state.activeTab);
        } catch (err) {
            state.lastPriceLoadFailed = true;
            console.warn('Failed to load service prices:', err.message);
            if (!silent) {
                updatePriceConnectionBadge('⚠️ Disconnected', 'var(--red)');
                showToast('⚠️ Could not load live prices — try refreshing', 'warning');
            }
        }
    }

    function updatePriceConnectionBadge(text, color) {
        dom.priceConnectionStatus.textContent = text;
        dom.priceConnectionStatus.style.color = color;
    }

    function updatePriceTimestamp() {
        dom.priceUpdateTime.textContent = new Date().toLocaleTimeString();
    }

    // ─────────────────────────────────────────────────────────
    // SERVICES: RENDER
    // ─────────────────────────────────────────────────────────
    function switchServiceTab(serviceCode) {
        state.activeTab = serviceCode;
        document.querySelectorAll('.service-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.service === serviceCode);
        });
        updateTabBadges();
        renderServicesForTab(serviceCode);
    }

    function updateTabBadges() {
        Object.keys(CONFIG.SERVICE_DETAILS).forEach(code => {
            const badge = document.getElementById(`badge-${code}`);
            if (!badge) return;
            const hasAccess = state.serviceAccess[code] === true;
            badge.textContent = hasAccess ? '✅' : '🔒';
            badge.className = `tab-badge ${hasAccess ? 'unlocked' : 'locked'}`;
        });
    }

    function renderServicesForTab(serviceCode) {
        const service = CONFIG.SERVICE_DETAILS[serviceCode];
        if (!service) return;

        const hasAccess = state.serviceAccess[serviceCode] === true;
        const price = state.servicePrices[serviceCode];
        const priceKnown = typeof price === 'number' && price > 0;

        const priceBlock = priceKnown
            ? `<div class="service-price" id="price-${serviceCode}">KES ${price.toLocaleString()}</div>`
            : `<div class="service-price unavailable" id="price-${serviceCode}">Price unavailable</div>`;

        const priceSourceBlock = priceKnown
            ? `<span class="price-source">Price: <strong>KES ${price.toLocaleString()}</strong><span class="admin-badge">📋 Admin Set</span></span>`
            : `<span class="price-source"><span>Price not set by admin yet</span><span class="unavailable-badge">${state.lastPriceLoadFailed ? '⚠️ Load failed' : '⏳ Pending'}</span></span>`;

        const actionBlock = hasAccess
            ? `<button class="btn btn-success btn-sm" data-action="open" data-code="${serviceCode}">
                   <i class="fas fa-external-link-alt"></i> Open Report
               </button>`
            : priceKnown
                ? `<button class="btn btn-primary btn-sm" data-action="select" data-code="${serviceCode}">
                       <i class="fas fa-shopping-cart"></i> Pay to Unlock
                   </button>`
                : `<button class="btn btn-primary btn-sm" disabled title="Price hasn't loaded from admin yet">
                       <i class="fas fa-ban"></i> Price unavailable
                   </button>`;

        dom.services.innerHTML = `
            <div class="service-item" id="service-item-${serviceCode}">
                <div class="service-info">
                    <div class="service-name">${service.icon} ${service.name}</div>
                    <div class="service-desc">${service.description}</div>
                    <div class="service-status ${hasAccess ? 'unlocked' : 'locked'}">${hasAccess ? '✅ Unlocked' : '🔒 Locked'}</div>
                    ${priceSourceBlock}
                </div>
                <div class="service-actions">${priceBlock}${actionBlock}</div>
            </div>
        `;
    }

    function flashPriceUpdate(serviceCode) {
        const el = document.getElementById(`service-item-${serviceCode}`);
        if (!el) return;
        el.classList.add('price-updated');
        setTimeout(() => el.classList.remove('price-updated'), 600);
    }

    async function loadUserServices() {
        dom.services.innerHTML = `<span class="loading"><span class="spinner"></span> Loading your services...</span>`;
        try {
            await loadServicePrices();
            await loadUserServiceAccess();
            updateTabBadges();
            renderServicesForTab(state.activeTab);
            startPricePolling();
        } catch (err) {
            dom.services.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-title">Failed to load services</div>
                    <div class="empty-desc">${escapeHtml(err.message)}</div>
                </div>
            `;
            showToast('Failed to load services', 'error');
        }
    }

    // ─────────────────────────────────────────────────────────
    // SERVICE ACTIONS
    // ─────────────────────────────────────────────────────────
    async function openService(serviceCode) {
        if (!state.isAuthenticated) return showToast('⚠️ Please sign in to access services', 'warning');

        // Always re-verify with the backend — never trust cached UI state.
        const hasAccess = await checkServiceAccess(serviceCode);
        if (!hasAccess) {
            showToast('🔒 Please pay to unlock this service', 'warning');
            const service = state.currentServices.find(s => s.code === serviceCode);
            if (service) selectService(serviceCode, service.name);
            return;
        }

        const route = CONFIG.SERVICE_ROUTES[serviceCode];
        if (!route) return showToast(`Service ${serviceCode} not available`, 'error');

        showToast(`🚀 Opening ${CONFIG.SERVICE_DETAILS[serviceCode]?.name || serviceCode}...`, 'success');
        setTimeout(() => { window.location.href = route; }, 500);
    }

    function selectService(code, name) {
        const price = state.servicePrices[code];
        if (typeof price !== 'number' || price <= 0) {
            return showToast("⚠️ Price for this service hasn't loaded yet. Try refreshing.", 'warning');
        }

        state.selectedService = code;
        state.selectedServiceName = name;
        state.selectedServicePrice = price;
        state.paymentCompleted = false;

        dom.payBtn.disabled = false;
        dom.payBtn.innerHTML = `<i class="fas fa-mobile-alt"></i> Pay KES ${price.toLocaleString()} for ${name}`;

        setStatus(`✅ Selected: ${name} (KES ${price.toLocaleString()})`, 'success');
        showToast(`✅ Selected ${name} for KES ${price.toLocaleString()}`, 'success');
    }

    // Delegate clicks so we don't need inline onclick handlers scattered in HTML strings
    dom.services.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const code = btn.dataset.code;
        if (btn.dataset.action === 'open') openService(code);
        if (btn.dataset.action === 'select') {
            const service = state.currentServices.find(s => s.code === code);
            selectService(code, service?.name || CONFIG.SERVICE_DETAILS[code]?.name || code);
        }
    });

    dom.serviceTabs.addEventListener('click', (e) => {
        const tab = e.target.closest('.service-tab');
        if (tab) switchServiceTab(tab.dataset.service);
    });

    // ─────────────────────────────────────────────────────────
    // PRICE POLLING (fallback to Realtime)
    // ─────────────────────────────────────────────────────────
    function startPricePolling() {
        stopPricePolling();
        state.pricePollingTimer = setInterval(() => {
            if (state.isAuthenticated) loadServicePrices(true);
        }, CONFIG.PRICE_POLLING_INTERVAL_MS);
    }

    function stopPricePolling() {
        if (state.pricePollingTimer) {
            clearInterval(state.pricePollingTimer);
            state.pricePollingTimer = null;
        }
    }

    function setupRealtimePriceUpdates() {
        if (!state.supabaseClient) return;
        try {
            state.supabaseClient
                .channel('services-changes')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'services' }, (payload) => {
                    const updated = payload.new;
                    if (!updated?.code || typeof updated.price !== 'number' || updated.price <= 0) return;

                    state.servicePrices[updated.code] = updated.price;
                    updatePriceTimestamp();
                    if (state.activeTab === updated.code) {
                        renderServicesForTab(updated.code);
                        flashPriceUpdate(updated.code);
                    }
                    showToast(`🔄 ${updated.name || updated.code} price updated to KES ${updated.price.toLocaleString()}`, 'info');
                })
                .subscribe();
        } catch (err) {
            console.warn('Could not set up realtime price updates:', err.message);
        }
    }

    // ─────────────────────────────────────────────────────────
    // PAYMENTS
    // ─────────────────────────────────────────────────────────
    async function loadPayments() {
        dom.payments.innerHTML = `<span class="loading"><span class="spinner"></span> Loading payments...</span>`;
        try {
            const data = await api('/mpesa/payments');
            renderPayments(data || []);
        } catch (err) {
            if (/40[13]/.test(err.message)) {
                dom.payments.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔐</div>
                        <div class="empty-title">Sign in to view history</div>
                        <div class="empty-desc">Your payment history will appear here after you sign in</div>
                    </div>
                `;
            } else {
                dom.payments.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Failed to load payments</div>
                        <div class="empty-desc">${escapeHtml(err.message)}</div>
                    </div>
                `;
            }
        }
    }

    function renderPayments(payments) {
        if (!payments.length) {
            dom.payments.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-title">No payments yet</div>
                    <div class="empty-desc">Your payment history will appear here</div>
                </div>
            `;
            return;
        }

        const rows = payments.map(p => `
            <tr>
                <td>${escapeHtml(p.service_name || '-')}</td>
                <td><strong>${escapeHtml(p.currency || 'KES')} ${Number(p.amount || 0).toLocaleString()}</strong></td>
                <td><span class="status-badge ${p.status || 'pending'}">${escapeHtml(p.status || 'pending')}</span></td>
                <td style="font-size:13px;color:var(--text-muted);">${p.created_at ? new Date(p.created_at).toLocaleString() : '-'}</td>
            </tr>
        `).join('');

        dom.payments.innerHTML = `
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Service</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
    }

    async function startPayment() {
        if (!state.selectedService) return showToast('Please select a service first', 'error');
        if (typeof state.selectedServicePrice !== 'number' || state.selectedServicePrice <= 0) {
            return showToast('⚠️ Price is unavailable — try refreshing before paying', 'error');
        }
        if (!state.isAuthenticated) return showToast('⚠️ Please sign in to make a payment', 'warning');

        const phone = dom.phoneInput.value.trim();
        if (!phone || phone.length < 10) return showToast('Please enter a valid phone number (e.g. 254712345678)', 'error');

        dom.payBtn.disabled = true;
        dom.payBtn.innerHTML = `<span class="spinner" style="width:18px;height:18px;border:2px solid rgba(0,0,0,0.1);border-top-color:#0a0c15;border-radius:50%;animation:spin 0.8s linear infinite;"></span> Sending...`;

        try {
            setStatus('📱 Initiating STK Push...', 'pending');

            const result = await api('/mpesa/stkpush', {
                method: 'POST',
                body: JSON.stringify({
                    phone,
                    service_id: state.selectedService,
                    description: state.selectedServiceName || state.selectedService,
                    request_id: null,
                    amount: state.selectedServicePrice
                })
            });

            state.checkoutRequestId = result.checkout_request_id || result.CheckoutRequestID;
            state.paymentCompleted = false;

            setStatus(`📱 STK Push sent!\nCheckout ID: ${state.checkoutRequestId}\nPlease complete the payment on your phone.`, 'pending');
            showToast('📱 STK Push sent! Check your phone.', 'info');

            startStatusPolling();
        } catch (err) {
            setStatus(`❌ Payment initiation failed:\n${err.message}`, 'error');
            showToast('Payment initiation failed: ' + err.message, 'error');
        } finally {
            dom.payBtn.disabled = false;
            dom.payBtn.innerHTML = `<i class="fas fa-mobile-alt"></i> Pay KES ${state.selectedServicePrice.toLocaleString()} for ${state.selectedServiceName}`;
        }
    }

    function startStatusPolling() {
        if (state.statusTimer) clearInterval(state.statusTimer);
        state.statusTimer = setInterval(checkPaymentStatus, CONFIG.STATUS_POLLING_INTERVAL_MS);
        setTimeout(checkPaymentStatus, 1000);
    }

    function stopStatusPolling() {
        if (state.statusTimer) {
            clearInterval(state.statusTimer);
            state.statusTimer = null;
        }
    }

    async function checkPaymentStatus() {
        if (!state.checkoutRequestId || state.paymentCompleted) {
            stopStatusPolling();
            return;
        }

        try {
            const status = await api(`/mpesa/status/${state.checkoutRequestId}`);

            if (['completed', 'paid', 'success'].includes(status.status)) {
                setStatus(`✅ Payment completed successfully!\nReceipt: ${status.mpesa_receipt || status.transaction_id || 'N/A'}`, 'success');
                stopStatusPolling();

                if (!state.paymentCompleted) {
                    state.paymentCompleted = true;
                    showToast('✅ Payment completed! Service unlocked.', 'success');
                    await loadPayments();

                    // Confirm unlocks the service server-side.
                    try {
                        await api(`/mpesa/confirm/${state.checkoutRequestId}`, { method: 'POST' });
                    } catch (confirmErr) {
                        console.warn('Confirm API warning:', confirmErr.message);
                    }

                    const unlockedName = state.selectedServiceName;
                    await loadUserServices();
                    showToast(`✅ ${unlockedName} unlocked! You can now access it.`, 'success');
                }
            } else if (['failed', 'cancelled'].includes(status.status)) {
                setStatus(`❌ Payment failed.\n${status.result_desc || status.message || 'Transaction declined'}`, 'error');
                stopStatusPolling();
                showToast('❌ Payment failed', 'error');
                await loadPayments();
            } else {
                setStatus(`⏳ Waiting for confirmation...\nCheckout ID: ${state.checkoutRequestId}\nPlease check your phone for the STK prompt.`, 'pending');
            }
        } catch (err) {
            console.warn('Status check error:', err.message);
        }
    }

    // ─────────────────────────────────────────────────────────
    // DASHBOARD LIFECYCLE
    // ─────────────────────────────────────────────────────────
    async function loadDashboard() {
        await loadUserServices();
        await loadPayments();
        setStatus(
            state.isAuthenticated ? '✅ Dashboard ready. Select a service to continue.' : '🔐 Sign in to make payments and view your history.',
            state.isAuthenticated ? 'success' : 'info'
        );
    }

    async function init() {
        initSupabase();
        await loadSession();
        renderAuthUI();

        if (state.supabaseClient) {
            state.supabaseClient.auth.onAuthStateChange(async (event, session) => {
                applySession(session);
                renderAuthUI();
                if (event === 'SIGNED_OUT') stopPricePolling();
                await loadDashboard();
            });
        }

        dom.payBtn.addEventListener('click', startPayment);
        dom.phoneInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!dom.payBtn.disabled) startPayment();
            }
        });
        dom.refreshPricesBtn.addEventListener('click', async () => {
            showToast('🔄 Refreshing prices...', 'info');
            await loadServicePrices(false);
            showToast('✅ Prices refreshed', 'success');
        });
        dom.refreshPaymentsBtn.addEventListener('click', loadPayments);

        await loadDashboard();
        setupRealtimePriceUpdates();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
