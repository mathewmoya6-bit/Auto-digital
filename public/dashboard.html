```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

            font-family: Arial, sans-serif;

<body>
<div class="container">

    <div class="card">
        <h1>AUTO-D Kenya</h1>
        <p>Vehicle Intelligence Platform</p>
    </div>

    <div class="card">
        <h2>Available Services</h2>
        <div id="services">Loading services...</div>
    </div>

    <div class="card">
        <h2>M-Pesa Payment</h2>

        <label>Phone Number</label>
        <input id="phone" type="tel" placeholder="2547XXXXXXXX" />

        <div style="margin-top:15px;">
            <button id="payBtn" disabled>Select a service</button>
        </div>

        <div style="margin-top:15px;">
            <strong>Status</strong>
            <div id="statusBox">Waiting for payment...</div>
        </div>
    </div>

    <div class="card">
        <h2>Payment History</h2>
        <div id="payments">Loading payments...</div>
    </div>

</div>

<script>
const API_BASE = 'https://auto-digital.onrender.com/api/v1';

let selectedService = null;
let checkoutRequestId = null;
let statusTimer = null;

function getToken() {
    return localStorage.getItem('token') || localStorage.getItem('access_token');
}

async function api(path, options = {}) {
    const token = getToken();

    const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
    };

    if (token) {
        headers['Authorization'] = `Bearer ${token}`;
    }

    const response = await fetch(API_BASE + path, {
        ...options,
        headers
    });

    if (!response.ok) {
        const text = await response.text();
        throw new Error(`${response.status} ${text}`);
    }

    return response.json();
}

function setStatus(message) {
    document.getElementById('statusBox').textContent = message;
}

function renderServices(services) {
    const container = document.getElementById('services');

    if (!services.length) {
        container.innerHTML = '<p>No services available</p>';
        return;
    }

    container.innerHTML = services.map(service => `
        <div class="service">
            <div>
                <strong>${service.name}</strong><br>
                <small>${service.description || ''}</small>
            </div>
            <div>
                <strong>KES ${Number(service.price).toLocaleString()}</strong>
                <button onclick="selectService('${service.code}')">Pay</button>
            </div>
        </div>
    `).join('');
}

window.selectService = function(code) {
    selectedService = code;

    const button = document.getElementById('payBtn');
    button.disabled = false;
    button.textContent = `Pay for ${code}`;

    setStatus(`Selected service: ${code}`);
};

async function loadServices() {
    try {
        const data = await api('/mpesa/services');
        renderServices(data.services || []);
    } catch (error) {
        document.getElementById('services').innerHTML =
            `<p style="color:red">Failed to load services: ${error.message}</p>`;
    }
}

function renderPayments(payments) {
    const container = document.getElementById('payments');

    if (!payments.length) {
        container.innerHTML = '<p>No payments found</p>';
        return;
    }

    container.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>Service</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                ${payments.map(p => `
                    <tr>
                        <td>${p.service_name || '-'}</td>
                        <td>KES ${Number(p.amount || 0).toLocaleString()}</td>
                        <td class="status-${p.status}">${p.status}</td>
                        <td>${p.created_at ? new Date(p.created_at).toLocaleString() : '-'}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

async function loadPayments() {
    try {
        const payments = await api('/mpesa/payments');
        renderPayments(payments || []);
    } catch (error) {
        document.getElementById('payments').innerHTML =
            `<p style="color:red">Failed to load payments: ${error.message}</p>`;
    }
}

async function startPayment() {
    if (!selectedService) {
        alert('Please select a service');
        return;
    }

    const phone = document.getElementById('phone').value.trim();

    if (!phone) {
        alert('Please enter a phone number');
        return;
    }

    const button = document.getElementById('payBtn');
    button.disabled = true;
    button.textContent = 'Sending STK Push...';

    try {
        setStatus('Initiating STK Push...');

        const result = await api('/mpesa/stkpush', {
            method: 'POST',
            body: JSON.stringify({
                phone,
                service_id: selectedService,
                description: selectedService,
                request_id: null
            })
        });

        checkoutRequestId = result.checkout_request_id;

        setStatus(
            `STK Push sent successfully.\n` +
            `Checkout ID: ${checkoutRequestId}\n` +
            `Please complete the payment on your phone.`
        );

        startStatusPolling();

    } catch (error) {
        setStatus(`Payment initiation failed:\n${error.message}`);
    } finally {
        button.disabled = false;
        button.textContent = selectedService
            ? `Pay for ${selectedService}`
            : 'Select a service';
    }
}

function startStatusPolling() {
    if (statusTimer) {
        clearInterval(statusTimer);
    }

    statusTimer = setInterval(checkPaymentStatus, 5000);
}

async function checkPaymentStatus() {
    if (!checkoutRequestId) return;

    try {
        const status = await api(`/mpesa/status/${checkoutRequestId}`);

        if (status.status === 'completed') {
            setStatus(`Payment completed successfully.\nReceipt: ${status.mpesa_receipt || 'N/A'}`);

            clearInterval(statusTimer);
            statusTimer = null;

            await loadPayments();

        } else if (status.status === 'failed') {
            setStatus(`Payment failed.\n${status.result_desc || ''}`);

            clearInterval(statusTimer);
            statusTimer = null;

            await loadPayments();

        } else {
            setStatus(`Waiting for payment confirmation...\nCheckout ID: ${checkoutRequestId}`);
        }

    } catch (error) {
        console.error('Status check failed', error);
    }
}

document.getElementById('payBtn').addEventListener('click', startPayment);

(async function init() {
    setStatus('Loading dashboard...');

    await Promise.all([
        loadServices(),
        loadPayments()
    ]);

    setStatus('Dashboard ready. Select a service to continue.');
})();
</script>
</body>
</html>
