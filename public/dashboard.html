<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Auto-D Kenya</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E" />

    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="auth-container">
        <h1>🚗 Auto-D <span style="color:#f8fafc;">Kenya</span></h1>
        <p class="sub">Create your account</p>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" />
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="•••••••• (min 8 chars)" required />
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                📝 Create Account
            </button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="/login.html">Sign In</a>
        </div>

        <div id="toastContainer" style="margin-top:16px;"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // ─── Toast ──────────────────────────────────────────────────

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ─── Register ──────────────────────────────────────────────

        async function handleRegister(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('registerBtn');

            if (!email || !password) {
                showToast('Please fill in all required fields', 'error');
                return;
            }

            if (password.length < 8) {
                showToast('Password must be at least 8 characters', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Creating account...';

            try {
                await register(email, password, fullName);
                showToast('✅ Account created! Please sign in.', 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1500);
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '📝 Create Account';
            }
        }

        // ─── Check if already logged in ────────────────────────────

        if (isAuthenticated()) {
            window.location.href = '/index.html';
        }
    </script>

</body>
</html>
