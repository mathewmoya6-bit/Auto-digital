<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Auto-D Kenya | Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c15;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .card {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
        }
        .badge-success { background: rgba(34, 197, 94, 0.15) !important; color: #22c55e !important; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 28px;
        }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { font-size: 32px; }
        .logo-text { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #f8fafc; }
        .logo-text span { color: #eab308; }
        .logo-sub { font-size: 12px; color: #64748b; display: block; margin-top: -2px; }
        .auth-section { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .auth-section input {
            padding: 8px 12px;
            background: #0a0c15;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #f8fafc;
            font-size: 13px;
            min-width: 150px;
        }
        .auth-section input:focus { outline: none; border-color: #eab308; }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: #eab308; color: #0a0c15; }
        .btn-primary:hover:not(:disabled) { background: #ca8a04; transform: translateY(-1px); }
        .btn-outline { background: transparent; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.06); }
        .btn-outline:hover:not(:disabled) { border-color: #eab308; color: #eab308; }
        .btn-success { background: #22c55e; color: #0a0c15; }
        .btn-success:hover:not(:disabled) { opacity: 0.85; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0a0c15;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }
        .user-name { font-weight: 600; font-size: 14px; }
        .user-email { font-size: 12px; color: #64748b; }
        .service-tabs {
            display: flex;
            gap: 4px;
            background: #0a0c15;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow-x: auto;
            min-height: 48px;
        }
        .service-tab {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #64748b;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .service-tab:hover { color: #cbd5e1; background: rgba(255,255,255,0.03); }
        .service-tab.active { background: #eab308; color: #0a0c15; }
        .service-tab .tab-badge {
            display: inline-block;
            font-size: 9px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            margin-left: 4px;
        }
        .service-tab.active .tab-badge { background: rgba(0,0,0,0.15); }
        .service-tab .tab-badge.unlocked { background: rgba(34,197,94,0.2); color: #22c55e; }
        .service-tab .tab-badge.locked { background: rgba(234,179,8,0.2); color: #eab308; }
        .service-tab .price-tag {
            font-size: 11px;
            background: rgba(255,255,255,0.05);
            padding: 1px 8px;
            border-radius: 10px;
            color: #94a3b8;
        }
        .service-tab.active .price-tag { color: #0a0c15; background: rgba(0,0,0,0.1); }
        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #0a0c15;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .service-item:last-child { margin-bottom: 0; }
        .service-info { flex: 1; min-width: 180px; }
        .service-name { font-weight: 600; font-size: 15px; color: #f8fafc; }
        .service-desc { font-size: 13px; color: #64748b; }
        .service-status {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
        }
        .service-status.unlocked { background: rgba(34,197,94,0.15); color: #22c55e; }
        .service-status.locked { background: rgba(234,179,8,0.15); color: #eab308; }
        .service-price {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #eab308;
            min-width: 120px;
            text-align: right;
        }
        .service-price.unavailable { color: #64748b; font-size: 13px; font-weight: 600; }
        .service-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .payment-form .form-group { margin-bottom: 16px; }
        .payment-form label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 4px; }
        .payment-form input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0c15;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
        }
        .payment-form input:focus { outline: none; border-color: #eab308; }
        .payment-form small { color: #64748b; font-size: 11px; display: block; margin-top: 4px; }
        .status-box {
            background: #0a0c15;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 16px 20px;
            min-height: 70px;
            font-size: 14px;
            line-height: 1.7;
            color: #cbd5e1;
            font-family: 'JetBrains Mono', monospace;
            white-space: pre-line;
        }
        .status-box .status-success { color: #22c55e; }
        .status-box .status-pending { color: #eab308; }
        .status-box .status-error { color: #ef4444; }
        .status-box .status-info { color: #3b82f6; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        th { font-weight: 600; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
        td { color: #cbd5e1; }
        .status-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-badge.pending { background: rgba(234,179,8,0.15); color: #eab308; }
        .status-badge.paid, .status-badge.completed { background: rgba(34,197,94,0.15); color: #22c55e; }
        .status-badge.failed, .status-badge.cancelled { background: rgba(239,68,68,0.15); color: #ef4444; }
        .loading { color: #64748b; font-style: italic; display: flex; align-items: center; gap: 10px; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(234,179,8,0.2);
            border-top-color: #eab308;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 400px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            animation: slideIn 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .toast-success { background: #22c55e; color: #0a0c15; }
        .toast-error { background: #ef4444; color: #fff; }
        .toast-info { background: #3b82f6; color: #fff; }
        .toast-warning { background: #eab308; color: #0a0c15; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        .empty-state { text-align: center; padding: 30px 16px; color: #64748b; }
        .empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }
        .empty-state .empty-title { font-size: 16px; font-weight: 600; color: #cbd5e1; }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }
        .status-indicator .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.green { background: #22c55e; }
        .dot.red { background: #ef4444; }
        .admin-btn {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #0a0c15;
            border: none;
            border-radius: 8px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .admin-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(168,85,247,0.3); }
        @media (max-width: 768px) {
            body { padding: 12px; }
            .card { padding: 16px; }
            .service-item { flex-direction: column; align-items: stretch; }
            .service-price { text-align: left; min-width: unset; }
            .service-actions { justify-content: space-between; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">

    <header class="header">
        <a href="/" class="logo">
            <span class="logo-icon">🚗</span>
            <div>
                <span class="logo-text">Auto-D <span>Kenya</span></span>
                <span class="logo-sub">Vehicle Intelligence Platform</span>
            </div>
        </a>
        <div class="auth-section" id="authSection">
            <span class="loading"><span class="spinner"></span> Checking session...</span>
        </div>
    </header>

    <div id="adminLinkContainer" style="display:none; margin-bottom: 16px;">
        <a href="/admin.html" class="admin-btn" target="_blank"><i class="fas fa-cog"></i> Admin Dashboard</a>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">🚀 Services <span class="badge">Access</span><span class="badge badge-success">Live</span></div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <div class="status-indicator">
                    <span class="dot green" id="statusDot"></span>
                    <span id="connectionStatus">Connected</span>
                </div>
                <button class="btn btn-sm btn-outline" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <div class="service-tabs" id="serviceTabs">
            <span class="loading" style="padding:8px 16px;"><span class="spinner"></span> Loading services...</span>
        </div>

        <div id="serviceDetail">
            <span class="loading"><span class="spinner"></span> Select a service</span>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">📱 M-Pesa Payment <span class="badge">Secure</span></div>
        </div>
        <div class="payment-form">
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number</label>
                <input id="phone" type="tel" placeholder="0712345678 or 254712345678" autocomplete="tel" />
                <small>Safaricom number — 07XXXXXXXX, 011XXXXXXXX, or with 254 prefix</small>
            </div>
            <button id="payBtn" class="btn btn-primary" disabled style="width:100%;justify-content:center;font-size:16px;padding:14px;">
                <i class="fas fa-lock"></i> Select a service first
            </button>
            <div style="margin-top:16px;">
                <div class="status-box" id="statusBox">Waiting for payment...</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">📜 Payment History <span class="badge">Recent</span></div>
            <button class="btn btn-sm btn-outline" id="refreshHistoryBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div id="payments"><span class="loading"><span class="spinner"></span> Loading...</span></div>
    </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// AUTO-D KENYA DASHBOARD — dynamic service tabs
//
// Trust model:
//  - Supabase: auth/session only.
//  - Backend API: the ONLY source of truth for service catalog,
//    access status, and payments. The client never writes access
//    grants directly to the database — that would let anyone
//    unlock a paid service for free via devtools.
// ═══════════════════════════════════════════════════════════════

(function () {
    'use strict';

    const CONFIG = {
        SUPABASE_URL: 'https://xgkdbithhlvoqjnqvfmj.supabase.co',
        SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhna2RiaXRoaGx2b3FqbnF2Zm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NTE4NzQsImV4cCI6MjA5ODIyNzg3NH0.-4P2aQAlDl_4oW0C18gh7cEBzoIKeiLUmMnITz-Nt9Y',
        API_BASE: 'https://auto-digital.onrender.com/api/v1',
        STATUS_POLLING_INTERVAL_MS: 5000,
        STATUS_POLLING_MAX_ATTEMPTS: 24 // 2 minutes at 5s
    };

    const state = {
        supabaseClient: null,
        currentUser: null,
        isAuthenticated: false,
        accessToken: null,
        isAdmin: false,

        allServices: [],       // from GET /mpesa/services — includes has_access when authed
        selectedService: null,

        checkoutRequestId: null,
        statusTimer: null,
        statusAttempts: 0,
        paymentCompleted: false
    };

    const dom = {
        serviceTabs: document.getElementById('serviceTabs'),
        serviceDetail: document.getElementById('serviceDetail'),
        payments: document.getElementById('payments'),
        statusBox: document.getElementById('statusBox'),
        phoneInput: document.getElementById('phone'),
        payBtn: document.getElementById('payBtn'),
        authSection: document.getElementById('authSection'),
        statusDot: document.getElementById('statusDot'),
        connectionStatus: document.getElementById('connectionStatus'),
        adminLink: document.getElementById('adminLinkContainer'),
        toastContainer: document.getElementById('toastContainer'),
        refreshBtn: document.getElementById('refreshBtn'),
        refreshHistoryBtn: document.getElementById('refreshHistoryBtn')
    };

    // ─────────────────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────────────────
    function showToast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.textContent = msg;
        dom.toastContainer.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }

    function setStatus(msg, type = 'info') {
        const map = { success: 'status-success', pending: 'status-pending', error: 'status-error', info: 'status-info' };
        dom.statusBox.innerHTML = `<span class="${map[type] || 'status-info'}">${escapeHtml(msg)}</span>`;
    }

    function formatPrice(p) { return (typeof p === 'number' && p > 0) ? `KSh ${p.toLocaleString()}` : '—'; }

    function updateConnection(connected) {
        dom.statusDot.className = `dot ${connected ? 'green' : 'red'}`;
        dom.connectionStatus.textContent = connected ? 'Connected' : 'Disconnected';
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ─────────────────────────────────────────────────────────
    // SUPABASE — auth/session only, nothing else
    // ─────────────────────────────────────────────────────────
    function initSupabase() {
        if (state.supabaseClient || typeof supabase === 'undefined') return state.supabaseClient;
        state.supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
            auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
        });
        return state.supabaseClient;
    }

    function evaluateAdmin(user) {
        if (!user) return false;
        // app_metadata is server-set and trustworthy; user_metadata is
        // client-editable and must never gate admin features alone.
        const am = user.app_metadata || {};
        const um = user.user_metadata || {};
        return am.role === 'admin' || am.is_admin === true || um.role === 'admin' || um.is_admin === true;
    }

    function applySession(session) {
        if (!session?.user) {
            state.currentUser = null;
            state.isAuthenticated = false;
            state.accessToken = null;
            state.isAdmin = false;
            return;
        }
        state.currentUser = session.user;
        state.isAuthenticated = true;
        state.accessToken = session.access_token;
        state.isAdmin = evaluateAdmin(session.user);
    }

    async function loadSession() {
        initSupabase();
        if (!state.supabaseClient) return;
        const { data: { session } } = await state.supabaseClient.auth.getSession();
        applySession(session);
    }

    async function signIn(email, password) {
        initSupabase();
        try {
            const { data, error } = await state.supabaseClient.auth.signInWithPassword({
                email: email.toLowerCase().trim(),
                password
            });
            if (error) throw error;
            applySession(data.session);
            renderAuth();
            showToast('✅ Signed in', 'success');
            await loadDashboard();
        } catch (err) {
            showToast('❌ Sign in failed: ' + err.message, 'error');
        }
    }

    async function logout() {
        try { if (state.supabaseClient) await state.supabaseClient.auth.signOut(); } catch (e) { /* ignore */ }
        applySession(null);
        renderAuth();
        resetForLoggedOut();
        showToast('Logged out', 'info');
    }

    function resetForLoggedOut() {
        dom.serviceTabs.innerHTML = '<span class="loading" style="padding:8px 16px;">Please log in</span>';
        dom.serviceDetail.innerHTML = '<span class="loading">Please log in</span>';
        dom.payments.innerHTML = '<span class="loading">Please log in</span>';
        dom.payBtn.disabled = true;
        dom.payBtn.innerHTML = '<i class="fas fa-lock"></i> Login to pay';
        dom.adminLink.style.display = 'none';
    }

    function renderAuth() {
        dom.adminLink.style.display = state.isAdmin ? 'block' : 'none';

        if (state.isAuthenticated && state.currentUser) {
            const name = state.currentUser.user_metadata?.full_name || state.currentUser.email?.split('@')[0] || 'User';
            dom.authSection.innerHTML = `
                <div class="user-info">
                    <div class="user-avatar">${name.charAt(0).toUpperCase()}</div>
                    <div><div class="user-name">${escapeHtml(name)}</div><div class="user-email">${escapeHtml(state.currentUser.email)}</div></div>
                </div>
                <button class="btn btn-sm btn-danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            `;
            document.getElementById('logoutBtn').addEventListener('click', logout);
        } else {
            dom.authSection.innerHTML = `
                <input type="email" id="loginEmail" placeholder="Email" />
                <input type="password" id="loginPassword" placeholder="Password" />
                <button class="btn btn-primary btn-sm" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
            `;
            document.getElementById('loginBtn').addEventListener('click', () => {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                if (!email || !password) return showToast('Enter email and password', 'error');
                signIn(email, password);
            });
            document.getElementById('loginPassword').addEventListener('keydown', e => {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });
        }
    }

    // ─────────────────────────────────────────────────────────
    // BACKEND API — source of truth for services, access, payments
    // ─────────────────────────────────────────────────────────
    async function api(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json', ...(options.headers || {}) };
        if (state.accessToken) headers['Authorization'] = `Bearer ${state.accessToken}`;

        const url = CONFIG.API_BASE + path;
        let response = await fetch(url, { ...options, headers, credentials: 'include' });

        if (response.status === 401 && state.accessToken && state.supabaseClient) {
            try {
                const { data: { session }, error } = await state.supabaseClient.auth.refreshSession();
                if (!error && session?.access_token) {
                    state.accessToken = session.access_token;
                    headers['Authorization'] = `Bearer ${state.accessToken}`;
                    response = await fetch(url, { ...options, headers, credentials: 'include' });
                }
            } catch (e) { /* fall through */ }
        }

        if (!response.ok) {
            let message;
            try {
                const errorData = await response.json();
                if (Array.isArray(errorData.detail)) {
                    message = errorData.detail
                        .map(d => {
                            const field = Array.isArray(d.loc) ? d.loc[d.loc.length - 1] : null;
                            return field ? `${field}: ${d.msg}` : d.msg;
                        })
                        .join('; ');
                } else if (typeof errorData.detail === 'string') {
                    message = errorData.detail;
                } else {
                    message = errorData.message || errorData.error || `HTTP ${response.status}`;
                }
            } catch { message = `HTTP ${response.status}: ${response.statusText}`; }
            throw new Error(message);
        }

        const text = await response.text();
        if (!text) return {};
        try { return JSON.parse(text); } catch { return {}; }
    }

    async function fetchServices() {
        const data = await api('/mpesa/services');
        state.allServices = data.services || [];
        return state.allServices;
    }

    async function checkServiceAccess(serviceCode) {
        try {
            const result = await api(`/mpesa/check-access/${serviceCode}`);
            return result.has_access === true;
        } catch (err) {
            console.warn('Access check failed:', err.message);
            return false;
        }
    }

    // ─────────────────────────────────────────────────────────
    // RENDER: TABS + DETAIL
    // ─────────────────────────────────────────────────────────
    function renderTabs() {
        const services = state.allServices;
        if (!services.length) {
            dom.serviceTabs.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No services available</div></div>`;
            dom.serviceDetail.innerHTML = '';
            return;
        }

        if (!state.selectedService || !services.some(s => s.code === state.selectedService)) {
            state.selectedService = services[0].code;
        }

        dom.serviceTabs.innerHTML = services.map(service => {
            const unlocked = service.has_access === true;
            const isActive = state.selectedService === service.code;
            return `
                <button class="service-tab ${isActive ? 'active' : ''}" data-service="${service.code}">
                    <span>${escapeHtml(service.name)}</span>
                    <span class="price-tag">${formatPrice(service.price)}</span>
                    <span class="tab-badge ${unlocked ? 'unlocked' : 'locked'}">${unlocked ? '✅' : '🔒'}</span>
                </button>
            `;
        }).join('');

        renderServiceDetail(state.selectedService);
    }

    function renderServiceDetail(serviceCode) {
        const service = state.allServices.find(s => s.code === serviceCode);
        if (!service) {
            dom.serviceDetail.innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">Service not found</div></div>`;
            return;
        }

        const unlocked = service.has_access === true;

        dom.serviceDetail.innerHTML = `
            <div class="service-item">
                <div class="service-info">
                    <div class="service-name">${escapeHtml(service.name)}</div>
                    <div class="service-desc">${escapeHtml(service.description || 'No description available')}</div>
                    <span class="service-status ${unlocked ? 'unlocked' : 'locked'}">${unlocked ? '✅ Unlocked' : '🔒 Locked'}</span>
                </div>
                <div class="service-price">${formatPrice(service.price)}</div>
                <div class="service-actions">
                    ${unlocked
                        ? `<button class="btn btn-success btn-sm" data-action="open" data-code="${service.code}"><i class="fas fa-external-link-alt"></i> Open Report</button>`
                        : `<button class="btn btn-primary btn-sm" data-action="select" data-code="${service.code}"><i class="fas fa-shopping-cart"></i> Purchase</button>`
                    }
                </div>
            </div>
        `;

        state.selectedService = serviceCode;
        updatePayBtn();
    }

    function updatePayBtn() {
        const service = state.allServices.find(s => s.code === state.selectedService);
        if (!state.isAuthenticated) {
            dom.payBtn.disabled = true;
            dom.payBtn.innerHTML = '<i class="fas fa-lock"></i> Login to pay';
            return;
        }
        if (!service) {
            dom.payBtn.disabled = true;
            dom.payBtn.innerHTML = '<i class="fas fa-lock"></i> Select a service first';
            return;
        }
        if (service.has_access) {
            dom.payBtn.disabled = true;
            dom.payBtn.innerHTML = '<i class="fas fa-check"></i> Already unlocked';
            return;
        }
        if (typeof service.price !== 'number' || service.price <= 0) {
            dom.payBtn.disabled = true;
            dom.payBtn.innerHTML = '<i class="fas fa-ban"></i> Price unavailable';
            return;
        }
        dom.payBtn.disabled = false;
        dom.payBtn.innerHTML = `<i class="fas fa-mobile-alt"></i> Pay ${formatPrice(service.price)} for ${escapeHtml(service.name)}`;
    }

    // Event delegation instead of inline onclick handlers
    dom.serviceTabs.addEventListener('click', (e) => {
        const tab = e.target.closest('.service-tab');
        if (!tab) return;
        state.selectedService = tab.dataset.service;
        document.querySelectorAll('.service-tab').forEach(el => el.classList.toggle('active', el === tab));
        renderServiceDetail(state.selectedService);
    });

    dom.serviceDetail.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const code = btn.dataset.code;

        if (btn.dataset.action === 'select') {
            const service = state.allServices.find(s => s.code === code);
            if (!service || typeof service.price !== 'number' || service.price <= 0) {
                return showToast("⚠️ Price for this service hasn't loaded yet. Try refreshing.", 'warning');
            }
            state.selectedService = code;
            renderServiceDetail(code);
            setStatus(`✅ Selected: ${service.name} (${formatPrice(service.price)})`, 'success');
            showToast(`✅ ${service.name} selected`, 'success');
        }

        if (btn.dataset.action === 'open') {
            // Always re-verify server-side — never trust the cached tab state.
            const hasAccess = await checkServiceAccess(code);
            if (!hasAccess) {
                showToast('🔒 Access not confirmed yet — please pay to unlock', 'warning');
                return;
            }
            showToast(`🚀 Opening report...`, 'success');
            // Route to the report page for this service, e.g. /instant-value.html.
            // Adjust this map if your report page slugs differ from service codes.
            const routes = { valuation: '/instant-value.html', mileage: '/mileage.html', ownership: '/ownership-cost.html', tco: '/ownership-cost.html' };
            const route = routes[code];
            if (route) setTimeout(() => { window.location.href = route; }, 400);
        }
    });

    // ─────────────────────────────────────────────────────────
    // PAYMENT
    // ─────────────────────────────────────────────────────────
    function normalizePhoneForDisplayCheck(raw) {
        // Mirrors the backend's own normalization closely enough to catch
        // obviously invalid input before making a network call — the
        // backend's validator is still the final authority.
        let phone = raw.replace(/\D/g, '');
        if (phone.startsWith('254')) phone = phone.slice(3);
        if (phone.startsWith('0')) phone = phone.slice(1);
        return /^(7\d{8}|11\d{7})$/.test(phone);
    }

    async function startPayment() {
        const service = state.allServices.find(s => s.code === state.selectedService);
        if (!service) return showToast('Select a service first', 'error');
        if (service.has_access) return showToast('Service already unlocked', 'info');
        if (!state.isAuthenticated) return showToast('Please log in', 'error');

        const phone = dom.phoneInput.value.trim();
        if (!phone || !normalizePhoneForDisplayCheck(phone)) {
            setStatus('❌ Invalid phone. Use a Safaricom number (07X or 011X, with or without 254 prefix)', 'error');
            return showToast('Invalid phone format', 'error');
        }

        setStatus(`⏳ Initiating payment for ${service.name} (${formatPrice(service.price)})...`, 'pending');
        dom.payBtn.disabled = true;
        dom.payBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

        try {
            // NOTE: we intentionally do NOT send `amount` here. The schema
            // allows it to override the service's real price — sending our
            // own client-side price would let someone tamper the request
            // and pay less than the actual cost. Let the backend look up
            // the canonical price from service_id instead.
            const result = await api('/mpesa/stkpush', {
                method: 'POST',
                body: JSON.stringify({
                    phone,
                    service_id: state.selectedService,
                    description: service.name
                })
            });

            state.checkoutRequestId = result.checkout_request_id;
            state.paymentCompleted = false;
            state.statusAttempts = 0;

            setStatus(`📱 M-Pesa prompt sent!\nCheckout ID: ${state.checkoutRequestId}\nCheck your phone to complete payment.`, 'pending');
            showToast('📱 Check your phone for the M-Pesa prompt', 'success');

            startStatusPolling();
        } catch (err) {
            setStatus(`❌ Payment initiation failed:\n${err.message}`, 'error');
            showToast('❌ ' + err.message, 'error');
            dom.payBtn.disabled = false;
            updatePayBtn();
        }
    }

    function startStatusPolling() {
        stopStatusPolling();
        state.statusTimer = setInterval(checkPaymentStatus, CONFIG.STATUS_POLLING_INTERVAL_MS);
        setTimeout(checkPaymentStatus, 1000);
    }

    function stopStatusPolling() {
        if (state.statusTimer) { clearInterval(state.statusTimer); state.statusTimer = null; }
    }

    async function checkPaymentStatus() {
        if (!state.checkoutRequestId || state.paymentCompleted) { stopStatusPolling(); return; }

        state.statusAttempts++;
        if (state.statusAttempts > CONFIG.STATUS_POLLING_MAX_ATTEMPTS) {
            stopStatusPolling();
            setStatus('⏳ Still waiting — check Payment History shortly, or try again.', 'info');
            dom.payBtn.disabled = false;
            updatePayBtn();
            return;
        }

        try {
            const s = await api(`/mpesa/status/${state.checkoutRequestId}`);

            if (['completed', 'paid', 'success'].includes(s.status)) {
                stopStatusPolling();
                state.paymentCompleted = true;

                setStatus(`✅ Payment completed!\nReceipt: ${s.mpesa_receipt || s.transaction_id || 'N/A'}`, 'success');
                showToast('🎉 Payment successful!', 'success');

                // Server-side confirm is what actually unlocks the service —
                // the client never grants itself access.
                try { await api(`/mpesa/confirm/${state.checkoutRequestId}`, { method: 'POST' }); }
                catch (confirmErr) { console.warn('Confirm warning:', confirmErr.message); }

                await fetchServices();
                renderTabs();
                await loadHistory();
                showToast(`✅ ${state.selectedService} unlocked!`, 'success');

            } else if (['failed', 'cancelled'].includes(s.status)) {
                stopStatusPolling();
                setStatus(`❌ Payment failed.\n${s.result_desc || s.message || 'Transaction declined'}`, 'error');
                showToast('❌ Payment failed', 'error');
                dom.payBtn.disabled = false;
                updatePayBtn();
                await loadHistory();
            } else {
                setStatus(`⏳ Waiting for confirmation...\nCheckout ID: ${state.checkoutRequestId}`, 'pending');
            }
        } catch (err) {
            console.warn('Status check error:', err.message);
        }
    }

    // ─────────────────────────────────────────────────────────
    // PAYMENT HISTORY — via backend, not a direct table read
    // ─────────────────────────────────────────────────────────
    async function loadHistory() {
        if (!state.isAuthenticated) {
            dom.payments.innerHTML = '<span class="loading">Please log in</span>';
            return;
        }
        dom.payments.innerHTML = `<span class="loading"><span class="spinner"></span> Loading...</span>`;
        try {
            const data = await api('/mpesa/payments');
            const payments = data.payments || [];
            if (!payments.length) {
                dom.payments.innerHTML = `<div class="empty-state"><div class="empty-icon">💳</div><div class="empty-title">No payments yet</div></div>`;
                return;
            }
            const rows = payments.map(p => {
                const cls = ['completed', 'paid'].includes(p.status) ? 'paid' : (p.status || 'pending');
                return `
                    <tr>
                        <td>${escapeHtml(p.service_name || '—')}</td>
                        <td>${escapeHtml(p.currency || 'KES')} ${Number(p.amount || 0).toLocaleString()}</td>
                        <td><span class="status-badge ${cls}">${escapeHtml(p.status || 'pending')}</span></td>
                        <td>${p.created_at ? new Date(p.created_at).toLocaleDateString() : '—'}</td>
                    </tr>
                `;
            }).join('');
            dom.payments.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Service</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        } catch (err) {
            dom.payments.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-title">Failed to load payments</div>
                    <div style="font-size:13px;">${escapeHtml(err.message)}</div>
                </div>
            `;
        }
    }

    // ─────────────────────────────────────────────────────────
    // LIFECYCLE
    // ─────────────────────────────────────────────────────────
    async function loadDashboard() {
        dom.serviceTabs.innerHTML = `<span class="loading" style="padding:8px 16px;"><span class="spinner"></span> Loading services...</span>`;
        try {
            await fetchServices();
            renderTabs();
        } catch (err) {
            dom.serviceTabs.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-title">Failed to load services</div>
                    <div style="font-size:13px;">${escapeHtml(err.message)}</div>
                </div>
            `;
            showToast('Failed to load services', 'error');
        }
        await loadHistory();
        setStatus(state.isAuthenticated ? '✅ Ready. Select a service to continue.' : '🔐 Sign in to make payments.', state.isAuthenticated ? 'success' : 'info');
    }

    async function init() {
        updateConnection(true);
        initSupabase();
        await loadSession();
        renderAuth();

        if (state.supabaseClient) {
            state.supabaseClient.auth.onAuthStateChange(async (event, session) => {
                applySession(session);
                renderAuth();
                if (event === 'SIGNED_OUT') { resetForLoggedOut(); return; }
                await loadDashboard();
            });
        }

        dom.payBtn.addEventListener('click', startPayment);
        dom.phoneInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !dom.payBtn.disabled) startPayment();
        });
        dom.refreshBtn.addEventListener('click', async () => {
            showToast('🔄 Refreshing...', 'info');
            await loadDashboard();
        });
        dom.refreshHistoryBtn.addEventListener('click', loadHistory);

        if (state.isAuthenticated) {
            await loadDashboard();
        } else {
            resetForLoggedOut();
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
