<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Auto-D Kenya</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eab308' rx='20'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23000'%3E🚗%3C/text%3E%3C/svg%3E" />

    <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

    <div class="auth-container">
        <h1>🚗 Auto-D <span style="color:#f8fafc;">Kenya</span></h1>
        <p class="sub">Sign in to your account</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                🔑 Sign In
            </button>
        </form>

        <div class="auth-link">
            Don't have an account? <a href="/register.html">Sign Up</a>
        </div>

        <div id="toastContainer" style="margin-top:16px;"></div>
    </div>

    <script>
        // ─── Configuration ──────────────────────────────────────

        const API_BASE = 'https://auto-digital.onrender.com/api/v1';

        // ─── Toast ──────────────────────────────────────────────

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ─── Auth ────────────────────────────────────────────────

        function setToken(token) {
            localStorage.setItem('token', token);
        }

        function isAuthenticated() {
            return !!localStorage.getItem('token');
        }

        // ─── Login ──────────────────────────────────────────────

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showToast('Please enter email and password', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Signing in...';

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || data.message || 'Login failed');
                }

                setToken(data.access_token);
                localStorage.setItem('user', JSON.stringify({ email }));

                window.location.href = '/index.html';

            } catch (error) {
                showToast('❌ ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '🔑 Sign In';
            }
        }

        // ─── Check if already logged in ──────────────────────────

        if (isAuthenticated()) {
            window.location.href = '/index.html';
        }
    </script>

</body>
</html>
