<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Auto-D Kenya</title>
    <!-- ... rest of head content ... -->

<body>
    <!-- ... rest of body content ... -->

    <script>
        // ════════════════════════════════════════════════════════════════
        // AUTO-D KENYA - DASHBOARD
        // FIXED: navigateToService now properly opens payment modal
        // ════════════════════════════════════════════════════════════════

        (function() {
            'use strict';

            // ─── Configuration ──────────────────────────────────────────
            const API_BASE = 'https://auto-digital.onrender.com/api/v1';
            
            const SUPABASE_URL = 'https://xgkdbithhlvoqjnqvfmj.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhna2RiaXRoaGx2b3FqbnF2Zm1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NTE4NzQsImV4cCI6MjA5ODIyNzg3NH0.-4P2aQAlDl_4oW0C18gh7cEBzoIKeiLUmMnITz-Nt9Y';

            // ─── State ──────────────────────────────────────────────────
            let currentUser = null;
            let supabaseClient = null;
            let dashboardData = null;
            let selectedService = null;
            let isProcessingPayment = false;
            let checkoutRequestId = null;
            let pendingServiceRedirect = null;
            let pendingRequestId = null;
            let pollTimer = null;
            let isWaitingForPayment = false;
            let confirmedCheckoutId = null;
            let unlockInFlightFor = null;
            let recentlyUnlockedService = null;

            const MAX_POLLING_ATTEMPTS = 120;
            const PAYMENT_TIMEOUT_MINUTES = 4;

            // ─── Service Routes ──────────────────────────────────────
            const SERVICE_ROUTES = {
                'mileage': '/mileage.html',
                'valuation': '/instant-value.html',
                'ownership': '/ownership-cost.html'
            };

            const SERVICE_NAMES = {
                'mileage': 'Mileage Calculator',
                'valuation': 'Instant Vehicle Value',
                'ownership': 'Ownership Cost Report'
            };

            const SERVICE_ICONS = {
                'mileage': '📈',
                'valuation': '💰',
                'ownership': '📊'
            };

            const DEFAULT_SERVICES = [
                { id: 'mileage', code: 'mileage', name: 'Mileage Calculator', price: 100, icon: '📈', route: '/mileage.html', purchased: false, status: 'locked' },
                { id: 'valuation', code: 'valuation', name: 'Instant Vehicle Value', price: 150, icon: '💰', route: '/instant-value.html', purchased: false, status: 'locked' },
                { id: 'ownership', code: 'ownership', name: 'Ownership Cost Report', price: 200, icon: '📊', route: '/ownership-cost.html', purchased: false, status: 'locked' }
            ];

            // ─── DOM Refs ──────────────────────────────────────────────
            const vehicleGrid = document.getElementById('vehicleGrid');
            const servicesGrid = document.getElementById('servicesGrid');
            const requestsList = document.getElementById('requestsList');
            const paymentsList = document.getElementById('paymentsList');
            const notificationsList = document.getElementById('notificationsList');

            // ─── Helpers ──────────────────────────────────────────────
            function num(v, fallback = 0) {
                const n = Number(v);
                return Number.isFinite(n) ? n : fallback;
            }

            function showToast(message, type) {
                type = type || 'info';
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
                toast.innerHTML = icon + ' ' + message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100px)';
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>]/g, function(m) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' } [m];
                });
            }

            function updateWorkflowStep(step) {
                const steps = ['step1', 'step2', 'step3', 'step4', 'step5'];
                steps.forEach((id, index) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.className = 'workflow-step';
                    if (index + 1 === step) el.classList.add('active');
                    if (index + 1 < step) el.classList.add('done');
                });
            }

            async function getAuthToken() {
                try {
                    if (!supabaseClient) {
                        if (!initSupabase()) return null;
                    }
                    const { data: { session }, error } = await supabaseClient.auth.getSession();
                    if (error) throw error;
                    if (session?.access_token) {
                        return session.access_token;
                    }
                    const stored = localStorage.getItem('auto_d_user');
                    if (stored) {
                        try {
                            const user = JSON.parse(stored);
                            if (user?.access_token) return user.access_token;
                        } catch (e) { /* ignore */ }
                    }
                    return null;
                } catch (error) {
                    console.warn('⚠️ Auth token error:', error.message);
                    return null;
                }
            }

            async function requireAuthToken() {
                const token = await getAuthToken();
                if (!token) {
                    showToast('⚠️ Your session has expired. Please log in again.', 'error');
                    setTimeout(() => {
                        window.location.href = 'https://auto-d.meipressgroup.com/';
                    }, 1500);
                    return null;
                }
                return token;
            }

            // ─── Supabase ─────────────────────────────────────────────
            function initSupabase() {
                try {
                    if (typeof supabase === 'undefined') {
                        console.warn('⚠️ Supabase SDK not loaded');
                        return false;
                    }
                    const { createClient } = supabase;
                    supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    console.log('✅ Supabase client initialized');
                    return true;
                } catch (error) {
                    console.error('❌ Supabase init error:', error);
                    return false;
                }
            }

            // ─── Auth ──────────────────────────────────────────────────
            async function checkAuth() {
                try {
                    if (!supabaseClient) {
                        if (!initSupabase()) return false;
                    }
                    const { data: { session }, error } = await supabaseClient.auth.getSession();
                    if (error) throw error;
                    if (session?.user) {
                        currentUser = session.user;
                        const userData = {
                            ...session.user,
                            access_token: session.access_token
                        };
                        localStorage.setItem('auto_d_user', JSON.stringify(userData));
                        updateUserUI();

                        try {
                            const meResp = await fetch(`${API_BASE}/auth/me`, {
                                headers: { 'Authorization': `Bearer ${session.access_token}` }
                            });
                            if (!meResp.ok) {
                                console.warn('Backend rejected session token, signing out');
                                await supabaseClient.auth.signOut();
                                localStorage.removeItem('auto_d_user');
                                return false;
                            }
                        } catch (e) {
                            console.warn('Could not verify session with backend:', e.message);
                        }

                        return true;
                    }
                    const stored = localStorage.getItem('auto_d_user');
                    if (stored) {
                        try {
                            const user = JSON.parse(stored);
                            currentUser = user;
                            updateUserUI();
                            return true;
                        } catch (e) { /* ignore */ }
                    }
                    return false;
                } catch (error) {
                    console.warn('⚠️ Auth check error:', error.message);
                    return false;
                }
            }

            function updateUserUI() {
                if (!currentUser) return;
                const meta = currentUser.user_metadata || {};
                const name = meta.full_name || meta.first_name || currentUser.email?.split('@')[0] || 'User';
                const userNameEl = document.getElementById('userName');
                const userAvatarEl = document.getElementById('userAvatar');
                const greetingTextEl = document.getElementById('greetingText');
                if (userNameEl) userNameEl.textContent = name;
                if (userAvatarEl) userAvatarEl.textContent = name.charAt(0).toUpperCase();
                if (greetingTextEl) greetingTextEl.textContent = `👋 Welcome back, ${name}!`;
            }

            // ─── Navigation (FIXED) ───────────────────────────────────
            window.navigateTo = function(section) {
                showToast(`📂 Navigating to ${section}...`, 'info');
            };

            // ════════════════════════════════════════════════════════════
            // ─── FIX: navigateToService now properly opens payment modal ───
            // ════════════════════════════════════════════════════════════
            window.navigateToService = function(serviceId) {
                console.log('🔍 navigateToService called with:', serviceId);
                
                if (!dashboardData || !dashboardData.services) {
                    showToast('Loading services, please wait...', 'warning');
                    loadDashboard().then(() => {
                        setTimeout(() => {
                            window.navigateToService(serviceId);
                        }, 500);
                    });
                    return;
                }

                const service = dashboardData.services.find(s => s.id === serviceId);
                if (!service) {
                    showToast('Service not found', 'error');
                    return;
                }

                const isPurchased = service.purchased || service.status === 'purchased' || service.status === 'active';

                if (isPurchased) {
                    // ─── IF PURCHASED: Redirect to service page ──────────
                    const route = SERVICE_ROUTES[serviceId];
                    if (route) {
                        console.log('🚀 Redirecting to purchased service:', route);
                        window.location.href = route;
                    } else {
                        showToast('Service route not found', 'error');
                    }
                } else {
                    // ─── IF LOCKED: Open payment modal ──────────────────
                    console.log('🔒 Service is locked, opening payment modal for:', service.name);
                    pendingServiceRedirect = serviceId;
                    selectedService = service;
                    openPaymentModal(service);
                }
            };

            window.handleServiceAction = function(serviceId) {
                window.navigateToService(serviceId);
            };

            // ─── Success Overlay ──────────────────────────────────────
            window.showSuccessOverlay = function(serviceId, serviceName) {
                const overlay = document.getElementById('successOverlay');
                const message = document.getElementById('successMessage');
                const openBtn = document.getElementById('openServiceBtn');
                
                recentlyUnlockedService = serviceId;
                
                if (message) {
                    message.textContent = `${serviceName || 'Service'} has been unlocked successfully! You can now access it.`;
                }
                
                if (openBtn) {
                    openBtn.onclick = function() {
                        closeSuccessOverlay();
                        const route = SERVICE_ROUTES[serviceId];
                        if (route) {
                            window.location.href = route;
                        } else {
                            showToast('Service route not found', 'error');
                        }
                    };
                    openBtn.style.display = 'inline-flex';
                }
                
                if (overlay) {
                    overlay.classList.add('open');
                    fireConfetti();
                }
                
                updateWorkflowStep(5);
            };

            window.closeSuccessOverlay = function() {
                const overlay = document.getElementById('successOverlay');
                if (overlay) {
                    overlay.classList.remove('open');
                }
                const confetti = document.getElementById('confettiContainer');
                if (confetti) {
                    confetti.innerHTML = '';
                }
                loadDashboard();
            };

            window.openPurchasedService = function() {
                if (recentlyUnlockedService) {
                    const route = SERVICE_ROUTES[recentlyUnlockedService];
                    if (route) {
                        window.location.href = route;
                    }
                }
            };

            function fireConfetti() {
                const container = document.getElementById('confettiContainer');
                if (!container) return;
                container.innerHTML = '';
                const colors = ['#eab308', '#22c55e', '#3b82f6', '#ef4444', '#8b5cf6', '#ec4899', '#f59e0b', '#06b6d4'];
                for (let i = 0; i < 80; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.width = (Math.random() * 8 + 4) + 'px';
                    piece.style.height = (Math.random() * 8 + 4) + 'px';
                    piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    piece.style.animationDelay = (Math.random() * 2) + 's';
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    container.appendChild(piece);
                }
                setTimeout(() => {
                    container.innerHTML = '';
                }, 5000);
            }

            // ─── Load Dashboard ──────────────────────────────────────
            async function loadDashboard() {
                try {
                    if (vehicleGrid) {
                        vehicleGrid.innerHTML = `<div class="empty-state"><div class="spinner" style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></div><p style="margin-top:12px;color:var(--text-muted);">Loading...</p></div>`;
                    }
                    if (servicesGrid) {
                        servicesGrid.innerHTML = `<div class="empty-state"><div class="spinner" style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></div><p style="margin-top:12px;color:var(--text-muted);">Loading...</p></div>`;
                    }

                    let services;
                    try {
                        const svcResp = await fetch(`${API_BASE}/services?active_only=true`);
                        if (!svcResp.ok) throw new Error(`HTTP ${svcResp.status}`);
                        const svcJson = await svcResp.json();
                        const liveServices = (svcJson.services || []).map(s => ({
                            id: s.service_type,
                            code: s.service_type,
                            name: s.service_name,
                            price: s.price,
                            icon: s.icon || SERVICE_ICONS[s.service_type] || '📦',
                            route: SERVICE_ROUTES[s.service_type] || null,
                            purchased: false,
                            status: 'locked'
                        }));
                        if (liveServices.length > 0) {
                            services = liveServices;
                            console.log('📋 Loaded services from API:', services);
                        } else {
                            throw new Error('API returned zero active services');
                        }
                    } catch (e) {
                        console.warn('⚠️ Could not load services from /api/v1/services, using hardcoded defaults:', e.message);
                        services = DEFAULT_SERVICES.map(s => ({ ...s }));
                    }

                    let vehicles = [];
                    try {
                        if (currentUser) {
                            const { data, error } = await supabaseClient
                                .from('vehicles')
                                .select('*')
                                .eq('user_id', currentUser.id)
                                .order('created_at', { ascending: false });
                            if (!error) vehicles = data || [];
                        }
                    } catch (e) {
                        console.warn('Could not fetch vehicles:', e.message);
                    }

                    let payments = [];
                    try {
                        const payToken = await getAuthToken();
                        if (payToken) {
                            const payResp = await fetch(`${API_BASE}/mpesa/mpesa/payments`, {
                                headers: { 'Authorization': `Bearer ${payToken}` }
                            });
                            if (payResp.ok) {
                                const payJson = await payResp.json();
                                payments = payJson.payments || [];
                            }
                        }
                    } catch (e) {
                        console.warn('Could not fetch payments from backend:', e.message);
                    }

                    let unlockedServiceIds = [];
                    try {
                        const svcToken = await getAuthToken();
                        if (svcToken) {
                            const userSvcResp = await fetch(`${API_BASE}/mpesa/mpesa/user/services`, {
                                headers: { 'Authorization': `Bearer ${svcToken}` }
                            });
                            if (userSvcResp.ok) {
                                const userSvcJson = await userSvcResp.json();
                                unlockedServiceIds = (userSvcJson.services || []).map(s => s.service_id);
                                console.log('🔓 Unlocked services from backend:', unlockedServiceIds);
                            }
                        }
                    } catch (e) {
                        console.warn('Could not fetch user services from backend:', e.message);
                    }

                    let requests = [];
                    try {
                        if (currentUser) {
                            const { data, error } = await supabaseClient
                                .from('requests')
                                .select('*')
                                .eq('user_id', currentUser.id)
                                .order('created_at', { ascending: false });
                            if (!error) requests = data || [];
                        }
                    } catch (e) {
                        console.warn('Could not fetch requests:', e.message);
                    }

                    let notifications = [];
                    try {
                        if (currentUser) {
                            const { data, error } = await supabaseClient
                                .from('notifications')
                                .select('*')
                                .eq('user_id', currentUser.id)
                                .order('created_at', { ascending: false });
                            if (!error) notifications = data || [];
                        }
                    } catch (e) {
                        console.warn('Could not fetch notifications:', e.message);
                    }

                    const unlockedSet = new Set(unlockedServiceIds);
                    services = services.map(s => ({
                        ...s,
                        purchased: unlockedSet.has(s.id),
                        status: unlockedSet.has(s.id) ? 'active' : 'locked'
                    }));

                    console.log('✅ Final services:', services);

                    const pendingRequests = requests ? requests.filter(r => r.status === 'pending' || r.status === 'paid').length : 0;

                    dashboardData = {
                        stats: {
                            vehicles: vehicles ? vehicles.length : 0,
                            requests: pendingRequests,
                            active_services: unlockedServiceIds.length || 0,
                            amount_spent: payments ? payments.reduce((sum, p) => sum + num(p.amount), 0) : 0,
                            fleet_value: vehicles ? vehicles.reduce((sum, v) => sum + num(v.value), 0) : 0,
                            monthly_running_cost: 45000
                        },
                        services: services,
                        vehicles: vehicles || [],
                        requests: requests || [],
                        payments: payments || [],
                        notifications: notifications || []
                    };

                    renderDashboard(dashboardData);

                } catch (error) {
                    console.error('❌ Dashboard load error:', error);
                    showToast('Error loading dashboard: ' + error.message, 'error');
                }
            }

            // ─── Render Functions ────────────────────────────────────
            function renderDashboard(data) {
                const stats = data.stats || {};
                
                const setText = (id, text) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = text;
                };
                
                setText('statVehicles', stats.vehicles || 0);
                setText('statRequests', stats.requests || 0);
                setText('statServices', stats.active_services || 0);
                setText('statSpent', 'KES ' + num(stats.amount_spent).toLocaleString());
                setText('statFleetValue', 'KES ' + num(stats.fleet_value).toLocaleString());
                setText('statMonthlyCost', 'KES ' + num(stats.monthly_running_cost).toLocaleString());

                setText('vehicleBadge', stats.vehicles || 0);
                setText('reportBadge', 0);

                renderVehicles(data.vehicles || []);
                renderServices(data.services || []);
                renderRequests(data.requests || []);
                renderPayments(data.payments || []);
                renderNotifications(data.notifications || []);
                
                setText('requestsCountLabel', `(${(data.requests || []).length})`);
                setText('vehicleCountLabel', `(${(data.vehicles || []).length})`);
                setText('serviceCountLabel', `(${(data.services || []).length})`);
                setText('paymentsCountLabel', `(${(data.payments || []).length})`);
                setText('notificationsCountLabel', `(${(data.notifications || []).length})`);
            }

            function renderVehicles(vehicles) {
                if (!vehicleGrid) return;
                
                if (!vehicles || vehicles.length === 0) {
                    vehicleGrid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <div class="icon">🚗</div>
                            <h3>No Vehicles Added</h3>
                            <p>Add your first vehicle to start tracking.</p>
                            <button class="btn-sm-primary" onclick="openAddVehicleModal()">➕ Add Your First Vehicle</button>
                        </div>
                    `;
                    return;
                }

                vehicleGrid.innerHTML = vehicles.map(v => `
                    <div class="vehicle-card">
                        <div class="top">
                            <span class="plate">${escapeHtml(v.plate || 'N/A')}</span>
                            <span class="status-badge ${v.verified ? 'completed' : 'pending'}">${v.verified ? '✅ Verified' : '📝 Pending'}</span>
                        </div>
                        <div class="make-model">${escapeHtml(v.make_model || 'Unknown Vehicle')}</div>
                        <div style="font-size:12px;color:var(--text-muted);">${v.year ? `Year: ${v.year}` : ''} ${v.vin ? `· VIN: ${v.vin}` : ''}</div>
                        <div class="details-grid">
                            <div class="item">📏 Mileage: <strong>${num(v.mileage).toLocaleString()} km</strong></div>
                            <div class="item">💰 Value: <strong>KES ${num(v.value).toLocaleString()}</strong></div>
                            <div class="item">⛽ Running Cost: <strong>KES ${num(v.running_cost).toFixed(2)}/km</strong></div>
                            <div class="item">📊 TCO: <strong>KES ${num(v.tco).toLocaleString()}</strong></div>
                        </div>
                        <div class="actions">
                            <button class="btn-sm-primary" onclick="viewVehicle('${v.id}')">View</button>
                            <button class="btn-sm-outline" onclick="openNewRequestModal()">📝 Request</button>
                            <button class="btn-sm-danger" onclick="deleteVehicle('${v.id}')">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }

            function renderServices(services) {
                if (!servicesGrid) return;
                
                if (!services || services.length === 0) {
                    servicesGrid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <div class="icon">⚡</div>
                            <h3>No Services Available</h3>
                            <p>Check back later for new services.</p>
                        </div>
                    `;
                    return;
                }

                servicesGrid.innerHTML = services.map(s => {
                    const isPurchased = s.purchased || s.status === 'purchased' || s.status === 'active';
                    const statusClass = isPurchased ? 'purchased' : 'locked';
                    const statusText = isPurchased ? '✅ Active' : '🔒 Locked';
                    const btnText = isPurchased ? '🚀 Open Service' : `💰 Purchase ${num(s.price)} KES`;
                    const btnClass = isPurchased ? 'purchased' : 'locked';

                    return `
                        <div class="service-card">
                            ${isPurchased ? '<span class="purchase-badge">✅ Purchased</span>' : ''}
                            <div class="service-icon">${s.icon || '📦'}</div>
                            <div class="service-name">${escapeHtml(s.name)}</div>
                            <span class="service-status ${statusClass}">${statusText}</span>
                            <div class="service-price">${isPurchased ? 'Active' : 'KES ' + num(s.price).toLocaleString()}</div>
                            <button class="btn-access ${btnClass}" onclick="handleServiceAction('${s.id}')">
                                ${btnText}
                            </button>
                        </div>
                    `;
                }).join('');
            }

            // ─── Payment Functions ────────────────────────────────────
            window.openPaymentModal = function(service) {
                console.log('💰 Opening payment modal for:', service.name);
                selectedService = service;
                confirmedCheckoutId = null;
                checkoutRequestId = null;
                unlockInFlightFor = null;

                const nameEl = document.getElementById('paymentServiceName');
                const amountEl = document.getElementById('paymentAmount');
                const totalEl = document.getElementById('paymentTotal');
                const phoneEl = document.getElementById('mpesaPhone');
                const phoneWrapper = document.getElementById('phoneInputWrapper');
                
                if (nameEl) nameEl.textContent = service.name || 'Service';
                if (amountEl) amountEl.textContent = 'KES ' + num(service.price).toLocaleString();
                if (totalEl) totalEl.textContent = 'KES ' + num(service.price).toLocaleString();
                
                if (phoneEl) {
                    phoneEl.value = '';
                    phoneEl.placeholder = '0700000000 or 0110000000';
                }
                if (phoneWrapper) phoneWrapper.classList.remove('error');
                
                const modal = document.getElementById('paymentModal');
                if (modal) modal.classList.add('open');
                
                updateWorkflowStep(3);
            };

            window.closePaymentModal = function(opts) {
                opts = opts || {};
                const modal = document.getElementById('paymentModal');
                if (modal) modal.classList.remove('open');
                selectedService = null;
                pendingServiceRedirect = null;
                pendingRequestId = null;
                isProcessingPayment = false;
                isWaitingForPayment = false;
                if (!opts.keepConfirmed) {
                    confirmedCheckoutId = null;
                }
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
                const payBtn = document.getElementById('payNowBtn');
                if (payBtn) {
                    payBtn.disabled = false;
                    payBtn.textContent = '💳 Pay Now';
                }
                const overlay = document.getElementById('paymentOverlay');
                if (overlay) {
                    overlay.classList.remove('open');
                    const spinner = document.getElementById('paymentSpinner');
                    if (spinner) spinner.style.display = 'block';
                }
                updateWorkflowStep(3);
            };

            window.processPayment = async function() {
                const phoneEl = document.getElementById('mpesaPhone');
                const payBtn = document.getElementById('payNowBtn');
                const phoneWrapper = document.getElementById('phoneInputWrapper');

                let rawPhone = phoneEl ? phoneEl.value.trim() : '';

                if (!rawPhone) {
                    showToast('Please enter your M-Pesa phone number', 'error');
                    if (phoneWrapper) phoneWrapper.classList.add('error');
                    if (phoneEl) phoneEl.focus();
                    setTimeout(() => {
                        if (phoneWrapper) phoneWrapper.classList.remove('error');
                    }, 3000);
                    return;
                }

                let phone = rawPhone.replace(/\D/g, '');
                if (phone.startsWith('254')) phone = phone.slice(3);
                if (phone.startsWith('0')) phone = phone.slice(1);

                if (!/^(7\d{8}|11\d{7})$/.test(phone)) {
                    showToast('Please enter a valid Safaricom number (07X or 011X)', 'error');
                    if (phoneWrapper) phoneWrapper.classList.add('error');
                    setTimeout(() => {
                        if (phoneWrapper) phoneWrapper.classList.remove('error');
                    }, 3000);
                    return;
                }

                if (!selectedService) {
                    showToast('No service selected', 'error');
                    return;
                }

                // ─── Check if user already has 4 services ─────────────
                const purchasedCount = dashboardData?.services?.filter(s => s.purchased).length || 0;
                if (purchasedCount >= 4) {
                    showToast('⚠️ You already have 4 active services. Please use or cancel one first.', 'warning');
                    return;
                }

                if (isProcessingPayment) return;

                const token = await requireAuthToken();
                if (!token) return;

                isProcessingPayment = true;
                confirmedCheckoutId = null;
                if (payBtn) {
                    payBtn.disabled = true;
                    payBtn.textContent = '⏳ Processing...';
                }

                const overlay = document.getElementById('paymentOverlay');
                const spinner = document.getElementById('paymentSpinner');
                const statusText = document.getElementById('paymentStatusText');
                const statusDetail = document.getElementById('paymentStatusDetail');

                if (overlay) {
                    if (spinner) spinner.style.display = 'block';
                    if (statusText) statusText.textContent = 'Initiating M-Pesa payment...';
                    if (statusDetail) statusDetail.textContent = 'Please wait...';
                    overlay.classList.add('open');
                }

                const requestBody = {
                    phone: phone,
                    service_id: selectedService.id,
                    description: `Auto-D: ${selectedService.name}`,
                    user_id: currentUser.id,
                    request_id: pendingRequestId || null
                };

                try {
                    const response = await fetch(`${API_BASE}/mpesa/mpesa/stkpush`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(requestBody)
                    });

                    const data = await response.json();

                    if (response.status === 403) {
                        const errorMsg = data.detail || data.message || 'Payment service is not available. Please try again later.';
                        showToast('🔒 ' + errorMsg, 'warning');
                        if (overlay) {
                            if (statusText) statusText.textContent = '🔒 Payment Service Unavailable';
                            if (statusDetail) statusDetail.textContent = 'Please contact support for assistance.';
                            if (spinner) spinner.style.display = 'none';
                        }
                        setTimeout(() => {
                            if (overlay) overlay.classList.remove('open');
                            closePaymentModal();
                        }, 3000);
                        return;
                    }

                    if (!response.ok) {
                        const errorMsg = data.detail || data.error || data.message || 'Payment initiation failed';
                        showToast('❌ ' + errorMsg, 'error');
                        if (overlay) {
                            if (statusText) statusText.textContent = '❌ Payment Failed';
                            if (statusDetail) statusDetail.textContent = errorMsg;
                            if (spinner) spinner.style.display = 'none';
                        }
                        setTimeout(() => {
                            if (overlay) overlay.classList.remove('open');
                            closePaymentModal();
                        }, 3000);
                        return;
                    }

                    const checkoutId = data.checkout_request_id || data.checkoutRequestID;
                    if (!checkoutId) {
                        showToast('❌ No checkout ID returned by server', 'error');
                        if (overlay) overlay.classList.remove('open');
                        closePaymentModal();
                        return;
                    }
                    checkoutRequestId = checkoutId;
                    const targetServiceId = pendingServiceRedirect || selectedService.id;

                    if (overlay) {
                        if (statusText) statusText.textContent = '📱 STK Push Sent!';
                        if (statusDetail) statusDetail.textContent = 'Please check your phone and enter your M-Pesa PIN.';
                    }
                    showToast('📱 STK Push sent! Check your phone.', 'info');

                    isWaitingForPayment = true;
                    const paymentSuccess = await waitForPayment(checkoutId, targetServiceId);

                    if (!paymentSuccess) {
                        if (payBtn) {
                            payBtn.disabled = false;
                            payBtn.textContent = '💳 Pay Now';
                        }
                        isProcessingPayment = false;
                        isWaitingForPayment = false;
                        updateWorkflowStep(3);
                    }

                } catch (error) {
                    console.error('Payment error:', error);
                    if (overlay) {
                        if (statusText) statusText.textContent = '❌ Payment Error';
                        if (statusDetail) statusDetail.textContent = error.message || 'Please try again.';
                        if (spinner) spinner.style.display = 'none';
                    }
                    showToast('❌ Payment error: ' + error.message, 'error');
                    setTimeout(() => {
                        if (overlay) overlay.classList.remove('open');
                        closePaymentModal();
                    }, 2000);
                } finally {
                    isProcessingPayment = false;
                    if (payBtn) {
                        payBtn.disabled = false;
                        payBtn.textContent = '💳 Pay Now';
                    }
                }
            };

            async function waitForPayment(checkoutId, serviceId, maxAttempts = MAX_POLLING_ATTEMPTS) {
                const statusText = document.getElementById('paymentStatusText');
                const statusDetail = document.getElementById('paymentStatusDetail');
                const spinner = document.getElementById('paymentSpinner');

                let attempts = 0;
                let isComplete = false;
                let startTime = Date.now();

                return new Promise((resolve) => {
                    if (pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }

                    pollTimer = setInterval(async () => {
                        if (!isWaitingForPayment || checkoutRequestId !== checkoutId) {
                            clearInterval(pollTimer);
                            pollTimer = null;
                            resolve(false);
                            return;
                        }

                        attempts++;
                        const elapsedSeconds = Math.round((Date.now() - startTime) / 1000);

                        try {
                            if (statusText) {
                                statusText.textContent = `⏳ Waiting for M-Pesa confirmation... (${elapsedSeconds}s)`;
                            }
                            if (statusDetail) {
                                statusDetail.textContent = `Please check your phone and enter your M-Pesa PIN. (${Math.round(attempts * 2)}s)`;
                            }

                            const pollToken = await getAuthToken();
                            const headers = { 'Accept': 'application/json' };
                            if (pollToken) {
                                headers['Authorization'] = `Bearer ${pollToken}`;
                            }

                            const statusResponse = await fetch(`${API_BASE}/mpesa/mpesa/status/${encodeURIComponent(checkoutId)}`, {
                                headers: headers
                            });

                            if (!statusResponse.ok) {
                                if (statusResponse.status === 404) {
                                    if (attempts > 20 && !isComplete) {
                                        if (statusDetail) {
                                            statusDetail.innerHTML = `
                                                <div style="display:flex;flex-direction:column;gap:12px;align-items:center;max-width:300px;">
                                                    <p style="font-size:14px;color:var(--text-secondary);">
                                                        Still waiting for payment confirmation...
                                                    </p>
                                                    <p style="font-size:12px;color:var(--text-muted);">
                                                        Did you enter your PIN on your phone?
                                                    </p>
                                                    <button id="retryPinBtn"
                                                            style="padding:10px 20px;background:var(--primary);color:#0f172a;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;width:100%;">
                                                        🔄 I've Entered My PIN
                                                    </button>
                                                </div>
                                            `;
                                            const btn = document.getElementById('retryPinBtn');
                                            if (btn) btn.addEventListener('click', () => window.retryPaymentConfirmation(checkoutId, serviceId));
                                        }
                                    }
                                    return;
                                }
                                console.warn('Status check error:', statusResponse.status);
                                return;
                            }

                            const statusData = await statusResponse.json();
                            const normalized = (statusData.status || '').toString().toLowerCase();

                            if (normalized === 'completed' || normalized === 'success' || normalized === 'paid' ||
                                normalized === 'complete' || statusData.success === true) {

                                isComplete = true;
                                clearInterval(pollTimer);
                                pollTimer = null;

                                if (statusText) statusText.innerHTML = '✅ Payment Successful! 🎉';
                                if (statusDetail) statusDetail.textContent = 'Confirming with server...';

                                showToast('✅ Payment received, confirming...', 'success');

                                const confirmed = await unlockServiceAfterPayment(checkoutId, serviceId);
                                resolve(confirmed);
                                return;

                            } else if (normalized === 'failed' || normalized === 'error' || normalized === 'cancelled' ||
                                       normalized === 'canceled' || normalized === 'timeout') {

                                isComplete = true;
                                clearInterval(pollTimer);
                                pollTimer = null;

                                if (statusText) statusText.textContent = '❌ Payment Failed';
                                if (statusDetail) statusDetail.textContent = statusData.description || statusData.message || 'Please try again.';
                                if (spinner) spinner.style.display = 'none';

                                showToast('❌ Payment failed: ' + (statusData.description || 'Please try again'), 'error');
                                resolve(false);
                                return;
                            }

                            if (attempts >= maxAttempts) {
                                isComplete = true;
                                clearInterval(pollTimer);
                                pollTimer = null;

                                if (statusText) statusText.textContent = '⏰ Payment Timeout';
                                if (statusDetail) {
                                    statusDetail.innerHTML = `
                                        <div style="display:flex;flex-direction:column;gap:12px;align-items:center;max-width:300px;">
                                            <p style="font-size:14px;color:var(--text-secondary);">
                                                Payment confirmation timed out after 4 minutes.
                                            </p>
                                            <p style="font-size:12px;color:var(--text-muted);">
                                                If you've already paid, click below to confirm.
                                            </p>
                                            <button id="manualConfirmBtn"
                                                    style="padding:12px 24px;background:var(--success);color:#000;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;width:100%;">
                                                ✅ I've Completed Payment
                                            </button>
                                        </div>
                                    `;
                                    const btn = document.getElementById('manualConfirmBtn');
                                    if (btn) btn.addEventListener('click', () => window.manualConfirmPayment(checkoutId, serviceId));
                                }
                                if (spinner) spinner.style.display = 'none';

                                showToast('⏰ Payment confirmation timed out. Please check your M-Pesa.', 'warning');
                                resolve(false);
                                return;
                            }

                        } catch (pollError) {
                            console.warn('Polling error:', pollError);
                            if (attempts >= maxAttempts) {
                                clearInterval(pollTimer);
                                pollTimer = null;
                                resolve(false);
                            }
                        }
                    }, 2000);
                });
            }

            async function unlockServiceAfterPayment(checkoutId, serviceId) {
                if (unlockInFlightFor === checkoutId) {
                    return confirmedCheckoutId === checkoutId;
                }
                if (confirmedCheckoutId === checkoutId) {
                    return true;
                }
                unlockInFlightFor = checkoutId;

                try {
                    const token = await getAuthToken();
                    if (!token) {
                        showToast('⚠️ Authentication error. Please log in again.', 'error');
                        return false;
                    }

                    const response = await fetch(`${API_BASE}/mpesa/mpesa/confirm/${encodeURIComponent(checkoutId)}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    let data = {};
                    try {
                        data = await response.json();
                    } catch (e) {
                        data = {};
                    }
                    console.log('📥 Confirm response:', data);

                    const backendConfirmed = response.ok && (data.success === true || data.status === 'completed');

                    if (!backendConfirmed) {
                        showToast('⚠️ Payment could not be confirmed yet. Please wait or contact support.', 'warning');
                        const overlay = document.getElementById('paymentOverlay');
                        const statusText = document.getElementById('paymentStatusText');
                        const statusDetail = document.getElementById('paymentStatusDetail');
                        const spinner = document.getElementById('paymentSpinner');
                        if (statusText) statusText.textContent = '⚠️ Not confirmed yet';
                        if (statusDetail) statusDetail.textContent = data.message || data.detail || 'Please try again in a moment.';
                        if (spinner) spinner.style.display = 'none';
                        return false;
                    }

                    confirmedCheckoutId = checkoutId;

                    // ─── UPDATE LOCAL STATE ───────────────────────────
                    if (dashboardData && dashboardData.services) {
                        const svc = dashboardData.services.find(s => s.id === serviceId);
                        if (svc) {
                            svc.purchased = true;
                            svc.status = 'active';
                        }
                    }
                    renderServices(dashboardData.services || []);

                    const overlay = document.getElementById('paymentOverlay');
                    const statusText = document.getElementById('paymentStatusText');
                    const statusDetail = document.getElementById('paymentStatusDetail');
                    const spinner = document.getElementById('paymentSpinner');

                    if (overlay) {
                        if (spinner) spinner.style.display = 'none';
                        if (statusText) statusText.innerHTML = '✅ Payment Successful! 🎉';
                        if (statusDetail) statusDetail.textContent = 'Service unlocked!';
                    }

                    showToast(`✅ ${selectedService?.name || 'Service'} unlocked successfully!`, 'success');
                    updateWorkflowStep(5);
                    isWaitingForPayment = false;

                    // ─── SHOW SUCCESS OVERLAY ─────────────────────────
                    const serviceName = selectedService?.name || SERVICE_NAMES[serviceId] || serviceId;
                    showSuccessOverlay(serviceId, serviceName);

                    setTimeout(() => {
                        if (overlay) overlay.classList.remove('open');
                        closePaymentModal({ keepConfirmed: true });
                    }, 500);

                    return true;

                } catch (error) {
                    console.error('Unlock error:', error);
                    showToast('❌ Error confirming payment: ' + error.message, 'error');
                    return false;
                } finally {
                    if (unlockInFlightFor === checkoutId) {
                        unlockInFlightFor = null;
                    }
                }
            }

            window.manualConfirmPayment = async function(checkoutId, serviceId) {
                const statusText = document.getElementById('paymentStatusText');
                const statusDetail = document.getElementById('paymentStatusDetail');
                const spinner = document.getElementById('paymentSpinner');

                if (statusText) statusText.textContent = '⏳ Confirming payment...';
                if (statusDetail) statusDetail.textContent = 'Please wait...';
                if (spinner) spinner.style.display = 'block';

                await unlockServiceAfterPayment(checkoutId, serviceId);
            };

            window.retryPaymentConfirmation = async function(checkoutId, serviceId) {
                const statusText = document.getElementById('paymentStatusText');
                const statusDetail = document.getElementById('paymentStatusDetail');
                const spinner = document.getElementById('paymentSpinner');

                if (statusText) statusText.textContent = '⏳ Retrying confirmation...';
                if (statusDetail) statusDetail.textContent = 'Checking payment status...';
                if (spinner) spinner.style.display = 'block';

                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }

                isWaitingForPayment = true;
                const result = await waitForPayment(checkoutId, serviceId, 20);
                if (!result) {
                    if (statusText) statusText.textContent = '⏳ Still waiting...';
                    if (statusDetail) {
                        statusDetail.innerHTML = `
                            <div style="display:flex;flex-direction:column;gap:12px;align-items:center;max-width:300px;">
                                <p style="font-size:14px;color:var(--text-secondary);">
                                    Still waiting for confirmation.
                                </p>
                                <button id="manualConfirmBtn2"
                                        style="padding:12px 24px;background:var(--success);color:#000;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;width:100%;">
                                    ✅ I've Completed Payment
                                </button>
                            </div>
                        `;
                        const btn = document.getElementById('manualConfirmBtn2');
                        if (btn) btn.addEventListener('click', () => window.manualConfirmPayment(checkoutId, serviceId));
                    }
                    if (spinner) spinner.style.display = 'none';
                }
            };

            // ─── Vehicles ─────────────────────────────────────────────
            window.openAddVehicleModal = function() {
                const yearSelect = document.getElementById('vehicleYear');
                if (yearSelect) {
                    const currentYear = new Date().getFullYear();
                    yearSelect.innerHTML = '<option value="">Select year</option>';
                    for (let y = currentYear; y >= 1980; y--) {
                        yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
                    }
                }
                
                ['vehiclePlate', 'vehicleMake', 'vehicleVin', 'vehicleMileage'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = '';
                });
                if (yearSelect) yearSelect.value = '';
                
                const modal = document.getElementById('addVehicleModal');
                if (modal) modal.classList.add('open');
            };

            window.closeAddVehicleModal = function() {
                const modal = document.getElementById('addVehicleModal');
                if (modal) modal.classList.remove('open');
            };

            window.addVehicle = async function() {
                const plate = document.getElementById('vehiclePlate');
                const make = document.getElementById('vehicleMake');
                const vin = document.getElementById('vehicleVin');
                const year = document.getElementById('vehicleYear');
                const mileage = document.getElementById('vehicleMileage');

                const plateVal = plate ? plate.value.trim() : '';
                const makeVal = make ? make.value.trim() : '';

                if (!plateVal || !makeVal) {
                    showToast('Please enter plate number and make/model', 'error');
                    return;
                }

                try {
                    if (!supabaseClient) initSupabase();

                    const { data, error } = await supabaseClient
                        .from('vehicles')
                        .insert({
                            user_id: currentUser.id,
                            plate: plateVal.toUpperCase(),
                            make_model: makeVal,
                            vin: vin?.value.trim() || null,
                            year: year?.value || null,
                            mileage: parseInt(mileage?.value) || 0,
                            created_at: new Date().toISOString()
                        })
                        .select()
                        .single();

                    if (error) throw error;

                    showToast('✅ Vehicle added successfully!', 'success');
                    closeAddVehicleModal();
                    await loadDashboard();

                } catch (error) {
                    console.error('Add vehicle error:', error);
                    showToast(error.message || 'Failed to add vehicle', 'error');
                }
            };

            window.deleteVehicle = async function(id) {
                if (!confirm('Are you sure you want to delete this vehicle?')) return;

                try {
                    if (!supabaseClient) initSupabase();

                    const { error } = await supabaseClient
                        .from('vehicles')
                        .delete()
                        .eq('id', id)
                        .eq('user_id', currentUser.id);

                    if (error) throw error;

                    showToast('🗑️ Vehicle deleted', 'info');
                    await loadDashboard();

                } catch (error) {
                    console.error('Delete vehicle error:', error);
                    showToast(error.message || 'Failed to delete vehicle', 'error');
                }
            };

            // ─── Stub Functions ──────────────────────────────────────
            window.viewVehicle = function(id) { showToast(`📊 Viewing vehicle ${id}`, 'info'); };
            window.viewReport = function(id) { showToast(`📄 Viewing report ${id}`, 'info'); };
            window.viewNotification = function(id) { showToast(`🔔 Viewing notification ${id}`, 'info'); };
            window.generateReport = function() { showToast('📄 Use the Valuation, Mileage, or Ownership services.', 'info'); };
            window.viewReportForRequest = function(id) { showToast(`📄 Viewing report for request ${id}`, 'info'); };
            window.downloadReportForRequest = function(id) { showToast(`⬇️ Downloading report for request ${id}`, 'info'); };
            window.generateReportForRequest = function(id) { showToast(`📄 Generating report for request ${id}`, 'info'); };

            // ─── Sidebar & Logout ──────────────────────────────────
            window.toggleSidebar = function() {
                const sidebar = document.getElementById('sidebar');
                if (sidebar) sidebar.classList.toggle('open');
            };

            window.handleLogout = async function() {
                try {
                    try {
                        const token = await getAuthToken();
                        if (token) {
                            await fetch(`${API_BASE}/auth/logout`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                        }
                    } catch (e) {
                        console.warn('Backend logout call failed (continuing anyway):', e.message);
                    }

                    if (supabaseClient) await supabaseClient.auth.signOut();
                    localStorage.removeItem('auto_d_user');
                    window.location.href = 'https://auto-d.meipressgroup.com/';
                } catch (error) {
                    window.location.href = 'https://auto-d.meipressgroup.com/';
                }
            };

            // ─── Close modals on outside click ───
            document.addEventListener('click', function(e) {
                const modals = ['addVehicleModal', 'paymentModal', 'newRequestModal'];
                modals.forEach(id => {
                    const modal = document.getElementById(id);
                    if (modal && e.target === modal) {
                        const closeFn = id === 'addVehicleModal' ? closeAddVehicleModal : 
                                       id === 'paymentModal' ? closePaymentModal : 
                                       closeNewRequestModal;
                        if (typeof closeFn === 'function') closeFn();
                    }
                });
            });

            // ─── Phone input validation ───
            document.addEventListener('DOMContentLoaded', function() {
                const phoneInput = document.getElementById('mpesaPhone');
                if (phoneInput) {
                    phoneInput.addEventListener('input', function() {
                        let cleaned = this.value.replace(/\D/g, '');
                        if (cleaned.length > 10) cleaned = cleaned.substring(0, 10);
                        if (this.value !== cleaned) this.value = cleaned;
                    });
                }
            });

            // ─── Init ──────────────────────────────────────────────────
            (async function() {
                console.log('🚗 Auto-D Kenya Dashboard');
                console.log('🔗 API Base:', API_BASE);
                console.log('✅ Payment flow: Success overlay + service unlock');
                console.log('⏱️ Payment timeout: 4 minutes');
                console.log('📊 Max services per user: 4');
                console.log('🔑 navigateToService: Opens payment modal for locked services');

                initSupabase();

                const isAuthenticated = await checkAuth();

                if (!isAuthenticated) {
                    showToast('Please sign in to access your dashboard', 'warning');
                    setTimeout(() => {
                        window.location.href = 'https://auto-d.meipressgroup.com/';
                    }, 1500);
                    return;
                }

                await loadDashboard();
                updateWorkflowStep(1);

                if (supabaseClient) {
                    supabaseClient.auth.onAuthStateChange((event, session) => {
                        if (event === 'SIGNED_OUT') {
                            window.location.href = 'https://auto-d.meipressgroup.com/';
                        } else if (event === 'SIGNED_IN' && session?.user) {
                            currentUser = session.user;
                            localStorage.setItem('auto_d_user', JSON.stringify({
                                ...session.user,
                                access_token: session.access_token
                            }));
                            updateUserUI();
                            loadDashboard();
                        }
                    });
                }
            })();

        })();
    </script>
